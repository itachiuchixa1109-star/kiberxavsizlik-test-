<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}

.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px}

.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-text)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-text)}

.rev b{display:block;margin-bottom:4px}
.rev .a{border-radius:6px;padding:4px 8px;margin:3px 0;font-size:.95rem}
.hidden{display:none}
input[type=number]{font:inherit;width:90px;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text)}

<script>
const DATA=[["Kiberxavfsizlik tushunchasiga berilgan eng to‘liq va tizimli ta’rif qaysi javobda to‘g‘ri bayon etilgan?", "Tizimlar, tarmoqlar va ma’lumotlarni ruxsatsiz kirish hamda buzish kabi salbiy holatlardan himoya qilishdir.", "Tashkilot kompyuterlariga faqat antivirus dasturlarini o‘rnatish va ularning bazasini yangilab turishdir.", "Foydalanuvchi parollarini doimiy o‘zgartirib turish orqali barcha tarmoq xizmatlarini to‘liq cheklashdir.", "Faqatgina dasturiy kodlardagi sintaktik xatoliklarni aniqlab, ularni ishlab chiqaruvchiga yetkazishdir."], ["CIA triadasiga kiruvchi maxfiylik (Confidentiality) tamoyilining asosiy mazmuni nimadan iborat?", "Axborot faqat tegishli vakolat va ruxsat berilgan shaxslargagina oshkor bo‘lishini ta’minlashdir.", "Ma’lumotlar uzatish jarayonida noqonuniy o‘zgarishlarga mutlaqo uchramasligini kafolatlashdir.", "Tizim va unga tegishli barcha resurslarning doimiy ravishda uzluksiz ishlashini yo‘lga qo‘yishdir.", "Foydalanuvchilarning barcha tarmoq harakatlarini maxsus jurnalga avtomatik tarzda qayd etishdir."], ["CIA triadasidagi yaxlitlik (Integrity) talabi buzilishiga quyidagilardan qaysi biri aniq misol bo‘ladi?", "Bazasidagi talabalar fan baholarining ruxsatsiz va asossiz ravishda o‘zgartirib yuborilishi.", "Dasturiy tizim serveri texnik nosozlik sababli talabalarga xizmat ko‘rsatmay to‘xtab qolishi.", "Maxfiy bo‘lgan talabalar telefon raqamlari begona foydalanuvchilarga to‘liq oshkor bo‘lishi.", "Tizim administratorining serverga kirish huquqini belgilangan vaqtinchalik yo‘qotib qo‘yishi."], ["Kiberxavfsizlikda autentiklik (authenticity) tushunchasi nimani anglatadi?", "Axborot manbasining yoki murojaat qilayotgan subyektning haqiqiyligini tekshirishni.", "Foydalanuvchi bajargan barcha amallarni maxsus ma’lumotlar bazasiga muhrlab borishni.", "Dasturiy tizimning favqulodda to‘xtashlarsiz uzluksiz tarzda faoliyat ko‘rsatishini.", "Tizimdagi barcha ruxsatsiz kiritilgan o‘zgarishlarni zudlik bilan orqaga qaytarishni."], ["Tahdid (threat) va zaiflik (vulnerability) tushunchalari o‘rtasidagi farq qaysi javobda to‘g‘ri keltirilgan?", "Tahdid zarar yetkazishi mumkin bo‘lgan omildir, zaiflik esa tizimda mavjud bo‘lgan kamchilikdir.", "Tahdid tizim kodidagi xatolikdir, zaiflik esa begona buzg‘unchi tomonidan qilingan urinishdir.", "Tahdid tizimning to‘xtab qolishidir, zaiflik esa foydalanuvchining hisobini egallab olish jarayonidir.", "Tahdid faqat ichki xodimlar xatosidir, zaiflik esa tashqi tarmoqdan yuboriladigan zararli dasturdir."], ["Ma’ruza matnidagi amaliy misolga ko‘ra, oddiy va oson topiladigan parol nima hisoblanadi?", "Tizim himoyasidagi zaiflik.", "Tashqaridagi tahdid manbai.", "Zararli hujum qilish usuli.", "Kutilmagan xavfsizlik voqeasi."], ["Soddalashtirilgan kiberxavfsizlik tahlilida risk (Risk) qanday formula yordamida baholanadi?", "Risk = ehtimollik × ta’sir", "Risk = tahdidlar + zaiflik", "Risk = xarajatlar ÷ zaiflik", "Risk = aktivlar × himoyalar"], ["Ma’lumotlarni zaxiralashning mashhur '3-2-1' tamoyili qanday talablarni ilgari suradi?", "Ma’lumotning kamida uch nusxasi, ikki turli tashuvchida, bitta nusxasi esa alohida joyda saqlanadi.", "Ma’lumot uch oyda bir marta, ikki xil dastur orqali va bitta lokal fleshka ichiga doimiy ko‘chiriladi.", "Ma’lumot uchta tarmoq bo‘limida, ikkita asosiy serverda va bitta shifrlangan qattiq diskda saqlanadi.", "Ma’lumot uchta mutaxassis tomonidan, ikki xil kalit bilan va bitta markaziy bazada qayta tiklanadi."], ["Zaxira nusxalarini yaratish jarayonida ularning amaliy foydasini kafolatlaydigan eng muhim chora nima?", "Zaxiradan tizimni qayta tiklash bo‘yicha davriy amaliy sinovlarni o‘tkazib turish.", "Zaxira nusxalarini faqat bir xil ishlab chiqaruvchining qattiq disklariga yozib borish.", "Zaxiralangan barcha fayllarni arxivlashdan oldin xodimlar ko‘rigidan o‘tkazib chiqish.", "Zaxiralash jarayonini faqat ish vaqti tugagandan so‘ng tungi vaqtda amalga oshirish."], ["Python kodidagi 'hashlib.sha256(fayl.read_bytes()).hexdigest()' amali CIA ning qaysi jihatini ta’minlashda qo‘llanadi?", "Fayl tarkibi noqonuniy o‘zgartirilmaganligini ya’ni yaxlitligini nazorat qilishda.", "Fayl ichidagi ma’lumotlarning begona ko‘zlardan to‘liq maxfiyligini saqlashda.", "Faylning server xotirasida doimiy va uzluksiz foydalanuvchanligini ta’minlashda.", "Fayl yaratuvchisining shaxsiy hisob yozuvi parolini tekshirib autentifikatsiyalashda."], ["Universitet fayl serveriga fishing orqali kirilgan keysda asosiy zaiflik nimadan iborat bo‘lgan?", "Tizimda ko‘p faktorli autentifikatsiya (MFA) joriy qilinmaganligida.", "Fayl serveri operatsion tizimining o‘z vaqtida yangilanmaganligida.", "Talabalar bazasidagi fayllar o‘lchami haddan tashqari kattaligida.", "Foydalanuvchilarga kompyuter orqali ishlash taqiqlab qo‘yilganligida."], ["Ma’lumotlarni shifrlash usulining amaliy cheklovi to‘g‘risida qaysi xulosa to‘g‘ri?", "Shifrlash ma’lumotni yashirsa-da, dastur mantiqiy xatolari yoki noto‘g‘ri ruxsatlarni tuzatmaydi.", "Shifrlash faqat matnli fayllarga ta’sir qiladi, ammo ma’lumotlar bazasini himoya qila olmaydi.", "Shifrlash amali tizim tezligini oshiradi, biroq xakerlik hujumlarini aniqlash imkonini bermaydi.", "Shifrlash faqat tarmoq segmentatsiyasi to‘liq yakunlangan serverlardagina ishonchli ishlaydi."], ["Xavfsizlik bo‘yicha tashkiliy choralar guruhiga quyidagilardan qaysi biri kiradi?", "Ruxsat berish siyosati, xodimlar yo‘riqnomasi va hodisalar haqida xabar berish tartibi.", "Operatsion tizimlarni yangilash, tarmoqni segmentlash va shifrlash vositalari.", "Ko‘p faktorli autentifikatsiya, tizim jurnallari monitoringi va zaxiralash.", "Antivirus dasturlarini o‘rnatish, fayl devorlarini sozlash va serverlar nazorati."], ["Inkor eta olmaslik (non-repudiation) xususiyatining mohiyati qaysi javobda to‘g‘ri ko‘rsatilgan?", "Tizimda bajarilgan muayyan amalni uning egasiga asosli bog‘lash va rad etishiga yo‘l qo‘ymaslik.", "Tizim buzilgan taqdirda barcha yo‘qolgan fayllarni avtomatik tarzda tiklash imkoniyatini yaratish.", "Tarmoq orqali yuborilayotgan barcha fayllarni bir vaqtning o‘zida turli formatlarda arxivlash.", "Foydalanuvchi hisobiga boshqa qurilmadan kirishga urinish bo‘lganda uni darhol bloklab qo‘yish."], ["Keysni tahlil qilishning 5 bosqichli metodologiyasida 5-qadam nima deb nomlanadi?", "Nazorat chorasi joriy etilgandan keyin ham qoluvchi riskni bayon qilish.", "Zararlangan barcha axborot tizimlarini butunlay o‘chirib, qayta tiklash.", "Hujum sodir etgan shaxsning geografik joylashuvini dasturiy aniqlash.", "Xodimlarning barchasiga yangi murakkab parollar tarqatishni boshlash."], ["Foydalanuvchi xavfsizlik madaniyatining asosiy qoidalaridan biri qaysi javobda to‘g‘ri bayon qilingan?", "Noma’lum havolalarni ochmaslik, manzilni tekshirish va maxfiy ma’lumotlarni boshqalar bilan ulashmaslik.", "Barcha parollarni eslab qolish oson bo‘lishi uchun bir xil qilib belgilash va ish stolida saqlab qo‘yish.", "Tizimdagi g‘ayrioddiy shubhali holatlarni mutaxassislarga bildirmasdan mustaqil ravishda o‘chirib yuborish.", "Ish stoli kompyuterini hech qachon qulflamasdan, boshqa xodimlar erkin foydalanishi uchun ochiq qoldirish."], ["Kerckhoffs tamoyilining zamonaviy kriptografik xavfsizlikdagi asosiy mazmuni nimadan iborat?", "Tizim xavfsizligi algoritmga emas, kalitning maxfiyligiga tayanadi", "Tizim xavfsizligi shifrlash algoritmining sir tutilishiga tayanadi", "Tizim xavfsizligi shifrlanadigan matnning uzun bo‘lishiga tayanadi", "Tizim xavfsizligi apparat vositalarining yopiq ishlashiga tayanadi"], ["O‘rta asrlarda yashagan arab olimi Al-Kindiy kriptotahlil rivojiga qanday hissa qo‘shgan?", "Harflarning uchrash chastotasiga asoslangan tahlil usulini yaratdi", "Matritsali ko‘paytirishga asoslangan yangi shifrlash usulini yaratdi", "Asimmetrik ochiq kalitli shifrlash tizimining ilk modelini yaratdi", "Bir martalik bloknotga asoslangan mutlaq mustahkam shifrni yaratdi"], ["Sezar shifrida k=3 siljish bilan A–Z bo‘yicha 'SALOM' so‘zi qanday ko‘rinishda shifrlanadi?", "VDORP", "UCNQO", "WENSP", "TBMPO"], ["Atbash shifrining asosiy ishlash prinsipi va uning kriptografik zaifligi nimada?", "Alfavitni to‘liq teskari akslantiradi va unda maxfiy kalit mavjud emas", "Alfavitni doimiy uch qadam suradi va uning kalitlar fazosi juda kichik", "Harflarni zigzag usulida joylaydi va harfiy chastotani to‘liq saqlaydi", "Juft belgilarni bloklarga ajratadi va matrisa determinanti nolga teng"], ["Affin shifrida C = (aP + b) mod 26 formulasi bo‘yicha a parametriga qanday talab qo‘yiladi?", "gcd(a, 26) = 1 sharti qanoatlantirilishi va teskari elementi bo‘lishi zarur", "gcd(a, 26) = 2 sharti qanoatlantirilishi va juft sonlardan iborat bo‘lishi zarur", "a qiymati b sonidan doimo katta bo‘lishi va tub bo‘lmagan son bo‘lishi zarur", "a qiymati modul 26 ga karrali bo‘lishi va doim manfiy bo‘lmasligi zarur"], ["Rail Fence shifri klassik tasnifga ko‘ra qaysi turdagi shifrlash usuliga mansub hisoblanadi?", "Transpozitsiya (harflarning joylashuv o‘rnini o‘zgartirish)", "Monoalfavitli (harflarni boshqa yagona belgiga almashtirish)", "Ko‘p alifboli (harflarni o‘zgaruvchan qadam bilan almashtirish)", "Poligrammali (harflarni juftlik jadvali yordamida almashtirish)"], ["Playfair shifrining 5×5 o‘lchamli jadvalida qaysi ikki lotin harfi an’anaviy ravishda bitta katakka birlashtiriladi?", "I va J harflari", "U va V harflari", "C va K harflari", "X va Z harflari"], ["Hill shifrida shifrlash C = K·P (mod 26) amali orqali bajarilganda K matritsasiga qanday shart qo‘yiladi?", "K matritsasi mod 26 bo‘yicha teskarilanuvchan bo‘lishi kerak", "K matritsasining barcha elementlari faqat tub son bo‘lishi kerak", "K matritsasining diagonali doimo nollardan tashkil topishi kerak", "K matritsasining determinanti 26 soniga karrali bo‘lishi kerak"], ["Vijenyer shifrining bir martalik bloknot (one-time pad) xavfsizlik darajasiga yetishi uchun qaysi shart zarur?", "Kalit tasodifiy, xabar uzunligida va faqat bir marta ishlatilishi zarur", "Kalit qisqa so‘z bo‘lib, matn davomida muntazam takrorlanib borishi zar , ping, DNS", "DNS tekshiruvi, tracert, kabel, ping", "Gateway ping, DNS, kabel, tracert", "Netstat tahlili, kabel, gateway, ARP"], ["Axborot xavfsizligida identifikatsiya jarayonining asosiy vazifasi qaysi javobda to‘g‘ri ifodalangan?", "Foydalanuvchining tizimga o‘z kimligi to‘g‘risida login yoki ID orqali dastlabki da’vo kiritishi.", "Foydalanuvchining taqdim etgan da’vosini maxfiy kalit va biometrik belgilar orqali tekshirish.", "Foydalanuvchiga muayyan resurslardan foydalanish uchun ruxsat etilgan huquqlarni belgilash.", "Foydalanuvchining tizim ichida bajargan harakatlarini xavfsizlik jurnallariga yozib borish."], ["Autentifikatsiya tushunchasining mazmuni va uning maqsadi qaysi ta’rifda to‘liq ko‘rsatilgan?", "Kiritilgan login yoki ID da’vosini dalillar (parol, qurilma, biometriya) yordamida tekshirish.", "Foydalanuvchi qaysi ma’lumotlarni ko‘rish va o‘zgartirish huquqiga egaligini qat’iy aniqlash.", "Tizim resurslariga bo‘lgan barcha noqonuniy murojaatlarni doimiy ravishda qayd qilib borish.", "Tarmoqdagi umumiy ma’lumotlar oqimini shifrlash va himoyalangan aloqa kanalini o‘rnatish."], ["Universitet platformasi (HEMIS) misolida avtorizatsiya bosqichiga qaysi jarayon to‘g‘ri keladi?", "Talabaning tizimda faqat o‘ziga tegishli baholar va shaxsiy dars jadvalini ko‘rish huquqi.", "Talabaning shaxsiy loginini tizimga kirish maydoniga dastlabki tarzda to‘g‘ri kiritishi.", "Talaba tomonidan kiritilgan maxfiy parolni tekshirish hamda tasdiqlash omilini so‘rash.", "Tizim xavfsizlik devori orqali talaba qurilmasining IP manzilini tekshirib qabul qilish."], ["Xavfsizlik auditining axborot tizimlaridagi asosiy vazifasi qaysi savolga javob berishdan iborat?", "Foydalanuvchi tizimda qanday amallarni bajardi va uning faoliyati jurnalda qanday aks etdi?", "Foydalanuvchi haqiqatan ham o‘zi da’vo qilayotgan shaxs ekanligi qaysi dalil bilan tasdiqlandi?", "Foydalanuvchi kiritgan shaxsiy identifikator tizim ma’lumotlar bazasida mavjudmi yoki yo‘qmi?", "Foydalanuvchining egallab turgan lavozimi bo‘yicha qaysi fayllarni o‘chirish huquqi mavjud?"], ["Quyidagilardan qaysi biri autentifikatsiyaning «egalikka asoslangan» omiliga misol bo‘la oladi?", "Foydalanuvchidagi apparat xavfsizlik kaliti yoki autentifikator ilovasi yaratgan maxsus kod.", "Foydalanuvchi xotirasida saqlanadigan murakkab matnli parol yoki maxfiy to‘rt xonali PIN kod.", "Foydalanuvchining biometrik ko‘rsatkichlari bo‘lgan barmoq izi yoki yuz tuzilishining tasviri.", "Foydalanuvchiga tizim administratori tomonidan berilgan doimiy xizmat login identifikatori."], ["Bir martalik SMS kodlari (SMS OTP) xavfsizlik nuqtayi nazaridan qanday asosiy zaifliklarga ega?", "SIM-kartani almashtirish (SIM swap) va turli fishing hujumlariga nisbatan zaiflikning mavjudligi.", "Kriptografik jihatdan faqat ochiq kalitlar infratuzilmasiga tayanishi va murakkab o‘rnatilishi.", "Faqat apparat kalitlari mavjud bo‘lgandagina ishlashi hamda smartfonlarda qo‘llab-quvvatlanmasligi.", "Foydalanuvchi qurilmasida internet trafigi mavjud bo‘lmaganda kodni mutlaqo yarata olmaslik holati."], ["FIDO2/WebAuthn texnologiyasiga asoslangan passkey tizimining fishingga chidamliligi nimaga asoslanadi?", "Domen nomi bilan chambarchas bog‘langan ochiq kalit kriptografiyasidan foydalanish tamoyiliga.", "Parollarni server xotirasida ochiq holda saqlamasdan individual dinamik salt qo‘shish usuliga.", "Mobil qurilmadagi autentifikator ilovasi orqali har o‘ttiz soniyada vaqtga bog‘liq kod berishiga.", "Sessiya identifikatorini faqat lokal saqlash va tarmoq orqali hech qachon uzatmaslik qoidasiga."], ["Nima sababdan standart SHA-256 algoritmi parollarni saqlashda zamonaviy talablarga javob bermaydi?", "U tez hisoblanuvchi xesh bo‘lib, moslashuvchan sekinlashtirish va xotira parametrlariga ega emas.", "U simmetrik shifrlash algoritmi bo‘lib, maxfiy kalit o‘g‘irlanganda barcha parollarni ochib beradi.", "U faqat o‘n oltilik sanoq tizimidagi ma’lumotlarni qayta ishlaydi va uzun parollarni qabul qilmaydi.", "U ochiq kalitli kriptografiya standartlariga mos kelmaydi hamda veb-brauzerlar bilan ishlay olmaydi."], ["Parollarni server ma’lumotlar bazasida xavfsiz saqlash uchun qaysi yondashuv tavsiya etiladi?", "Argon2id kabi adaptiv xeshlash algoritmi, individual salt va to‘g‘ri tanlangan resurs parametrlari.", "Standart MD5 xeshlash funksiyasi bilan birgalikda global statik kalitdan doimiy foydalanish usuli.", "Parollarni ochiq matnda qoldirib, faqatgina ma’lumotlar bazasining fayl tizimini shifrlab qo‘yish.", "Har bir foydalanuvchi parolini Base64 formatiga o‘tkazib, maxfiy konfiguratsiya faylida saqlash."], ["Rolga asoslangan kirish nazoratida (RBAC) «minimal imtiyoz» prinsipi nimani anglatadi?", "Foydalanuvchiga o‘z xizmat vazifalarini to‘liq bajarishi uchun yetarli eng kichik huquqlarni berish.", "Foydalanuvchiga tizimdagi barcha amallarni bajarishga ruxsat berib, faqat sozlamalarni cheklash.", "Administrator vakolatlarini tarmoqdagi barcha faol foydalanuvchilar o‘rtasida teng taqsimlash.", "Kirish huquqlarini har kuni qayta tekshirib, foydalanuvchini har bir sessiyada qayta ro‘yxatlash."], ["Windows CMD muhitida `whoami /priv` buyrug‘i qanday axborotni taqdim etadi?", "Joriy foydalanuvchi hisobiga biriktirilgan maxsus xavfsizlik imtiyozlari va ularning holatini.", "Operatsion tizimda ochilgan tarmoq portlari va ulardan foydalanayotgan dasturlar ro‘yxatini.", "Foydalanuvchining shaxsiy paroli oxirgi marta qachon o‘zgartirilganligi to‘g‘risidagi sanani.", "Tizimda faoliyat yuritayotgan barcha domen nazoratchilari va ularning IP manzillarini."], ["Foydalanuvchining guruhlari va imtiyozlari mavjud bo‘lsa-da, aniq amalga ruxsat berilishini nima belgilaydi?", "Resursga o‘rnatilgan ruxsat nazorati ro‘yxatlari (ACL) hamda qo‘shimcha xavfsizlik siyosatlari.", "Foydalanuvchi kiritgan parolda katta-kichik harflar va maxsus belgilarning mavjudligi darajasi.", "Sessiya davomiyligi hamda tarmoq kabeli orqali uzatilayotgan ma’lumotlar paketlarining soni.", "Autentifikatsiyada ishlatilgan bir martalik SMS kodning amal qilish muddati va vaqt oralig‘i."], ["Tizimga kirishdan keyin beriladigan sessiya tokeni bilan ishlashda qaysi xavfsizlik talabi bajarilishi shart?", "Token maxfiy saqlanishi, faqat HTTPS orqali uzatilishi va tizimdan chiqishda bekor qilinishi shart.", "Token umumiy foydalanishdagi barcha ochiq fayllarga yozilishi va muddatsiz ravishda saqlanishi kerak.", "Token faqat shifrlanmagan HTTP protokoli orqali barcha proksi-serverlarga uzatilib turishi lozim.", "Token foydalanuvchining xohishiga ko‘ra bir vaqtning o‘zida bir nechta odamga berilishi maqsadga muvofiq."], ["Mashg‘ulotdagi Python kodida: `amal in ruxsatlar[foydalanuvchi['rol']]` ifodasi qaysi vazifani bajaradi?", "Foydalanuvchi roliga mos ruxsatlar to‘plamida so‘ralgan amal mavjudligini mantiqiy tekshiradi.", "Foydalanuvchi kiritgan login va maxfiy parolni ma’lumotlar bazasidagi qiymatlar bilan solishtiradi.", "Foydalanuvchi sessiyasiga yangi kriptografik token yaratadi va uni brauzer keshiga biriktiradi.", "Bajarilgan amallar jurnalini tahlil qilib, xavfsizlik buzilish holatlarini avtomatik aniqlaydi."], ["Umumiy kompyuterlarda amaliy xavfsizlikni ta’minlash uchun qaysi odatlarga rioya qilish lozim?", "«Eslab qol» funksiyasidan foydalanmaslik, hisobdan to‘liq chiqish (logout) va ekranni qulflash.", "Parolni qulaylik uchun brauzerda saqlash va tizimdan chiqmasdan turib ish o‘rnini tark etish.", "Barcha ochilgan ilovalar oynalarini minimallashtirish va xavfsizlik devori dasturini o‘chirish.", "Shaxsiy autentifikatsiya ma’lumotlarini matnli faylga yozib, ishchi stolida ochiq holda qoldirish."], ["Foydalanuvchi o‘z parolini fishing orqali oshkor qilgan vaziyatda MFA qanday yordam beradi?", "Hujumchi parolni bilsa ham, ikkinchi omil (apparat kaliti yoki kod) bo‘lmasa hisobga kira olmaydi.", "Foydalanuvchining o‘g‘irlangan parolini ma’lumotlar bazasida avtomatik yangi parolga almashtiradi.", "Fishing saytining IP manzilini darhol aniqlab, ushbu serverni global tarmoqdan butunlay uzadi.", "Foydalanuvchining kompyuteridagi barcha zararli dasturlarni bir zumda tozalab qayta yuklaydi."], ["Amaliy mashg‘ulot yakunida talaba xavfsizlik nuqtayi nazaridan qanday majburiyatni bajarishi kerak?", "Olingan natijalarni tahlil qilib, o‘zgartirilgan barcha sozlamalarni dastlabki holatga qaytarish.", "Administrator huquqlari yordamida yaratilgan test hisoblarini kelgusi darslar uchun saqlab qolish.", "Hisobot faylida tizimga kirish uchun ishlatilgan barcha maxfiy parollar va tokenlarni chop etish.", "Laboratoriya kompyuterining xavfsizlik jurnallari fayllarini butunlay tozalab o‘chirib tashlash."]];
const $=id=>document.getElementById(id);
$('total').textContent=DATA.length;
let list=[],i=0,score=0,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['start','quiz','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(items){list=items.map(r=>({q:r[0],c:r[1],o:shuffle(r.slice(1))}));i=0;score=0;wrong=[];show('quiz');render()}
function render(){
  const it=list[i];locked=false;
  $('pos').textContent='Savol '+(i+1)+' / '+list.length;
  $('sc').textContent='To’g’ri: '+score;
  $('pb').style.width=(i/list.length*100)+'%';
  $('qt').textContent=it.q;
  const box=$('opts');box.innerHTML='';
  it.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
  $('next').classList.add('hidden');
}
function pick(btn,t){
  if(locked)return;locked=true;const it=list[i];
  const ok=t===it.c;
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===it.c)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push({q:it.q,mine:t,c:it.c,raw:[it.q,...it.o.filter(x=>x!==it.c).concat([])]})}
  $('sc').textContent='To’g’ri: '+score;
  $('next').textContent=i===list.length-1?'Natijani ko’rish':'Keyingi savol';
  $('next').classList.remove('hidden');$('next').focus();
}
function finish(){
  show('end');$('fin').textContent=score+' / '+list.length;
  $('pct').textContent=Math.round(score/list.length*100)+'% to’g’ri javob';
  $('retry').classList.toggle('hidden',!wrong.length);
  const r=$('rev');r.innerHTML=wrong.length?'<h3>Xato javoblar</h3>':'<p>Barcha javoblar to’g’ri. Ajoyib!</p>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';
    const q=document.createElement('b');q.textContent=w.q;
    const a=document.createElement('div');a.className='a';a.style.background='var(--bad-bg)';a.style.color='var(--bad-text)';a.textContent='Sizning javobingiz: '+w.mine;
    const c=document.createElement('div');c.className='a';c.style.background='var(--ok-bg)';c.style.color='var(--ok-text)';c.textContent='To’g’ri javob: '+w.c;
    d.append(q,a,c);r.appendChild(d)});
}
$('next').onclick=()=>{if(i<list.length-1){i++;render()}else{$('pb').style.width='100%';finish()}};
$('go').onclick=()=>{let n=parseInt($('cnt').value)||25;n=Math.max(1,Math.min(DATA.length,n));begin(shuffle(DATA).slice(0,n))};
$('again').onclick=()=>show('start');
$('retry').onclick=()=>{const ids=new Set(wrong.map(w=>w.q));begin(shuffle(DATA.filter(r=>ids.has(r[0]))))};
</script></body></html>
