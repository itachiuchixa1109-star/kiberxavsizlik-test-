<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 6px}

.rev b{display:block;margin-bottom:4px}

.hidden{display:none}

<script>
const SUBJ=[{"name": "Kiberxavfsizlik asoslari", "q": [["Kiberxavfsizlik tushunchasiga berilgan eng to‘liq va tizimli ta’rif qaysi javobda to‘g‘ri bayon etilgan?", "Tizimlar, tarmoqlar va ma’lumotlarni ruxsatsiz kirish hamda buzish kabi salbiy holatlardan himoya qilishdir.", "Tashkilot kompyuterlariga faqat antivirus dasturlarini o‘rnatish va ularning bazasini yangilab turishdir.", "Foydalanuvchi parollarini doimiy o‘zgartirib turish orqali barcha tarmoq xizmatlarini to‘liq cheklashdir.", "Faqatgina dasturiy kodlardagi sintaktik xatoliklarni aniqlab, ularni ishlab chiqaruvchiga yetkazishdir."], ["CIA triadasiga kiruvchi maxfiylik (Confidentiality) tamoyilining asosiy mazmuni nimadan iborat?", "Axborot faqat tegishli vakolat va ruxsat berilgan shaxslargagina oshkor bo‘lishini ta’minlashdir.", "Ma’lumotlar uzatish jarayonida noqonuniy o‘zgarishlarga mutlaqo uchramasligini kafolatlashdir.", "Tizim va unga tegishli barcha resurslarning doimiy ravishda uzluksiz ishlashini yo‘lga qo‘yishdir.", "Foydalanuvchilarning barcha tarmoq harakatlarini maxsus jurnalga avtomatik tarzda qayd etishdir."], ["CIA triadasidagi yaxlitlik (Integrity) talabi buzilishiga quyidagilardan qaysi biri aniq misol bo‘ladi?", "Bazasidagi talabalar fan baholarining ruxsatsiz va asossiz ravishda o‘zgartirib yuborilishi.", "Dasturiy tizim serveri texnik nosozlik sababli talabalarga xizmat ko‘rsatmay to‘xtab qolishi.", "Maxfiy bo‘lgan talabalar telefon raqamlari begona foydalanuvchilarga to‘liq oshkor bo‘lishi.", "Tizim administratorining serverga kirish huquqini belgilangan vaqtinchalik yo‘qotib qo‘yishi."], ["Kiberxavfsizlikda autentiklik (authenticity) tushunchasi nimani anglatadi?", "Axborot manbasining yoki murojaat qilayotgan subyektning haqiqiyligini tekshirishni.", "Foydalanuvchi bajargan barcha amallarni maxsus ma’lumotlar bazasiga muhrlab borishni.", "Dasturiy tizimning favqulodda to‘xtashlarsiz uzluksiz tarzda faoliyat ko‘rsatishini.", "Tizimdagi barcha ruxsatsiz kiritilgan o‘zgarishlarni zudlik bilan orqaga qaytarishni."], ["Tahdid (threat) va zaiflik (vulnerability) tushunchalari o‘rtasidagi farq qaysi javobda to‘g‘ri keltirilgan?", "Tahdid zarar yetkazishi mumkin bo‘lgan omildir, zaiflik esa tizimda mavjud bo‘lgan kamchilikdir.", "Tahdid tizim kodidagi xatolikdir, zaiflik esa begona buzg‘unchi tomonidan qilingan urinishdir.", "Tahdid tizimning to‘xtab qolishidir, zaiflik esa foydalanuvchining hisobini egallab olish jarayonidir.", "Tahdid faqat ichki xodimlar xatosidir, zaiflik esa tashqi tarmoqdan yuboriladigan zararli dasturdir."], ["Ma’ruza matnidagi amaliy misolga ko‘ra, oddiy va oson topiladigan parol nima hisoblanadi?", "Tizim himoyasidagi zaiflik.", "Tashqaridagi tahdid manbai.", "Zararli hujum qilish usuli.", "Kutilmagan xavfsizlik voqeasi."], ["Soddalashtirilgan kiberxavfsizlik tahlilida risk (Risk) qanday formula yordamida baholanadi?", "Risk = ehtimollik × ta’sir", "Risk = tahdidlar + zaiflik", "Risk = xarajatlar ÷ zaiflik", "Risk = aktivlar × himoyalar"], ["Ma’lumotlarni zaxiralashning mashhur '3-2-1' tamoyili qanday talablarni ilgari suradi?", "Ma’lumotning kamida uch nusxasi, ikki turli tashuvchida, bitta nusxasi esa alohida joyda saqlanadi.", "Ma’lumot uch oyda bir marta, ikki xil dastur orqali va bitta lokal fleshka ichiga doimiy ko‘chiriladi.", "Ma’lumot uchta tarmoq bo‘limida, ikkita asosiy serverda va bitta shifrlangan qattiq diskda saqlanadi.", "Ma’lumot uchta mutaxassis tomonidan, ikki xil kalit bilan va bitta markaziy bazada qayta tiklanadi."], ["Zaxira nusxalarini yaratish jarayonida ularning amaliy foydasini kafolatlaydigan eng muhim chora nima?", "Zaxiradan tizimni qayta tiklash bo‘yicha davriy amaliy sinovlarni o‘tkazib turish.", "Zaxira nusxalarini faqat bir xil ishlab chiqaruvchining qattiq disklariga yozib borish.", "Zaxiralangan barcha fayllarni arxivlashdan oldin xodimlar ko‘rigidan o‘tkazib chiqish.", "Zaxiralash jarayonini faqat ish vaqti tugagandan so‘ng tungi vaqtda amalga oshirish."], ["Python kodidagi 'hashlib.sha256(fayl.read_bytes()).hexdigest()' amali CIA ning qaysi jihatini ta’minlashda qo‘llanadi?", "Fayl tarkibi noqonuniy o‘zgartirilmaganligini ya’ni yaxlitligini nazorat qilishda.", "Fayl ichidagi ma’lumotlarning begona ko‘zlardan to‘liq maxfiyligini saqlashda.", "Faylning server xotirasida doimiy va uzluksiz foydalanuvchanligini ta’minlashda.", "Fayl yaratuvchisining shaxsiy hisob yozuvi parolini tekshirib autentifikatsiyalashda."], ["Universitet fayl serveriga fishing orqali kirilgan keysda asosiy zaiflik nimadan iborat bo‘lgan?", "Tizimda ko‘p faktorli autentifikatsiya (MFA) joriy qilinmaganligida.", "Fayl serveri operatsion tizimining o‘z vaqtida yangilanmaganligida.", "Talabalar bazasidagi fayllar o‘lchami haddan tashqari kattaligida.", "Foydalanuvchilarga kompyuter orqali ishlash taqiqlab qo‘yilganligida."], ["Ma’lumotlarni shifrlash usulining amaliy cheklovi to‘g‘risida qaysi xulosa to‘g‘ri?", "Shifrlash ma’lumotni yashirsa-da, dastur mantiqiy xatolari yoki noto‘g‘ri ruxsatlarni tuzatmaydi.", "Shifrlash faqat matnli fayllarga ta’sir qiladi, ammo ma’lumotlar bazasini himoya qila olmaydi.", "Shifrlash amali tizim tezligini oshiradi, biroq xakerlik hujumlarini aniqlash imkonini bermaydi.", "Shifrlash faqat tarmoq segmentatsiyasi to‘liq yakunlangan serverlardagina ishonchli ishlaydi."], ["Xavfsizlik bo‘yicha tashkiliy choralar guruhiga quyidagilardan qaysi biri kiradi?", "Ruxsat berish siyosati, xodimlar yo‘riqnomasi va hodisalar haqida xabar berish tartibi.", "Operatsion tizimlarni yangilash, tarmoqni segmentlash va shifrlash vositalari.", "Ko‘p faktorli autentifikatsiya, tizim jurnallari monitoringi va zaxiralash.", "Antivirus dasturlarini o‘rnatish, fayl devorlarini sozlash va serverlar nazorati."], ["Inkor eta olmaslik (non-repudiation) xususiyatining mohiyati qaysi javobda to‘g‘ri ko‘rsatilgan?", "Tizimda bajarilgan muayyan amalni uning egasiga asosli bog‘lash va rad etishiga yo‘l qo‘ymaslik.", "Tizim buzilgan taqdirda barcha yo‘qolgan fayllarni avtomatik tarzda tiklash imkoniyatini yaratish.", "Tarmoq orqali yuborilayotgan barcha fayllarni bir vaqtning o‘zida turli formatlarda arxivlash.", "Foydalanuvchi hisobiga boshqa qurilmadan kirishga urinish bo‘lganda uni darhol bloklab qo‘yish."], ["Keysni tahlil qilishning 5 bosqichli metodologiyasida 5-qadam nima deb nomlanadi?", "Nazorat chorasi joriy etilgandan keyin ham qoluvchi riskni bayon qilish.", "Zararlangan barcha axborot tizimlarini butunlay o‘chirib, qayta tiklash.", "Hujum sodir etgan shaxsning geografik joylashuvini dasturiy aniqlash.", "Xodimlarning barchasiga yangi murakkab parollar tarqatishni boshlash."], ["Foydalanuvchi xavfsizlik madaniyatining asosiy qoidalaridan biri qaysi javobda to‘g‘ri bayon qilingan?", "Noma’lum havolalarni ochmaslik, manzilni tekshirish va maxfiy ma’lumotlarni boshqalar bilan ulashmaslik.", "Barcha parollarni eslab qolish oson bo‘lishi uchun bir xil qilib belgilash va ish stolida saqlab qo‘yish.", "Tizimdagi g‘ayrioddiy shubhali holatlarni mutaxassislarga bildirmasdan mustaqil ravishda o‘chirib yuborish.", "Ish stoli kompyuterini hech qachon qulflamasdan, boshqa xodimlar erkin foydalanishi uchun ochiq qoldirish."], ["Kerckhoffs tamoyilining zamonaviy kriptografik xavfsizlikdagi asosiy mazmuni nimadan iborat?", "Tizim xavfsizligi algoritmga emas, kalitning maxfiyligiga tayanadi", "Tizim xavfsizligi shifrlash algoritmining sir tutilishiga tayanadi", "Tizim xavfsizligi shifrlanadigan matnning uzun bo‘lishiga tayanadi", "Tizim xavfsizligi apparat vositalarining yopiq ishlashiga tayanadi"], ["O‘rta asrlarda yashagan arab olimi Al-Kindiy kriptotahlil rivojiga qanday hissa qo‘shgan?", "Harflarning uchrash chastotasiga asoslangan tahlil usulini yaratdi", "Matritsali ko‘paytirishga asoslangan yangi shifrlash usulini yaratdi", "Asimmetrik ochiq kalitli shifrlash tizimining ilk modelini yaratdi", "Bir martalik bloknotga asoslangan mutlaq mustahkam shifrni yaratdi"], ["Sezar shifrida k=3 siljish bilan A–Z bo‘yicha 'SALOM' so‘zi qanday ko‘rinishda shifrlanadi?", "VDORP", "UCNQO", "WENSP", "TBMPO"], ["Atbash shifrining asosiy ishlash prinsipi va uning kriptografik zaifligi nimada?", "Alfavitni to‘liq teskari akslantiradi va unda maxfiy kalit mavjud emas", "Alfavitni doimiy uch qadam suradi va uning kalitlar fazosi juda kichik", "Harflarni zigzag usulida joylaydi va harfiy chastotani to‘liq saqlaydi", "Juft belgilarni bloklarga ajratadi va matrisa determinanti nolga teng"], ["Affin shifrida C = (aP + b) mod 26 formulasi bo‘yicha a parametriga qanday talab qo‘yiladi?", "gcd(a, 26) = 1 sharti qanoatlantirilishi va teskari elementi bo‘lishi zarur", "gcd(a, 26) = 2 sharti qanoatlantirilishi va juft sonlardan iborat bo‘lishi zarur", "a qiymati b sonidan doimo katta bo‘lishi va tub bo‘lmagan son bo‘lishi zarur", "a qiymati modul 26 ga karrali bo‘lishi va doim manfiy bo‘lmasligi zarur"], ["Rail Fence shifri klassik tasnifga ko‘ra qaysi turdagi shifrlash usuliga mansub hisoblanadi?", "Transpozitsiya (harflarning joylashuv o‘rnini o‘zgartirish)", "Monoalfavitli (harflarni boshqa yagona belgiga almashtirish)", "Ko‘p alifboli (harflarni o‘zgaruvchan qadam bilan almashtirish)", "Poligrammali (harflarni juftlik jadvali yordamida almashtirish)"], ["Playfair shifrining 5×5 o‘lchamli jadvalida qaysi ikki lotin harfi an’anaviy ravishda bitta katakka birlashtiriladi?", "I va J harflari", "U va V harflari", "C va K harflari", "X va Z harflari"], ["Hill shifrida shifrlash C = K·P (mod 26) amali orqali bajarilganda K matritsasiga qanday shart qo‘yiladi?", "K matritsasi mod 26 bo‘yicha teskarilanuvchan bo‘lishi kerak", "K matritsasining barcha elementlari faqat tub son bo‘lishi kerak", "K matritsasining diagonali doimo nollardan tashkil topishi kerak", "K matritsasining determinanti 26 soniga karrali bo‘lishi kerak"], ["Vijenyer shifrining bir martalik bloknot (one-time pad) xavfsizlik darajasiga yetishi uchun qaysi shart zarur?", "Kalit tasodifiy, xabar uzunligida va faqat bir marta ishlatilishi zarur", "Kalit qisqa so‘z bo‘lib, mat  raqamlardan iborat qisqa parollarnigina taniydi.", "Parollarni AES bilan shifrlash server operativ xotirasini to'liq to'ldirib tizimni to'xtatadi.", "Ushbu usul parollarni ma'lumotlar bazasiga ochiq holda saqlashdan hech qanday farq qilmaydi."], ["Kiberxavfsizlikda raqamli imzo qaysi xususiyatlarni kafolatlash uchun qo'llaniladi?", "Hujjatning haqiqiyligi, uning aynan jo'natuvchiga tegishliligi va uzatishda buzilmaganligi.", "Faylning tarmoq orqali o'tayotganda begona ko'zlardan butunlay yashirin bo'lishini ta'minlash.", "Ochiq matn hajmini siqish orqali aloqa kanalining o'tkazuvchanlik qobiliyatini yengillatish.", "Buzilgan shifrmatnlarni qo'shimcha kalitsiz avtomatik tarzda to'g'rilab qayta tiklab berish."], ["Python cryptography kutubxonasidagi Fernet moduli qanday shifrlash modeliga asoslanadi?", "Xabarlarning yaxlitligini ham kafolatlovchi autentifikatsiyalangan simmetrik shifrlashga.", "Ochiq va maxfiy kalitlar juftligiga tayanuvchi ko'p bosqichli assimmetrik arxitekturaga.", "Faqat bir tomonlama nazorat xesh qiymatlarini yaratuvchi kriptografik funksiyalar tizimiga.", "Belgilar o'rnini almashtirishga asoslangan soddalashtirilgan o'quv klassik matritsasiga."], ["Shifrlangan fayl va uning maxfiy shifrlash kalitini bitta papkada saqlash qanday xavf tug'diradi?", "Tizimga kirgan tajovuzkor kalitdan foydalanib barcha maxfiy ma'lumotlarni osonlikcha o'qiydi.", "Faylning binar strukturasi o'zgarib operatsion tizim uni avtomatik tarzda butunlay o'chiradi.", "Kutubxona yaxlitlik xatosini qaytarib qonuniy foydalanuvchining o'zini ham dasturdan chiqaradi.", "Shifrlangan fayl hajmi keskin oshib ketishi oqibatida diskdagi xotira maydoni to'lib qoladi."], ["Foydalanuvchi shaxsiy tibbiy ma'lumotlarini bulutga yuklaganda eng to'g'ri xavfsizlik choralari qaysi?", "Uzatishda TLS, serverda AES-GCM, kirishda MFA hamda to'g'ri kalit boshqaruvi uyg'unligi.", "Ma'lumotlarni Base64 bilan kodlash, parolni MD5 xeshida saqlash va tizimga parolsiz kirish.", "Fayllarni faqat Sezar shifri yordamida o'zgartirib bitta ochiq server papkasida joylashtirish.", "Kirishni cheklamagan holda fayllarni arxivlash va barcha tarmoq himoya vositalarini o'chirish."], ["Sezar shifrida HELLO so'zi k=3 siljitish kaliti bilan shifrlanganda qanday ko'rinishga ega bo'ladi?", "KHOOR ko'rinishiga ega bo'lib qoladi", "SVOOL ko'rinishiga ega bo'lib qoladi", "LIPPS ko'rinishiga ega bo'lib qoladi", "URYYB ko'rinishiga ega bo'lib qoladi"], ["Atbash shifrlash usuli qo'llanganda HELLO so'zi qaysi matnga aylanadi?", "SVOOL ko'rinishidagi matnga aylanadi", "KHOOR ko'rinishidagi matnga aylanadi", "URYYB ko'rinishidagi matnga aylanadi", "ROOLL ko'rinishidagi matnga aylanadi"], ["Affin shifrida E(x) = (ax + b) mod 26 formulasi bo'yicha a koeffitsiyenti uchun qanday qat'iy matematik shart talab etiladi?", "a soni 26 soni bilan o'zaro tub bo'lishi kerak", "a soni b songa to'liq bo'linadigan bo'lishi kerak", "a soni faqat toq va murakkab son bo'lishi kerak", "a soni 26 dan mutlaqo katta butun son bo'lishi kerak"], ["Affin shifrida a koeffitsiyenti 26 bilan o'zaro tub bo'lmagan holatda qanday salbiy oqibat yuzaga keladi?", "Matnni deshifrlash natijasi bir qiymatli bo'lmay qoladi", "Shifrlash algoritmining bajarilish tezligi pasayib ketadi", "Harflarning jadvaldagi o'rinlari avtomatik almashib ketadi", "Kalit uzunligi ochiq matn hajmidan ikki barobar ortib ketadi"], ["Rail Fence shifri klassik kriptografiya tasnifiga ko'ra qaysi shifrlar guruhiga kiradi?", "Harflar o'rnini o'zgartiruvchi transpozitsion shifr", "Bir nechta alifbolarni almashtiruvchi polialifboli shifr", "Yagona alifboga asoslangan monoalifboli almashtirish", "Chiziqli algebra matritsasiga tayangan blokli shifr"], ["Playfair shifrida harflar juftligini shifrlash jarayonida qanday o'lchamdagi matritsa jadvalidan foydalaniladi?", "5×5 o'lchamli jadvaldan foydalaniladi (I va J qo'shiladi)", "6×6 o'lchamli jadvaldan foydalaniladi (barcha raqamlar bilan)", "4×4 o'lchamli jadvaldan foydalaniladi (faqat unlilar bilan)", "3×3 o'lc onfig /all tizim buyrug'i", "netstat -ano xizmat buyrug'i", "route print marshrut buyrug'i", "tracert host tekshiruv vositasi"], ["Tarmoqdagi IP manzil va unga mos keluvchi MAC manzillarining joriy mosligini qaysi buyruq chiqaradi?", "arp -a buyrug'i ko'rsatib beradi", "ping -t buyrug'i ko'rsatib beradi", "nslookup buyrug'i ko'rsatib beradi", "getmac /v buyrug'i ko'rsatib beradi"], ["Paket manzilga yetib borguncha qaysi oraliq marshrutizatorlardan o'tishini qaysi buyruq ko'rsatadi?", "tracert vositasi aniqlab beradi", "nslookup vositasi aniqlab beradi", "ipconfig vositasi aniqlab beradi", "netstat vositasi aniqlab beradi"], ["Faol TCP/UDP ulanishlarini, ularning portlari va bog'langan PID raqamlarini qaysi buyruq aks ettiradi?", "netstat -ano buyrug'ining natijasi", "route print buyrug'ining natijasi", "ipconfig /all buyrug'ining oqibati", "arp -a tahlil buyrug'ining ro'yxati"], ["DNS server yozuvlari to'g'ri ishlayotganini tekshirish uchun konsolda qaysi dastur ishlatiladi?", "nslookup konsol diagnostik vositasi", "ping yordamchi signallash dasturi", "getmac apparat manzilini oluvchi", "tracert masofaviy marshrut kodi"], ["Agar ping buyrug'iga javob kelmasa, buning sababi qanday omil bilan tushuntirilishi mumkin?", "ICMP protokoli bloklangan bo'lishi", "DNS xizmati to'liq o'chirilganligi", "Faqat kabelning uzilib ketgan bo'lishi", "MAC manzili noto'g'ri kiritilganligi"], ["Lokal tarmoq chegarasidan tashqaridagi resurslarga chiqish uchun foydalaniladigan tugun qanday ataladi?", "Default gateway (birlamchi shlyuz)", "Loopback adapteri (qaytish porti)", "Kommutator shinalari (kadr kanali)", "DHCP taqsimlagichi (avto provayder)"], ["Transport pog'onasidagi TCP va UDP protokollari orasidagi eng muhim funksional farq nimada?", "TCP ishonchli, UDP esa ulanishsizdir", "TCP simsiz, UDP esa faqat kabellidir", "TCP apparatda, UDP dasturda ishlaydi", "TCP shifrlaydi, UDP ochiq uzatadi"], ["Kompyuterda internet ishlamay qolganda dastlabki diagnostika tartibining to'g'ri ketma-ketligi qaysi?", "Kabel tekshiruvi, ipconfig, ping, DNS", "DNS tekshiruvi, tracert, kabel, ping", "Gateway ping, DNS, kabel, tracert", "Netstat tahlili, kabel, gateway, ARP"], ["Axborot xavfsizligida identifikatsiya jarayonining asosiy vazifasi qaysi javobda to‘g‘ri ifodalangan?", "Foydalanuvchining tizimga o‘z kimligi to‘g‘risida login yoki ID orqali dastlabki da’vo kiritishi.", "Foydalanuvchining taqdim etgan da’vosini maxfiy kalit va biometrik belgilar orqali tekshirish.", "Foydalanuvchiga muayyan resurslardan foydalanish uchun ruxsat etilgan huquqlarni belgilash.", "Foydalanuvchining tizim ichida bajargan harakatlarini xavfsizlik jurnallariga yozib borish."], ["Autentifikatsiya tushunchasining mazmuni va uning maqsadi qaysi ta’rifda to‘liq ko‘rsatilgan?", "Kiritilgan login yoki ID da’vosini dalillar (parol, qurilma, biometriya) yordamida tekshirish.", "Foydalanuvchi qaysi ma’lumotlarni ko‘rish va o‘zgartirish huquqiga egaligini qat’iy aniqlash.", "Tizim resurslariga bo‘lgan barcha noqonuniy murojaatlarni doimiy ravishda qayd qilib borish.", "Tarmoqdagi umumiy ma’lumotlar oqimini shifrlash va himoyalangan aloqa kanalini o‘rnatish."], ["Universitet platformasi (HEMIS) misolida avtorizatsiya bosqichiga qaysi jarayon to‘g‘ri keladi?", "Talabaning tizimda faqat o‘ziga tegishli baholar va shaxsiy dars jadvalini ko‘rish huquqi.", "Talabaning shaxsiy loginini tizimga kirish maydoniga dastlabki tarzda to‘g‘ri kiritishi.", "Talaba tomonidan kiritilgan maxfiy parolni tekshirish hamda tasdiqlash omilini so‘rash.", "Tizim xavfsizlik devori orqali talaba qurilmasining IP manzilini tekshirib qabul qilish."], ["Xavfsizlik auditining axborot tizimlaridagi asosiy vazifasi qaysi savolga javob berishdan iborat?", "Foydalanuvchi tizimda qanday amallarni bajardi va uning faoliyati jurnalda qanday aks etdi?", "Foydalanuvchi haqiqatan ham o‘zi da’vo qilayotgan shaxs ekanligi qaysi dalil bilan tasdiqlandi?", "Foydalanuvchi kiritgan shaxsiy identifikator tizim ma’lumotlar bazasida mavjudmi yoki yo‘qmi?", "Foydalanuvchining egallab turgan lavozimi bo‘yicha qaysi fayllarni o‘chirish huquqi mavjud?"], ["Quyidagilardan qaysi biri autentifikatsiyaning «egalikka asoslangan» omiliga misol bo‘la oladi?", "Foydalanuvchidagi apparat xavfsizlik kaliti yoki autentifikator ilovasi yaratgan maxsus kod.", "Foydalanuvchi xotirasida saqlanadigan murakkab matnli parol yoki maxfiy to‘rt xonali PIN kod.", "Foydalanuvchining biometrik ko‘rsatkichlari bo‘lgan barmoq izi yoki yuz tuzilishining tasviri.", "Foydalanuvchiga tizim administratori tomonidan berilgan doimiy xizmat login identifikatori."], ["Bir martalik SMS kodlari (SMS OTP) xavfsizlik nuqtayi nazaridan qanday asosiy zaifliklarga ega?", "SIM-kartani almashtirish (SIM swap) va turli fishing hujumlariga nisbatan zaiflikning mavjudligi.", "Kriptografik jihatdan faqat ochiq kalitlar infratuzilmasiga tayanishi va murakkab o‘rnatilishi.", "Faqat apparat kalitlari mavjud bo‘lgandagina ishlashi hamda smartfonlarda qo‘llab-quvvatlanmasligi.", "Foydalanuvchi qurilmasida internet trafigi mavjud bo‘lmaganda kodni mutlaqo yarata olmaslik holati."], ["FIDO2/WebAuthn texnologiyasiga asoslangan passkey tizimining fishingga chidamliligi nimaga asoslanadi?", "Domen nomi bilan chambarchas bog‘langan ochiq kalit kriptografiyasidan foydalanish tamoyiliga.", "Parollarni server xotirasida ochiq holda saqlamasdan individual dinamik salt qo‘shish usuliga.", "Mobil qurilmadagi autentifikator ilovasi orqali har o‘ttiz soniyada vaqtga bog‘liq kod berishiga.", "Sessiya identifikatorini faqat lokal saqlash va tarmoq orqali hech qachon uzatmaslik qoidasiga."], ["Nima sababdan standart SHA-256 algoritmi parollarni saqlashda zamonaviy talablarga javob bermaydi?", "U tez hisoblanuvchi xesh bo‘lib, moslashuvchan sekinlashtirish va xotira parametrlariga ega emas.", "U simmetrik shifrlash algoritmi bo‘lib, maxfiy kalit o‘g‘irlanganda barcha parollarni ochib beradi.", "U faqat o‘n oltilik sanoq tizimidagi ma’lumotlarni qayta ishlaydi va uzun parollarni qabul qilmaydi.", "U ochiq kalitli kriptografiya standartlariga mos kelmaydi hamda veb-brauzerlar bilan ishlay olmaydi."], ["Parollarni server ma’lumotlar bazasida xavfsiz saqlash uchun qaysi yondashuv tavsiya etiladi?", "Argon2id kabi adaptiv xeshlash algoritmi, individual salt va to‘g‘ri tanlangan resurs parametrlari.", "Standart MD5 xeshlash funksiyasi bilan birgalikda global statik kalitdan doimiy foydalanish usuli.", "Parollarni ochiq matnda qoldirib, faqatgina ma’lumotlar bazasining fayl tizimini shifrlab qo‘yish.", "Har bir foydalanuvchi parolini Base64 formatiga o‘tkazib, maxfiy konfiguratsiya faylida saqlash."], ["Rolga asoslangan kirish nazoratida (RBAC) «minimal imtiyoz» prinsipi nimani anglatadi?", "Foydalanuvchiga o‘z xizmat vazifalarini to‘liq bajarishi uchun yetarli eng kichik huquqlarni berish.", "Foydalanuvchiga tizimdagi barcha amallarni bajarishga ruxsat berib, faqat sozlamalarni cheklash.", "Administrator vakolatlarini tarmoqdagi barcha faol foydalanuvchilar o‘rtasida teng taqsimlash.", "Kirish huquqlarini har kuni qayta tekshirib, foydalanuvchini har bir sessiyada qayta ro‘yxatlash."], ["Windows CMD muhitida `whoami /priv` buyrug‘i qanday axborotni taqdim etadi?", "Joriy foydalanuvchi hisobiga biriktirilgan maxsus xavfsizlik imtiyozlari va ularning holatini.", "Operatsion tizimda ochilgan tarmoq portlari va ulardan foydalanayotgan dasturlar ro‘yxatini.", "Foydalanuvchining shaxsiy paroli oxirgi marta qachon o‘zgartirilganligi to‘g‘risidagi sanani.", "Tizimda faoliyat yuritayotgan barcha domen nazoratchilari va ularning IP manzillarini."], ["Foydalanuvchining guruhlari va imtiyozlari mavjud bo‘lsa-da, aniq amalga ruxsat berilishini nima belgilaydi?", "Resursga o‘rnatilgan ruxsat nazorati ro‘yxatlari (ACL) hamda qo‘shimcha xavfsizlik siyosatlari.", "Foydalanuvchi kiritgan parolda katta-kichik harflar va maxsus belgilarning mavjudligi darajasi.", "Sessiya davomiyligi hamda tarmoq kabeli orqali uzatilayotgan ma’lumotlar paketlarining soni.", "Autentifikatsiyada ishlatilgan bir martalik SMS kodning amal qilish muddati va vaqt oralig‘i."], ["Tizimga kirishdan keyin beriladigan sessiya tokeni bilan ishlashda qaysi xavfsizlik talabi bajarilishi shart?", "Token maxfiy saqlanishi, faqat HTTPS orqali uzatilishi va tizimdan chiqishda bekor qilinishi shart.", "Token umumiy foydalanishdagi barcha ochiq fayllarga yozilishi va muddatsiz ravishda saqlanishi kerak.", "Token faqat shifrlanmagan HTTP protokoli orqali barcha proksi-serverlarga uzatilib turishi lozim.", "Token foydalanuvchining xohishiga ko‘ra bir vaqtning o‘zida bir nechta odamga berilishi maqsadga muvofiq."], ["Mashg‘ulotdagi Python kodida: `amal in ruxsatlar[foydalanuvchi['rol']]` ifodasi qaysi vazifani bajaradi?", "Foydalanuvchi roliga mos ruxsatlar to‘plamida so‘ralgan amal mavjudligini mantiqiy tekshiradi.", "Foydalanuvchi kiritgan login va maxfiy parolni ma’lumotlar bazasidagi qiymatlar bilan solishtiradi.", "Foydalanuvchi sessiyasiga yangi kriptografik token yaratadi va uni brauzer keshiga biriktiradi.", "Bajarilgan amallar jurnalini tahlil qilib, xavfsizlik buzilish holatlarini avtomatik aniqlaydi."], ["Umumiy kompyuterlarda amaliy xavfsizlikni ta’minlash uchun qaysi odatlarga rioya qilish lozim?", "«Eslab qol» funksiyasidan foydalanmaslik, hisobdan to‘liq chiqish (logout) va ekranni qulflash.", "Parolni qulaylik uchun brauzerda saqlash va tizimdan chiqmasdan turib ish o‘rnini tark etish.", "Barcha ochilgan ilovalar oynalarini minimallashtirish va xavfsizlik devori dasturini o‘chirish.", "Shaxsiy autentifikatsiya ma’lumotlarini matnli faylga yozib, ishchi stolida ochiq holda qoldirish."], ["Foydalanuvchi o‘z parolini fishing orqali oshkor qilgan vaziyatda MFA qanday yordam beradi?", "Hujumchi parolni bilsa ham, ikkinchi omil (apparat kaliti yoki kod) bo‘lmasa hisobga kira olmaydi.", "Foydalanuvchining o‘g‘irlangan parolini ma’lumotlar bazasida avtomatik yangi parolga almashtiradi.", "Fishing saytining IP manzilini darhol aniqlab, ushbu serverni global tarmoqdan butunlay uzadi.", "Foydalanuvchining kompyuteridagi barcha zararli dasturlarni bir zumda tozalab qayta yuklaydi."], ["Amaliy mashg‘ulot yakunida talaba xavfsizlik nuqtayi nazaridan qanday majburiyatni bajarishi kerak?", "Olingan natijalarni tahlil qilib, o‘zgartirilgan barcha sozlamalarni dastlabki holatga qaytarish.", "Administrator huquqlari yordamida yaratilgan test hisoblarini kelgusi darslar uchun saqlab qolish.", "Hisobot faylida tizimga kirish uchun ishlatilgan barcha maxfiy parollar va tokenlarni chop etish.", "Laboratoriya kompyuterining xavfsizlik jurnallari fayllarini butunlay tozalab o‘chirib tashlash."]]}, {"name": "Parallel dasturlash", "q": [["Parallel dasturlash tushunchasining asosiy mohiyati qaysi javobda to'g'ri ifodalangan?", "Masalani mustaqil qismlarga ajratib bir vaqtda bir nechta resursda bajarish.", "Barcha buyruqlarni ketma-ket yagona hisoblash yadrosida navbat bilan bajarish.", "Hisoblash resurslarining barchasini faqat bitta murakkab oqimga yo'naltirish.", "Dastur kodidagi sikllarni olib tashlab ularni to'g'ridan-to'g'ri xotirada saqlash."], ["Protsessor chastotasini cheksiz oshirish imkoni bo'lmaganda qaysi muqobil yo'l tanlandi?", "Ko'p yadroli tizimlar va parallel hisoblash vositalaridan keng foydalanish.", "Operativ xotira hajmini cheklab faqat qattiq disk tezligiga tayanish usuli.", "Dasturlash tillarida buyruqlar sonini qisqartirib faqat bitta oqim qoldirish.", "Grafik tezlatkichlarni faqat ekranga tasvir chiqarish vositasiga aylantirish."], ["Parallel hisoblashning umumiy modeli qanday ketma-ket bosqichlardan tashkil topgan?", "Masalani bo'lish, ularni parallel bajarish va natijalarni birlashtirish.", "Barcha ma'lumotlarni jamlash, kodni kompilyatsiya qilish va qayta yozish.", "Vazifalarni bitta oqimga yig'ish, ularni navbatma-navbat sinash va o'chirish.", "Kesh xotirani tozalash, dasturni to'xtatish hamda resurslarni qayta yuklash."], ["Parallel dasturlashdagi masshtablanuvchanlik xususiyati nimani anglatadi?", "Qo'shimcha hisoblash resurslari kiritilganda unumdorlikning ortib borishi.", "Dasturning faqat bitta yadroli arxitekturada barqaror ishlash ko'rsatkichi.", "Algoritm bajarilayotganda xotiradan foydalanish darajasining kamayishi.", "Parallel oqimlarning bir-biriga ta'sir qilmasdan to'xtatilish imkoniyati."], ["Operatsion tizim darajasida protsess tushunchasiga qanday ta'rif beriladi?", "O'zining xotira maydoniga ega bo'lgan va mustaqil bajariladigan dastur nusxasi.", "Bir vaqtning o'zida bir nechta dasturni birlashtiruvchi yagona apparat bloki.", "Grafik protsessorda parallel ravishda hisoblanadigan eng kichik buyruq kodi.", "Faqat umumiy xotirada saqlanadigan va o'z oqimlariga ega bo'lmagan sikl qismi."], ["Protsess ichidagi oqim (thread) tushunchasining asosiy xususiyati nima?", "Bitta protsess ichidagi umumiy xotiradan foydalanuvchi bajarilish yo'lidir.", "Alohida ajratilgan xotira maydoniga ega bo'lgan to'liq mustaqil ilovadir.", "Faqat tarmoqdagi boshqa kompyuterlarga axborot uzatuvchi aloqa kanalidir.", "Bajarilish jarayonida hech qachon sinxronlash mexanizmlarini talab qilmaydi."], ["Parallel dasturlashda sinxronlash jarayonining asosiy maqsadi nima?", "Vazifalar ketma-ketligi va umumiy resurslardan xavfsiz foydalanishni ta'minlash.", "Barcha oqimlarni darhol to'xtatib hisoblash jarayonini bitta yadroga o'tkazish.", "Har bir parallel oqim uchun alohida virtual operatsion tizim nusxasini ochish.", "Algoritmning barcha arifmetik amallarini grafik protsessorga yo'naltirish."], ["Quyidagi mexanizmlardan qaysi biri sinxronlash vositalari guruhiga kiradi?", "Mutex, semaphore va barrier mexanizmlari.", "Compiler, interpreter va assembler tillari.", "Pipeline, register hamda kesh birliklari.", "HTTP, FTP hamda TCP tarmoq protokollari."], ["Ma'lumotlar parallelizmi (data parallelism) qanday amalga oshiriladi?", "Bir xil turdagi amal ma'lumotlarning turli qismlariga parallel qo'llaniladi.", "Turli xil amallar bitta ma'lumot ustida qat'iy ketma-ket tartibda bajariladi.", "Hisoblash vazifalari faqat apparat arxitekturasi darajasida navbatga qo'yiladi.", "Barcha ma'lumotlar yagona protsessor keshiga yuklanib keyin tahlil qilinadi."], ["Vazifaviy parallelizm (task parallelism) qanday mazmunga ega?", "Masalani tashkil etuvchi bir-biridan farqli vazifalar bir vaqtda bajariladi.", "Aynan bitta algoritmik amal barcha hisoblash bloklarida sinxron yuritiladi.", "Protsessorning faqat buyruqlar konveyeridagi ichki parallelizmidan iborat.", "Taqsimlangan tizimlarda barcha tugunlarga bir xil dastur nusxasi yoziladi."], ["OpenMP texnologiyasining asosiy vazifasi qaysi javobda to'g'ri ifodalangan?", "Umumiy xotirali tizimlarda parallel sikl va bloklarni tashkil etish.", "Klaster tarmoqlarida protsesslar o'rtasida paketlar almashinuvini tuzish.", "Katta hajmli fayllarni taqsimlangan fayl tizimlarida qismlarga taqsimlash.", "Grafik yadrolarda har bir pikselni alohida render qilishni boshqarish."], ["MPI (Message Passing Interface) texnologiyasi qaysi sohaga mo'ljallangan?", "Klaster va taqsimlangan tizimlarda protsesslararo xabar almashishga.", "Bitta shaxsiy kompyuter ichidagi ko'p oqimli dasturlarni sinovdan o'tkazishga.", "Sun'iy intellekt modellarini faqat mobil telefon xotirasida o'qitishga.", "Protsessorning arifmetik-mantiqiy qurilmasidagi kechikishlarni kamaytirishga."], ["CUDA texnologiyasi asosan qaysi apparat platformasida hisoblash olib boradi?", "Grafik protsessor (GPU) yadrolarida ommaviy parallel amallarni bajarishda.", "Faqat bir yadroli markaziy protsessorlarning tezligini dasturiy oshirishda.", "Serverlararo optik tola orqali bog'langan taqsimlangan hisoblash tugunlarida.", "Magnitli xotira qurilmalarida ma'lumotlarni oqimlab yozish va o'qish ishlarida."], ["Parallel dasturlashdagi 'Race condition' holati nimani anglatadi?", "Oqimlar bir xil ma'lumotni o'zgartirganda natija tartibga bog'liq bo'lishi.", "Barcha oqimlarning bir-birida band bo'lgan resurslarni kutib qotib qolishi.", "Protsessor yadrolari o'rtasida yuklamaning haddan tashqari teng taqsimlanishi.", "Parallel dasturning ketma-ket variantga qaraganda ancha sekinroq ishlashi."], ["Parallel tizimlarda 'Deadlock' muammosi qanday yuzaga keladi?", "Oqimlar o'zaro band bo'lgan resurslarni kutib, bajarilishdan to'xtab qolganda.", "Hisoblash resurslariga vazifalar noto'g'ri va notekis tarzda taqsimlanganda.", "Oqimlar orasida axborot almashish tezligi apparat chastotasidan oshib ketganda.", "Ketma-ket bajariladigan qism dasturning barcha oqimlarini o'chirib qo'yganda."], ["Parallel hisoblashda 'Load balancing' tushunchasi nimani ifodalaydi?", "Vazifalarni protsessorlar o'rtasida imkon qadar teng taqsimlash jarayonini.", "Xotiradagi bo'sh o'rinlarni o'chirib, oqimlarning barchasini to'xtatib turishni.", "Barcha parallel hisoblashlarni faqat bitta eng kuchli protsessorga yuklashni.", "Ma'lumotlar almashishdagi apparat xatolarini avtomatik tarzda tuzatib borishni."], ["Parallel dasturda 'Overhead' xarajatlari deganda nima tushuniladi?", "Oqim yaratish, sinxronlash va aloqa uchun sarflanadigan qo'shimcha vaqt.", "Ketma-ket kodning umumiy hajmini qisqartirish uchun ishlatiladigan resurs.", "Hisoblash natijalarining aniqligini oshirish uchun qo'llaniladigan xotira.", "Faqat protsessorning quvvat sarfini kamaytirishga qaratilgan apparat yuki."], ["Tezlashish (speedup) ko'rsatkichi qaysi formula yordamida hisoblanadi?", "S = T1 / Tp nisbati orqali ifodalanadi.", "S = Tp / T1 nisbati orqali ifodalanadi.", "S = T1 · Tp ko'paytmasi bilan topiladi.", "S = T1 + Tp yig'indisi orqali topiladi."], ["Amaliyotda resurslar soni oshirilganda tezlashish nima sababli cheklangan bo'ladi?", "Parallel bo'lmagan qism, sinxronlash va aloqa xarajatlari mavjudligi sababli.", "Operatsion tizim oqimlar sonini hech qachon ikkitadan ortiq qila olmasligi uchun.", "Massiv elementlarining yig'indisini hisoblash imkoniyati butunlay yo'qligi uchun.", "Grafik tezlatkichlar klaster tizimlariga umuman ulanmasligi va ishlamasligi uchun."], ["1 000 000 ta son yig'indisini parallel usulda hisoblash qanday amalga oshiriladi?", "Massiv qismlarga bo'linadi, oqimlar hisoblaydi va natijalar birlashtiriladi.", "Barcha sonlar yagona oqimda ketma-ket birin-ketin to'liq qo'shib chiqiladi.", "Har bir son alohida protsessor yadrosiga bittadan joylashtirilib qo'shiladi.", "Massiv elementlari avval saralanadi va faqat toq sonlar yig'indisi olinadi."], ["Oqim (thread) tushunchasiga berilgan eng to‘g‘ri ta’rifni aniqlang.", "Protsess ichida bajariladigan mustaqil boshqaruv oqimi bo‘lib, dasturdagi alohida vazifalarni bajarishga xizmat qiladi.", "Operatsion tizim tomonidan alohida ajratilgan butun xotira maydoni va apparat resurslariga ega mustaqil dastur hisoblanadi.", "Kompyuterning qattiq diskida saqlanuvchi va faqat foydalanuvchi buyrug‘i orqali ishga tushiriladigan bajariluvchi fayldir.", "Dastur kodidagi sintaktik xatoliklarni avtomatik tarzda aniqlab, ularni kompilyatsiya jarayonida tuzatuvchi tizimdir."], ["Nima sababli oqimlar o‘rtasida ma’lumot almashish jarayoni alohida protsesslarga qaraganda ancha tez va yengil kechadi?", "Oqimlar bitta protsessga tegishli umumiy xotira maydonidan to‘g‘ridan-to‘g‘ri birgalikda foydalana oladi.", "Oqimlar faqat protsessorning eng yuqori darajadagi kesh registrlarida mutlaqo mustaqil qayta ishlanadi.", "Oqimlar o‘zaro axborot almashish uchun doimiy ravishda tashqi tarmoq soketlaridan foydalanib ishlaydi.", "Oqimlar operatsion tizimning diskdagi virtual xotirasidan maxsus shifrlangan kanallar orqali uzatiladi."], ["Oqimlarning ishlash prinsipida rejalashtiruvchi (scheduler) qanday asosiy vazifani bajaradi?", "Oqimlarning navbati va bajarilishi uchun protsessor vaqtini tizimli tarzda taqsimlab beradi.", "Oqimlarning dasturiy kodini tahlil qilib, ulardagi mantiqiy xatolarni to‘liq bartaraf etadi.", "Oqimlar yaratilishidan avval ularning barcha xotira bloklarini qattiq diskka zaxiralab boradi.", "Oqimlar yakunlangandan keyin butun operatsion tizimni qayta yuklash jarayonini boshqaradi."], ["Oqim hayotiy siklidagi NEW holati qanday holatni ifodalaydi?", "Oqim dasturda yaratilgan, biroq uning bajarilish jarayoni hali boshlanmagan holat.", "Oqim o‘z vazifasini to‘liq bajarib bo‘lgan va xotiradan butunlay chiqarilgan holat.", "Oqim protsessor tomonidan ayni vaqtda faol tarzda hisoblashni bajarayotgan holat.", "Oqim ma’lum bir tashqi resurs yoki apparat signalining kelishini kutayotgan holat."], ["Oqim hayotiy siklidagi RUNNABLE holatining mazmuni to‘g‘ri berilgan javobni toping.", "Oqim bajarilishga to‘liq tayyor va protsessor vaqti ajratilishini kutmoqda.", "Oqim faqat tashqi ma’lumotlar bazasidan javob olish uchun to‘xtatib turilibdi.", "Oqim dasturiy ta’minot tomonidan majburiy tarzda bloklangan va kutilmoqda.", "Oqim barcha zaruriy hisoblashlarni yakunlab, o‘z ishini butunlay tugatgan."], ["Oqim hayotiy siklida RUNNING holatiga o‘tgan oqim nima bilan band bo‘ladi?", "Oqim ayni vaqtda protsessor tomonidan faol ravishda bajarilayotgan bo‘ladi.", "Oqim yangi resurslar ajratilishini kutib, vaqtincha to‘xtatilgan holatda turadi.", "Oqim xotira maydoni tozalanishi uchun navbatda kutish jarayonini amalga oshiradi.", "Oqim operatsion tizim tomonidan o‘chirilish arafasida turgan jarayon hisoblanadi."], ["Qaysi holatda oqim BLOCKED yoki WAITING holatiga o‘tadi?", "Resurs, maxsus signal, kiritish-chiqarish yoki boshqa shart bajarilishini kutganda.", "Oqim o‘ziga biriktirilgan vazifani muvaffaqiyatli tarzda to‘liq bajarib bo‘lganda.", "Oqim yangi yaratilib, tizim tomonidan unga hali nom berilmagan boshlang‘ich vaqtda.", "Protsessor yadrosi o‘z quvvatini eng maksimal darajada sarflab ishlayotgan paytda."], ["Oqim hayotiy siklida TERMINATED holati nimani bildiradi?", "Oqim o‘z vazifasini to‘liq tugatgan va bajarilish jarayonidan butunlay chiqarilgan.", "Oqim yangi ma’lumotlarni qabul qilish uchun tizim tomonidan vaqtincha to‘xtatilgan.", "Oqim bir vaqtning o‘zida bir nechta umumiy resurslarga kirish uchun ruxsat olgan.", "Oqim rejalashtiruvchi tomonidan faqat navbatdagi qadamga o‘tkazilishini kutmoqda."], ["Ko‘p oqimli dasturlashda dasturning javob berish tezligini yaxshilash qanday ta’minlanadi?", "Uzoq davom etadigan og‘ir amallar fon oqimida bajarilganda, asosiy interfeys o‘z ishini davom ettiradi.", "Barcha oqimlar bir vaqtda faqat bitta umumiy xotira registriga navbat kutmasdan to‘g‘ridan-to‘g‘ri yozadi.", "Kompilyator barcha shartli o‘tish amallarini o‘chirib, kodni faqat chiziqli ketma-ketlikda qayta tuzadi.", "Foydalanuvchi kiritgan har bir belgi alohida qattiq disk sektoriga doimiy ravishda nusxalab boriladi."], ["Ko‘p yadroli zamonaviy protsessorlarda ko‘p oqimli dasturlarning ishlash xususiyati nimada namoyon bo‘ladi?", "Bir nechta oqimlar alohida jismoniy yadrolarda bir vaqtning o‘zida haqiqiy parallel bajarilishi mumkin.", "Barcha oqimlar faqat bitta yadroda majburiy ravishda juda qat’iy ketma-ketlik asosida navbat kutadi.", "Oqimlar orasida xotira almashinuvi to‘liq to‘xtatilib, faqat tashqi disk kanallari ishga tushiriladi.", "Har bir dastur o‘z oqimlarini faqat bitta umumiy grafik protsessor orqali qayta ishlashga majbur bo‘ladi."], ["C/C++ tillarida oqimlar (threads) texnologiyasining asosiy imkoniyati va qo‘llanish sohasi qaysi javobda to‘g‘ri ko‘rsatilgan?", "Past darajada oqimlarni yaratish va boshqarish; tizimli hamda yuqori unumdor dasturlar.", "Faqat brauzer sahifalarida veb-animatsiyalarni yaratish; vizual dizayn dasturlari tizimi.", "Matnli fayllarni formatlash va jadvallarni qayta ishlash; ofis ilovalarining standart moduli.", "Faqat relyatsion ma’lumotlar bazalarida so‘rovlarni bajarish; axborot saqlash omborlari."], ["Python dasturlash tilidagi standart `threading` moduli asosan qanday turdagi masalalarni bajarishda qo‘llaniladi?", "Kiritish-chiqarish (I/O) hamda kutish jarayonlari bilan bog‘liq vazifalarni boshqarishda.", "Faqat juda murakkab 3D grafik obyektlarni render qilish va video fayllarni montajlashda.", "Faqat kompyuter apparat qismlarining bios dasturiy ta’minotini yangilash jarayonlarida.", "Matematik formulalarni qog‘ozga chop etuvchi drayverlar bilan aloqa o‘rnatish ishlarida."], ["OpenMP texnologiyasining asosiy imkoniyati va qo‘llanish maqsadi nimalardan iborat?", "Parallel sikl va bloklarni tez tashkil etish; asosan ilmiy va texnik hisoblashlarda qo‘llanish.", "Mobil ilovalarning foydalanuvchi grafik interfeysini bezash va tugmalar dizaynini sozlash.", "Foydalanuvchi parollarini shifrlab, xavfsiz elektron pochta protokollarini ishlab chiqish.", "Lokal tarmoqdagi barcha kompyuterlarning IP manzillarini avtomatik tarzda taqsimlash."], ["Dasturlashda Thread Pool (oqimlar havzasi) mexanizmidan foydalanishning asosiy afzalligi nimada?", "Tayyor oqimlar guruhidan qayta foydalanish orqali ko‘p sonli qisqa vazifalarni samarali bajarish.", "Dasturdagi barcha xotira xatolarini mustaqil ravishda aniqlab, ularni avtomatik o‘chirib yuborish.", "Protsessorning jismoniy chastotasini sun’iy tarzda oshirish orqali tezlikni ikki barobar ko‘paytirish.", "Foydalanuvchiga dastur kodini tahrirlash uchun maxsus grafik boshqaruv oynasini taqdim etish."], ["Sinxronlash mexanizmlaridan biri bo‘lgan Mutex nima vazifani bajaradi?", "Bir vaqtning o‘zida faqat bitta oqimga himoyalangan kod yoki resursga kirishga ruxsat beradi.", "Bir nechta oqimlarning hisoblash natijalarini jamlab, ularning o‘rtacha qiymatini hisoblaydi.", "Ishlatilmay qolgan barcha oqimlarni zudlik bilan yo‘q qilib, xotirani majburiy tozalab beradi.", "Oqimlar sonini chegarasiz ko‘paytirish maqsadida yangi protsessor modullarini ishga soladi."], ["Sinxronlash vositalari orasida Semaphore tushunchasining asosiy xususiyati nimadan iborat?", "Resursdan foydalanish imkoniyatini sanovchi va bir nechta oqim kirishini boshqaruvchi vositadir.", "Faqat birgina oqimning xotiraga kirishini qat’iyan taqiqlab, qolgan barcha oqimlarni o‘chiradi.", "Fayllarni arxivlash jarayonida ma’lumotlarni siqish darajasini belgilab beruvchi maxsus algoritm.", "Barcha tarmoq portlarini bir vaqtda tekshirib, xavfsizlik protokollarini sozlovchi vositadir."], ["Sinxronlashdagi Barrier vositasining ishlash tamoyili qanday tushuntiriladi?", "Bir nechta oqimni ma’lum bosqichda kutib, barchasi yetib kelgandan keyin davom ettirish imkonini beradi.", "Biror oqim xatolikka uchraganda butun dastur faoliyatini butunlay to‘xtatish uchun xizmat qiladi.", "Oqimlarning bir-biriga xabar jo‘natishini to‘liq taqiqlab, xotira maydonini alohida qismlarga ajratadi.", "Kiritish-chiqarish amallarini tezlashtirish maqsadida oqimlarning barcha navbatlarini bekor qiladi."], ["Oqimlar sinxronlashida Condition variable vositasi qanday maqsadda ishlatiladi?", "Muayyan shart bajarilguncha oqimni kutishga qo‘yish va shart bajarilganda uni qayta uyg‘otish uchun.", "Dastur ishlayotgan vaqtda o‘zgaruvchilarning tiplarini dinamik ravishda o‘zgartirib borish maqsadida.", "Protsessor chastotasini haroratga qarab pasaytirish yoki oshirish buyruqlarini uzatish uchun.", "Ko‘p yadroli tizimlarda mavjud barcha oqimlarning kodlarini ekranda vizual namoyish etish uchun."], ["Oqimlar bilan ishlashda kuzatiladigan Race condition muammosi qachon yuzaga keladi?", "Bir nechta oqim umumiy ma’lumot bilan bir vaqtda ishlaganda natija ularning bajarilish tartibiga bog‘liq bo‘lib qolganda.", "Oqimlar o‘zaro kelishilgan holda xotirani teng taqsimlab olib, bir-biriga mutlaqo xalaqit bermasdan ishlagan paytda.", "Tizimda barcha oqimlar o‘z vazifalarini to‘liq yakunlab, protsessor resurslari butunlay bo‘shab qolgan vaqtda.", "Faqat bitta oqim ishlab, boshqa oqimlarning barchasi dasturchi tomonidan kod darajasida butunlay o‘chirilganda."], ["Ko‘p oqimli tizimlarda Deadlock (boshi berk ko‘cha) muammosi qanday vaziyatda yuz beradi?", "Oqimlarning bir-birida band bo‘lgan resurslarni kutib, hech biri o‘z ishini davom ettira olmay qolganda.", "Oqimlar barcha mavjud resurslarni ortig‘i bilan olib, belgilangan hisoblash ishlarini muddatidan oldin tugatganda.", "Dastur kodi bitta oqimli tizimda bajarilib, protsessorning barcha yadrolari baravar maksimal yuklanishda ishlaganda.", "Operatsion tizim oqimlarga xotiradan joy ajratishni rad etib, fayllarni to‘g‘ridan-to‘g‘ri kesh xotiraga yuklaganda."], ["Ko‘p oqimlilik (Multithreading) texnologiyasining asosiy mohiyati nimadan iborat?", "Dastur ichida bir nechta vazifalarni bir vaqtning o‘zida bajarish imkoniyatini taqdim etadi.", "Dasturdagi barcha buyruqlarni qat’iy ketma-ketlikda xatosiz amalga oshirishni ta’minlaydi.", "Dastur kodini optimallashtirib faqat bitta protsessor yadrosida to‘liq ishlashga moslaydi.", "Dastur xotirasidagi o‘zgaruvchilar sonini avtomatik tarzda keskin kamaytirishga xizmat qiladi."], ["C++ dasturlash tilida ko‘p oqimlilik bilan ishlash qaysi standartdan boshlab qulaylashdi?", "C++11 standartidan boshlab maxsus rasmiy vositalar kiritildi.", "C++98 standartidan boshlab dastlabki rasmiy qoidalar kiritildi.", "C++03 standartidan boshlab qo‘shimcha oqim tushunchasi kiritildi.", "C++20 standartidan boshlab barcha eski oqim kutubxonasi kiritildi."], ["Oqim (Thread) tushunchasiga berilgan to‘g‘ri ta’rif qaysi javobda keltirilgan?", "Oqim bu dastur bajarilishining mustaqil kichik qismidir.", "Oqim bu xotiradagi o‘zgarmas konstantalar to‘plamidir.", "Oqim bu faqat ma’lumotlar bazasini boshqaruvchi fayldir.", "Oqim bu kompyuter ekraniga grafik tasvir chizuvchi moduldir."], ["C++ dasturlarida asosiy oqim (asosiy jarayon) odatda qaysi funksiyadan boshlanadi?", "Dasturning asosiy oqimi main() funksiyasidan boshlanadi.", "Dasturning asosiy oqimi init() funksiyasidan boshlanadi.", "Dasturning asosiy oqimi start() funksiyasidan boshlanadi.", "Dasturning asosiy oqimi loop() funksiyasidan boshlanadi."], ["Oddiy dasturlarda buyruqlarning ketma-ket bajarilish usuli qanday kamchilikka ega?", "Murakkab masalalarda umumiy vaqtning ko‘p sarflanishiga olib kelishi mumkin.", "Xotiradan foydalanish darajasini to‘liq nazoratdan chiqarib yuborishi mumkin.", "Protsessor registrlarida kutilmagan apparat xatoliklarini keltirib chiqaradi.", "Kompyuter tarmoq portlari o‘rtasida to‘qnashuvlarni sun’iy ravishda ko‘paytiradi."], ["C++ tilida oqimlar (thread) bilan ishlash uchun qaysi kutubxona ulanishi shart?", "Kod boshida maxsus #include &lt;thread&gt; kutubxonasi ulanadi.", "Kod boshida maxsus #include &lt;vector&gt; kutubxonasi ulanadi.", "Kod boshida maxsus #include &lt;memory&gt; kutubxonasi ulanadi.", "Kod boshida maxsus #include &lt;system&gt; kutubxonasi ulanadi."], ["C++ tilida yangi oqim (thread) ob’ektini yaratish qaysi sintaksis orqali ifodalanadi?", "Yangi oqim yaratish uchun thread oqim(nomi); ko‘rinishi ishlatiladi.", "Yangi oqim yaratish uchun create_thread(nomi); ko‘rinishi ishlatiladi.", "Yangi oqim yaratish uchun process oqim(nomi); ko‘rinishi ishlatiladi.", "Yangi oqim yaratish uchun stream oqim(nomi); ko‘rinishi ishlatiladi."], ["Ko‘p oqimli dasturlarda join() funksiyasining asosiy vazifasi nimadan iborat?", "Asosiy oqimga yangi yaratilgan oqim tugaguncha kutishni buyuradi.", "Asosiy oqimga yangi oqim ishini majburan to‘xtatishni buyuradi.", "Oqimlar o‘rtasidagi barcha umumiy ma’lumotlarni butkul tozalaydi.", "Oqimning bajarilish tezligini protsessor taktiga moslab oshiradi."], ["Dasturda join() funksiyasi ishlatilmasa, qanday salbiy oqibat yuzaga kelishi mumkin?", "Asosiy dastur tugab, yangi oqim o‘z ishini yakunlay olmasligi mumkin.", "Operatsion tizim zudlik bilan barcha ochiq fayllarni o‘chirishi mumkin.", "Kompyuter protsessori haddan tashqari qizib o‘z-o‘zidan o‘chishi mumkin.", "Manba kodi kompilyatsiya bosqichida sintaktik xatoga uchrashi mumkin."], ["Oqimni asosiy dasturdan mustaqil ishlashga ajratish uchun qaysi funksiya qo‘llaniladi?", "Mustaqil ishlashga ajratish maqsadida detach() funksiyasi qo‘llaniladi.", "Mustaqil ishlashga ajratish maqsadida freeze() funksiyasi qo‘llaniladi.", "Mustaqil ishlashga ajratish maqsadida cancel() funksiyasi qo‘llaniladi.", "Mustaqil ishlashga ajratish maqsadida divide() funksiyasi qo‘llaniladi."], ["C++ dasturlash amaliyotida detach() funksiyasi asosan qanday jarayonlarda ishlatiladi?", "Odatda uzoq vaqt davom etadigan mustaqil foniy jarayonlarda keng ishlatiladi.", "Odatda juda qisqa vaqtda yakunlanadigan matematik hisob-kitoblarda qo‘llanadi.", "Odatda asosiy dastur darhol to‘xtashi talab etiladigan maxsus hollarda ishlatiladi.", "Odatda faqat bitta oqim mavjud bo‘lgan oddiy konsol dasturlarida qo‘llanadi."], ["Ko‘p oqimlilik texnologiyasi zamonaviy kompyuter apparaturasining qaysi imkoniyatidan foydalanadi?", "Protsessorda bir nechta yadro mavjudligidan va ularning parallel ishlashidan.", "Qattiq disk hajmining kattaligidan va undagi ma’lumotlar almashish tezligidan.", "Tezkor xotiraning muntazam tozalanishidan va kesh hajmining ortib borishidan.", "Tarmoq platasining yuqori o‘tkazuvchanligidan hamda kiritish-chiqarish tezligidan."], ["Dasturning qulay ishlashi internet brauzeri misolida matnda qanday tasvirlangan?", "Bir oqim sahifani yuklaydi, boshqasi foydalanuvchi buyruqlarini qabul qiladi.", "Bir oqim matnni ekranga chiqaradi, boshqasi barcha xotira blokini tozalaydi.", "Bir oqim fayllarni arxivlaydi, boshqasi yangi brauzer drayverlarini tekshiradi.", "Bir oqim tizimni yangilaydi, boshqasi keshdagi eski ma’lumotlarni o‘chiradi."], ["Ko‘p oqimlilik texnologiyasida yuzaga keladigan eng katta muammolardan biri nima?", "Bir nechta oqim umumiy bir ma’lumot bilan bir vaqtda parallel ishlashidir.", "Dastur manba kodida sharhlar yetarli darajada qoldirilmagan bo‘lishidir.", "Kompilyator tomonidan kodning mashina tiliga juda sekin o‘girilishidir.", "Foydalanuvchi interfeysining ekranda to‘liq aks ettirilmay qolishidir."], ["Ikki oqim bir vaqtning o‘zida son++ amalini bajarganda qanday xavf yuzaga keladi?", "Ma’lumotlar bir vaqtda o‘zgarib, noto‘g‘ri natija hosil bo‘lishi mumkin.", "Operatsion tizim kodi buzilib, barcha o‘zgaruvchilar nolga aylanadi.", "Protsessor chastotasi pasayib, dastur qayta kompilyatsiya qilinadi.", "Ekranda barcha oqimlarning hisoblash natijalari birdan o‘chib ketadi."], ["Mutex vositasining ko‘p oqimli tizimlardagi asosiy vazifasi nimadan iborat?", "Oqimlarni tartibga solib, bir vaqtda faqat bitta oqimga ishlash imkonini beradi.", "Barcha oqimlarni bir zumda o‘chirib, xotira hajmini majburan bo‘shatib beradi.", "Hisoblash jarayonlarini tezlashtirish uchun oqimlarni guruhlarga taqsimlaydi.", "Dastur kodi xatolarini avtomatik tuzatib, yangi oqimlar sonini ko‘paytiradi."], ["C++ tilida mutex vositasidan foydalanish uchun qaysi maxsus kutubxona qo‘shiladi?", "Kod fayliga #include &lt;mutex&gt; kutubxonasi ulanishi talab etiladi.", "Kod fayliga #include &lt;locks&gt; kutubxonasi ulanishi talab etiladi.", "Kod fayliga #include &lt;guard&gt; kutubxonasi ulanishi talab etiladi.", "Kod fayliga #include &lt;block&gt; kutubxonasi ulanishi talab etiladi."], ["Mutex ob’ektiga tegishli lock() funksiyasi qanday amaliy vazifani bajaradi?", "Umumiy ma’lumotni boshqa oqimlardan himoyalab, unga kirishni bloklaydi.", "Yangi oqimni xotiraga yuklab, uni boshqa protsessor yadrosiga o‘tkazadi.", "Ishlayotgan oqimning xotirasini butunlay o‘chirib, vazifani bekor qiladi.", "Oqimlar orasidagi tarmoq ulanishlarini to‘xtatib, oqim ishini sekinlatadi."], ["Mutex ob’ektiga tegishli unlock() funksiyasining maqsadi qaysi javobda to‘g‘ri keltirilgan?", "Ma’lumotdan foydalanishni tugatib, boshqa oqimlar uchun kirishni ochadi.", "Dastur ishlashini to‘xtatib, barcha resurslarni operatsion tizimga beradi.", "Yangi oqimlarni yaratishni taqiqlab, faqat asosiy oqimni faollashtiradi.", "O‘zgaruvchilar qiymatini dastlabki holatiga qaytarib, hisobni tugatadi."], ["Matnga ko‘ra, kompyuter o‘yinlarida alohida oqimlarda bajarilishi mumkin bo‘lgan vazifalar qaysilar?", "Grafikani chiqarish, ovozni boshqarish hamda fizik hisoblashlarni bajarish.", "O‘yin kodini qayta yozish, antivirusni boshqarish va drayverni o‘rnatish.", "Internet tezligini oshirish, monitor rangini sozlash hamda xotirani yuvish.", "Fayllarni doimiy arxivlash, dasturni o‘chirish va reyestrni qayta tuzish."], ["C++ dasturlash tilida kutubxona (library) tushunchasiga qanday ta'rif berilgan? gonometrik sinusini hisoblaydi"], ["cmath kutubxonasidagi pow() funksiyasining dasturdagi asosiy vazifasi nimadan iborat?", "Berilgan sonni ma'lum bir darajaga ko'tarish", "Haqiqiy sonning kasr qismini butun songa yaxlitlash", "Sonning kvadrat ildiz qiymatini tezkor aniqlash", "Argument sifatida berilgan sonning modulini topish"], ["Sonning mutlaq qiymatini (modulini) hisoblash uchun cmath dagi qaysi funksiya qo'llaniladi?", "abs() funksiyasi", "cos() funksiyasi", "pow() funksiyasi", "sin() funksiyasi"], ["C++ tilida matnli satrlar bilan qulay ishlash uchun qaysi kutubxona ulanishi kerak?", "&lt;string&gt; kutubxonasi", "&lt;vector&gt; kutubxonasi", "&lt;ctime&gt; kutubxonasi", "&lt;cmath&gt; kutubxonasi"], ["Quyidagi kod natijasi nima bo'ladi: string ism=\"Ali\"; string fam=\"Valiyev\"; cout&lt;&lt;ism&lt;&lt;\" \"&lt;&lt;fam; ?", "Ali Valiyev", "AliValiyev", "Valiyev Ali", "\"Ali\" \"Val\""], ["C++ dasturida &lt;vector&gt; kutubxonasining asosiy vazifasi qaysi javobda to'g'ri ko'rsatilgan?", "Bir nechta ma'lumotlarni bitta to'plamda saqlash", "Matnli fayllardan satrlarni ketma-ket ko'chirib olish", "Matematik funksiyalarning hosilalarini hisoblab chiqish", "Ekranga ma'lumotlarni maxsus formatda chiroyli chiqarish"], ["Ushbu kod qismida nima chop etiladi: vector&lt;int&gt; sonlar = {10, 20, 30, 40}; cout &lt;&lt; sonlar[0]; ?", "10", "20", "30", "40"], ["Sonlar ketma-ketligini saralashda ishlatiladigan sort() funksiyasi qaysi kutubxonada joylashgan?", "&lt;algorithm&gt; kutubxonasida", "&lt;iostream&gt; kutubxonasida", "&lt;iomanip&gt; kutubxonasida", "&lt;fstream&gt; kutubxonasida"], ["Quyidagi kod bajarilgach ekranga nima chiqadi: vector&lt;int&gt; v={5,2,8,1,3}; sort(v.begin(),v.end()); ?", "Kichikdan kattaga tartiblangan sonlar", "Kattadan kichikka saralangan sonlar", "Faqat juft sonlardan tuzilgan massiv", "Dastlabki o'zgarishsiz qolgan ketma-ketlik"], ["C++ tilida vaqt bilan bog'liq amallarni bajarish uchun qaysi kutubxonadan foydalaniladi?", "&lt;ctime&gt; k ini sozlash", "Mijozlarning hisob raqamlaridan mablag'larni o'zboshimchalik bilan boshqa hisobga o'tkazish", "Moliyaviy bozorlardagi valyuta kurslarini qat'iy belgilab qo'yish va ularni o'zgartirmaslik"], ["Ekspert tizimlarining an'anaviy dasturlardan asosiy farqi qaysi javobda keltirilgan?", "Faqat hisob-kitoblar bilan cheklanmay, to'plangan bilimlar asosida mantiqiy xulosalar chiqarishi", "Faqat yuqori tezlikdagi kompyuterlarda ishlab, ma'lumotlar bazasiga mutlaqo ehtiyoj sezmasligi", "Dasturiy kodi faqat bitta dasturlash tilida yozilishi va boshqa tizimlar bilan ishlamasligi", "Foydalanuvchi interfeysiga ega bo'lmagan holda faqat matnli fayllar vositasida ma'lumot uzatishi"], ["Ekspert tizimlarining asosiy kamchiliklaridan biri sifatida nima ko'rsatiladi?", "Insonning noaniq va intuitiv bilimlarini to'liq formal qoidalarga keltirishning qiyinligi", "Katta hajmdagi faktlar va qoidalarni kompyuter xotirasida tezkorlik bilan saqlab bo'lmasligi", "Mantiqiy dasturlash tillari yordamida qoidalarni ifodalash imkoniyatlarining mavjud emasligi", "Tizimning doimiy ravishda bir xil ma'lumotlar asosida bir xil izchil xulosalar bera olishi"], ["Bilimlarni ifodalash jarayonining sun'iy intellekt tizimlaridagi asosiy mohiyati nimadan iborat?", "Ekspertga ma'lum bo'lgan bilimlarni kompyuter qayta ishlay oladigan shaklga keltirish jarayonidir.", "Faqatgina ma'lumotlar bazasidagi statik jadvallarni optimallashtirish va tartibga solish usulidir.", "Murakkab hisoblash algoritmlarining tezligini apparat vositalari orqali avtomatik oshirishdir.", "Kompyuter tarmoqlarida uzatilayotgan barcha raqamli signallarni to'liq shifrlash vositasidir."], ["Sun'iy intellekt nazariyasida oddiy ma'lumotlar va bilimlar o'rtasidagi asosiy farq qaysi javobda to'g'ri ko'rsatilgan?", "Oddiy ma'lumotlar alohida faktlarni bildirsa, bilimlar ular orasidagi bog'lanishlarni ifodalaydi.", "Oddiy ma'lumotlar doimo matnli bo'ladi, bilimlar esa faqatgina mantiqiy formulalar orqali yoziladi.", "Oddiy ma'lumotlar yangi bilim hosil qiladi, bilimlar esa faqat o'zgarmas sonli qiymatlarni saqlaydi.", "Oddiy ma'lumotlar formal modellarga tayanadi, bilimlar esa kompyuterda qayta ishlanmaydigan qismdir."], ["Bilimlarni ifodalashda sintaksis va semantika tushunchalari qanday vazifalarni ta'minlaydi?", "Sintaksis bilimlarning qanday yozilishini belgilasa, semantika ularning mazmuni va ma'nosini bildiradi.", "Sintaksis xotira hajmini tejashni belgilasa, semantika dasturiy kodlarning tezkor bajarilishini bildiradi.", "Sintaksis olingan yangi xulosalarni aniqlasa, semantika kiritilgan obyektlarning umumiy sonini bildiradi.", "Sintaksis qoidalar o'rtasidagi iyerarxiyani ochsa, semantika ma'lumotlar bazasining tuzilishini bildiradi."], ["Predikatlar mantiqida 'Oqiydi(Ali, Kitob)' ifodasi qanday ma'noni anglatadi va uning elementlari nimalardan iborat?", "'Oqiydi' predikati Ali va Kitob obyektlari o'rtasidagi harakat munosabatini aniq ifodalab beradi.", "'Ali' predikati Oqiydi va Kitob atributlarining o'zaro teng qiymatga ega ekanligini ifodalab beradi.", "'Kitob' predikati Ali obyektining umumiy toifa xususiyatlaridan birini to'liq ifodalab beradi.", "'Oqiydi' va 'Ali' obyektlari Kitob nomli predikatning argumentlari ekanligini ifodalab beradi."], ["Predikatlar mantiqida umumiy va mavjudlik kvantorlarining tutgan o'rni qanday izohlanadi?", "Umumiy kvantor barcha obyektlarga tegishlilikni, mavjudlik esa kamida bitta obyekt borligini ko'rsatadi.", "Umumiy kvantor faqat toq sonli faktlarni, mavjudlik kvantori esa juft sonli tushunchalarni ko'rsatadi.", "Umumiy kvantor o'zgaruvchilar munosabatini, mavjudlik kvantori esa faqat statik doimiylarni ko'rsatadi.", "Umumiy kvantor qoidaning inkor etilishini, mavjudlik kvantori esa uning mutlaq to'g'riligini ko'rsatadi."], ["Klassik mantiqiy bilimlarni ifodalash modellarining asosiy afzalligi nimadan iborat?", "Xulosalarni matematik jihatdan qat'iy va formal tarzda asoslab berish imkoniyatining mavjudligidir.", "Noaniq va ehtimoliy bilimlarni har doim qo'shimcha choralarsiz juda osonlik bilan modellashtirishidir.", "Katta hajmdagi grafik tasvirlarni intuitiv ravishda hech qanday qoidalarsiz o'z-o'zidan qurishidir.", "Tabiiy tildagi barcha so'zlarni avtomatik ravishda hech qanday sintaktik tahlilsiz qayta ishlashidir."], ["Semantik tarmoqlarda tugunlar va ular orasidagi yo'nalgan bog'lanishlar mos ravishda nimani ifodalaydi?", "Tugunlar obyektlar yoki tushunchalarni, yo'nalgan bog'lanishlar esa ular orasidagi munosabatlarni bildiradi.", "Tugunlar matematik funksiyalarni, yo'nalgan bog'lanishlar esa ularning bajarilish tezligini bildiradi.", "Tugunlar mantiqiy amallarni, yo'nalgan bog'lanishlar esa o'zgaruvchilarning xotiradagi hajmini bildiradi.", "Tugunlar faqat istisnolarni, yo'nalgan bog'lanishlar esa umumiy qoidalarning inkor etilishini bildiradi."], ["Semantik tarmoqlarda iyerarxik munosabatlarning qo'llanilishi qanday asosiy afzallikni taqdim etadi?", "Yuqori darajadagi tushunchaning xususiyatlari pastki darajadagilarga meros bo'lib o'tishini ta'minlaydi.", "Tarmoqdagi barcha munosabatlarning ma'nosini to'liq yo'qotib, faqat raqamli indekslarni ta'minlaydi.", "Hisoblash jarayonida xotira talablarini oshirib, obyektlar o'rtasidagi bog'liqlikni bartaraf etadi.", "Mavjud bilimlarni matn shaklida qayta yozish zaruriyatini butunlay istisno qilish imkonini beradi."], ["Freymlar iyerarxiyasida bilimlarni takrorlamasdan saqlash qaysi mexanizm orqali amalga oshiriladi?", "Quyi freymlarning yuqori freymlardagi xususiyatlar va qiymatlarni meros qilib olish mexanizmi orqali.", "Har bir freymga mutlaqo bir xil qiymatli slotlarni alohida-alohida qayta nusxalab yozish orqali.", "Barcha obyektlarni yagona qatlamda joylashtirib, iyerarxik darajalarni butunlay bekor qilish orqali.", "Slotlar ichidagi barcha o'zgaruvchilarni tasodifiy sonlar generatori yordamida yangilab borish orqali."], ["Ontologik modelning asosiy vazifasi va unga mos keluvchi formal tillar qaysi javobda to'g'ri ko'rsatilgan?", "Tushunchalarni tizimli tavsiflash va standartlashtirish; formal tillarga esa OWL va RDF kiradi.", "Faqat sonli o'zgaruvchilarni tahlil qilish va hisoblash; formal tillarga esa Pascal va Fortran kiradi.", "Tasodifiy hodisalarni ehtimollik asosida boshqarish; formal tillarga esa SQL va HTML tillari kiradi.", "Klassik mantiq qoidalarini inkor etgan holda ishlash; formal tillarga esa Assembler va Java kiradi."], ["Temporal mantiq modelining boshqa mantiqiy modellardan ajratib turuvchi asosiy jihati nimada?", "Hodisalarning qachon sodir bo'lishi va ularning vaqt bo'yicha ketma-ketlikda yuz berishini hisobga olishi.", "Barcha hodisalarni vaqt omilidan qat'i nazar faqat statik holatda tasvirlab berish bilan cheklanishi.", "Faqat ehtimollik nazariyasiga tayanib, mantiqiy xulosa chiqarish qoidalarini butunlay inkor qilishi.", "Bilimlar bazasidagi har bir qoidani faqatgina bitta qat'iy matematik formula orqali belgilashi."], ["PROLOG dasturlash tilida bilimlar qanday ko'rinishda saqlanadi va xulosa chiqarish qanday kechadi?", "Bilimlar faktlar va qoidalar ko'rinishida yozilib, unifikatsiya hamda qayta izlash orqali xulosa olinadi.", "Bilimlar faqat relyatsion jadvallarda yozilib, oddiy massivlarni chiziqli saralash orqali xulosa olinadi.", "Bilimlar tasodifiy og'irlik matritsalarida yozilib, gradient usulida tushish orqali xulosa olinadi.", "Bilimlar freym slotlarida doimiy yozilib, obyektga yo'naltirilgan kommutatsiya orqali xulosa olinadi."], ["Bilimlar bazasida verifikatsiya va validatsiya jarayonlarining asosiy maqsadi nimadan iborat?", "Qoidalar orasida ziddiyatlar yo'qligini tekshirish va bilimlarning real predmet sohasiga mosligini baholash.", "Bilimlar bazasidagi barcha matnlarni chet tillariga avtomatik tarjima qilish va arxivlashni ta'minlash.", "Kompyuterning protsessor tezligini oshirish maqsadida mavjud faktlarning teng yarmini tozalab tashlash.", "Foydalanuvchi parollarining xavfsizligini ta'minlash uchun qoidalar kodini to'liq shifrlab yopish."], ["Oddiy ma'lumotlar bilan bilimlar o'rtasidagi asosiy farq nimadan iborat?", "Ma'lumotlar alohida faktlarni bildirsa, bilimlar ushbu faktlararo bog'lanishlarni ifodalaydi.", "Ma'lumotlar mantiqiy xulosalarni bildirsa, bilimlar alohida qoidalar to'plamini ifodalaydi.", "Ma'lumotlar faqat matnli shaklda bo'lsa, bilimlar raqamli ko'rinishdagi jadvallarni ifodalaydi.", "Ma'lumotlar tizimli qoidalardan tashkil topsa, bilimlar faqat dastlabki belgilarni ifodalaydi."], ["Ekspertlardan bilimlarni ajratib olish jarayonida bilim muhandisining asosiy vazifasi nima?", "Mutaxassis fikrlarini savol-javob orqali o'rganib, kompyuter tushunadigan shaklga keltirish", "Predmet sohasidagi dasturiy vositalarni sinab ko'rib, yangi algoritmlarni ishlab chiqish", "Foydalanuvchi interfeysini to'liq shakllantirib, tizimning axborot xavfsizligini ta'minlash", "Dasturlash tillaridagi sintaktik xatolarni topib, axborot oqimini to'xtovsiz optimallash"], ["Bilimlarni ifodalashda mahsulot (produktsion) qoidalari odatda qanday tuzilmaga ega bo'ladi?", "\"Agar shart bajarilsa, unda tegishli xulosa hosil bo'ladi\" ko'rinishidagi mantiqiy shaklda", "\"Har bir obyekt faqat bitta sinfga tegishli bo'lishi shart\" mazmunidagi qat'iy talabda", "\"Faqat ehtimollik darajasi yuqori bo'lgan hodisalar saqlansin\" qabilidagi cheklovda", "\"Grafik tugunlar orasidagi barcha qirralar yo'naltirilgan bo'lsin\" tarzidagi qoidada"], ["Bilimlarni ifodalashning freym modellarida obyektlarning xususiyatlari qayerda saqlanadi?", "Obyekt parametrlarini tavsiflovchi maxsus slotlarda", "Tarmoq tugunlarini bog'lovchi yo'naltirilgan qirralarda", "Relyatsion jadvallarning indekslangan ustunlarida", "Dasturiy qoidalar ketma-ketligining maxsus steklarida"], ["Oldinga yo'naltirilgan xulosa chiqarish (forward chaining) mexanizmi qanday ishlaydi?", "Tizim dastlabki faktlardan boshlab, mos keluvchi qoidalar orqali yangi xulosalar hosil qiladi.", "Tizim tekshirilishi lozim bo'lgan maqsaddan boshlab, uni tasdiqlovchi faktlarni qidiradi.", "Tizim obyektlarning barcha istisnolarini tekshirib, qoidalarni to'liq bekor qilib chiqadi.", "Tizim faqat noaniq qiymatlarni hisoblab, ehtimollik darajasi past bo'lgan yo'lni tanlaydi."], ["Matnga ko'ra, orqaga yo'naltirilgan xulosa chiqarish tamoyilidan qaysi dasturlash tili keng foydalanadi?", "PROLOG dasturlash tili", "Python dasturlash tili", "Pascal dasturlash tili", "Kotlin dasturlash tili"], ["Bilimlarni umumlashtirish (generalization) usuliga qaysi ta'rif to'g'ri keladi?", "Alohida olingan faktlar va kuzatuvlardan umumiy qonuniyat yoki qoida hosil qilish", "Umumiy tushunchalarni faqat muayyan bir obyektning xususiyatlariga moslashtirish", "Dasturdagi barcha o'zgaruvchilarning turlarini majburiy tarzda bir xillashtirish", "Bilimlar bazasidagi har bir qoidani alohida slotlarga ajratib ko'chirib o'tkazish"], ["Mashinaviy o'rganishda modelning umumlashtirish qobiliyati (generalization ability) nima uchun muhim?", "Tizim nafaqat o'rgatilgan misollarni, balki yangi kelgan ma'lumotlarni ham to'g'ri baholashi uchun", "Tizim faqat berilgan dastlabki matnlarni so'zma-so'z to'liq yodlab olish imkoniga ega bo'lishi uchun", "Tizim barcha qoidalarni faqat orqaga yo'naltirilgan mantiqiy zanjir asosida qayta ishlashi uchun", "Relyatsion jadvallardagi barcha ma'lumotlarni doimiy ravishda avtomatik indekslab borishi uchun"], ["Analogiya asosida bilim bilan ishlash usulining o'ziga xos xususiyati nimada?", "Vaziyatlar orasidagi o'xshashlikka tayanadi va qat'iy isbot emas, ehtimoliy xulosa beradi.", "To'liq matematik isbotlarga asoslanadi va har doim mutlaq kafolatlangan xulosa beradi.", "Faktlarning faqat yuzaki parametrlarini hisobga oladi va chuqur tahlilni istisno qiladi.", "Faqat sonli qiymatlar bilan ishlaydi va tizimdagi barcha umumiy qoidalarni inkor etadi."], ["Loyqa mantiq (fuzzy logic) qanday turdagi bilimlar bilan ishlash uchun xizmat qiladi?", "\"Issiq\", \"yuqori\" kabi qat'iy \"rost\" yoki \"yolg'on\" qiymatga ega bo'lmagan noaniq bilimlar bilan", "Faqat ikkilik sanoq tizimida berilgan hamda mutlaq yati", "Faqat chiziqli algebraik tenglamalar sistemasini tezkor yechishga ixtisoslashgan tuzilishi", "Hisoblash bloklari orasida axborotni faqat ikkilik kod ko‘rinishida qabul qilish qobiliyati", "Tizimdagi noaniqliklarni istisno qiluvchi qat’iy Bulev mantiqiga to‘liq asoslanganligi"], ["Obyektga yo‘naltirilgan bilimlarni ifodalash modelida sinf atributlari va metodlari nimani bildiradi?", "Atributlar obyektning holat ma’lumotlarini saqlaydi, metodlar esa uning xatti-harakatini beradi", "Atributlar tashqi kirish qurilmalarini bildiradi, metodlar esa xotira manzilini ko‘rsatadi", "Atributlar mantiqiy qoidalarning shartini bildiradi, metodlar esa dasturdagi xatolarni tuzatadi", "Atributlar fizik o‘lchov birliklarini ifodalaydi, metodlar esa hisoblash quvvatini boshqaradi"], ["Noaniq bilimlarni ifodalashda loyqa mantiq (fuzzy logic) qanday matematik asosga tayanadi?", "Obyektning to‘plamga tegishlilik darajasini nol va bir oralig‘idagi qiymat bilan baholashga", "Barcha mulohazalarni istisnosiz faqat rost (1) yoki yolg‘on (0) qiymatlarga keltirishga", "Grafik ko‘rinishdagi tugunlararo masofalarni Evklid geometriyasi asosida qat’iy o‘lchashga", "Matritsalarning determinanti va teskari matritsani standart algoritmlar orqali hisoblashga"], ["Xulosa chiqarishning orqaga yo‘naltirilgan usuli (backward chaining) qanday tartibda ishlaydi?", "Avval yakuniy maqsad belgilanadi, so‘ngra uni tasdiqlovchi faktlar va qoidalar izlanadi", "Avval barcha mavjud faktlar olinadi, so‘ngra barcha qoidalar ketma-ket ishga tushiriladi", "Avval tasodifiy gipoteza tanlanadi, so‘ngra tizim qayta yuklanib faktlar xotiradan o‘chiriladi", "Avval grafik ko‘rinishdagi barcha tugunlar aylanib chiqiladi, so‘ngra xulosalar bekor qilinadi"], ["Bilimlar bazasini validatsiya qilish jarayoni qanday asosiy maqsadga yo‘naltirilgan?", "Bazadagi bilimlarning real predmet sohasi voqeligiga mos kelishini har tomonlama baholashga", "Matnli ma’lumotlarning shrift o‘lchamlari standart talablarga mosligini to‘liq ta’minlashga", "Algoritmning kompyuter mikroprotsessorida qancha energiya sarflashini amaliy o‘lchashga", "Fayllarning zahira nusxalarini bulutli serverlarga avtomatik jadval asosida ko‘chirishga"], ["Gibrid bilimlarni ifodalash modellarining asosiy afzalligi qaysi javobda to‘g‘ri ta’riflangan?", "Turli modellarning kuchli jihatlarini birlashtirib, murakkab masalalarni samarali yechish", "Dasturiy tizimdagi hisoblash xotirasi hajmini bir necha kilobaytgacha majburan siqish", "Tizimni faqat bitta formal qoidalar to‘plamiga qat’iy bog‘lab qo‘yish imkoniyatini yaratish", "Bilimlar bazasidagi noaniqliklarni umuman hisobga olmasdan qat’iy xulosalar ishlab chiqish"], ["Matnga binoan oddiy ma’lumotlar bilan bilimlar o‘rtasidagi asosiy farq nimalardan iborat?", "Oddiy ma’lumotlar alohida faktlarni, bilimlar esa ular orasidagi bog‘liqlikni bildiradi", "Oddiy ma’lumotlar faqat matnlardan, bilimlar esa sonli jadvallardan tashkil topgan bo‘ladi", "Oddiy ma’lumotlar qoidalardan iborat bo‘lsa, bilimlar qat’iy algoritmlarga asoslanadi", "Oddiy ma’lumotlar kompyuter xotirasida, bilimlar esa faqat inson miyasida joylashgan bo‘ladi"], ["Ekspertdan suhbat va savol-javob orqali bilimlarni olish jarayoni qanday nomlanadi?", "Bilimlarni ajratib olish va ularni maxsus tizimga kiritish jarayoni deb yuritiladi", "Bilimlarni optimallashtirish va ularni iyerarxik shakllantirish jarayoni hisoblanadi", "Bilimlarni avtomatik tarzda tahlil qilish va ularni modellashtirish deb ataladi", "Bilimlarni umumlashtirish va ularni qat’iy mantiqiy qoidalarga ajratish deb qaraladi"], ["Obyektlarning xususiyatlari maxsus slotlarda saqlanadigan bilim ifodalash modeli qaysi?", "Freymlar asosidagi bilim ifodalash modeli hisoblanadi", "Semantik tarmoqlarga asoslangan maxsus model hisoblanadi", "Mahsulot qoidalariga tayangan deduktiv model hisoblanadi", "Predikatlar mantiqiga qurilgan qat’iy model hisoblanadi"], ["Mahsulot qoidalari (production rules) odatda qaysi mantiqiy tuzilma asosida shakllantiriladi?", "“Agar muayyan shart bajarilsa, unda tegishli xulosa hosil bo‘ladi” ko‘rinishida tuziladi", "“Har qanday tushuncha o‘zining quyi sinfiga ega bo‘lishi shartdir” ko‘rinishida tuziladi", "“Slotlar orasidagi barcha munosabatlar qat’iy qiymatga egadir” ko‘rinishida tuziladi", "“Yangi olingan xulosalar boshlang‘ich faktlar bilan bir xildir” ko‘rinishida tuziladi"], ["Semantik qidiruvning oddiy kalit so‘zlar bo‘yicha qidiruvdan ustunligi nimada namoyon bo‘ladi?", "U so‘zlarning ma’nosini hamda tushunchalar orasidagi mantiqiy bog‘liqlikni hisobga oladi", "U faqat matndagi harflar soniga tayanib ma’lumotlarni eng yuqori tezlikda aniqlab beradi", "U barcha belgilarni faqat dasturlash tilining sintaksisi asosida ketma-ket saralab chiqadi", "U tushunchalarni tahlil qilmasdan faqatgina kiritilgan so‘z shakllarini to‘g‘ridan-to‘g‘ri topadi"], ["Alohida faktlar va xususiy holatlardan umumiy qoida yoki tushuncha hosil qilish qaysi usulga xos?", "Bilimlarni umumlashtirish usuliga to‘liq mos keladigan mantiqiy yondashuv hisoblanadi", "Bilimlarni konkretlashtirish usuliga oid bo‘lgan xususiy natija chiqarish hisoblanadi", "Bilimlarni tasniflash orqali ularni guruhlarga ajratish tamoyiliga tayangan jarayondir", "Bilimlarni analogiya vositasida yangi sharoitlarga moslashtirish amali hisoblanadi"], ["Umumiy qoidadan muayyan alohida holatga tegishli xulosa chiqarish jarayoni qanday ataladi?", "Bilimlarni konkretlashtirish usuli deb ataladi va individual qaror shakllantiradi", "Bilimlarni umumlashtirish usuli deb ataladi va umumiy qonuniyatlarni ochib beradi", "Bilimlarni tasniflash usuli deb ataladi va barcha ma’lumotlarni sinflarga bo‘ladi", "Bilimlarni taqqoslash usuli deb ataladi va o‘xshashlik darajasini o‘lchashga xizmat qiladi"], ["Oldingi muammolar va ularning yechimlari asosida yangi holatga yechim topish qaysi usulga xos?", "Holatga asoslangan fikrlash (taqqoslash va moslashtirish) yondashuviga to‘liq tegishlidir", "Oldinga yo‘naltirilgan deduktiv xulosa chiqarish mexanizmiga xos bo‘lgan xususiyatdir", "Orqaga yo‘naltirilgan maqsadli tekshiruv va isbotlash jarayoniga tegishli mexanizmdir", "Bilimlarni iyerarxik shaklda qat’iy sinflarga ajratish tamoyiliga tayangan jarayondir"], ["Nima sababli bilimlar bazasida kiritilgan o‘zgarishlar tarixi saqlanishi zarur hisoblanadi?", "Noto‘g‘ri bilim kiritilganda tizimni oldingi to‘g‘ri holatga qaytarish imkoni bo‘lishi uchun", "Kompyuterning asosiy xotirasida fayllar hajmini doimiy ravishda sun’iy oshirib borish uchun", "Barcha mantiqiy qoidalarni foydalanuvchiga ko‘rsatmasdan butunlay yashirib qo‘yish uchun", "Ekspertlarning tizimdagi faoliyatini cheklab, ularning dasturga kirishini to‘xtatish uchun"], ["Loyqa mantiqda (fuzzy logic) biror xususiyatning darajasi qaysi oraliqdagi qiymat bilan o‘lchanadi?", "Nol va bir oralig‘idagi (0 dan 1 gacha bo‘lgan) haqiqiy sonli qiymat bilan ifodalanadi", "Faqatgina nol yoki bir bo‘lgan diskret mantiqiy munosabatlar vositasida ifodalanadi", "Minus cheksizlikdan musbat cheksizlikkacha bo‘lgan butun sonlar orqali ifodalanadi", "Noldan yuzgacha bo‘lgan ixtiyoriy butun ratsional miqdorlar yordamida ifodalanadi"], ["Turli dalillar asosida ehtimollarni yangilash imkonini beruvchi usul matnda qanday atalgan?", "Bayes usullari orqali noaniq bilimlarni tahlil qilish mexanizmi deb qayd etilgan", "Freymli modellar yordamida slotlarni ketma-ket to‘ldirish usuli deb ta’kidlangan", "Predikatlar mantiqi orqali qat’iy xulosalar chiqarish tamoyili deb ko‘rsatilgan", "Semantik grafiklarda chuqurlik bo‘yicha tezkor qidiruv usuli deb keltirilgan"], ["Matnga ko‘ra, neyron tarmoqlar bilan bog‘liq bo‘lgan asosiy amaliy muammo nimadan iborat?", "Ular orqali o‘rganilgan bilimlarning qaror chiqarish sabablarini tushuntirish qiyin bo‘ladi", "Ular katta hajmdagi raqamli ma’lumotlarni kompyuterda qayta ishlash imkoniyatiga ega emas", "Ular tibbiyot, sanoat va transport sohalarida amaliy jihatdan mutlaqo qo‘llanilmaydi", "Ular faqatgina bir xil turdagi oddiy faktlarni saqlashga mo‘ljallangan sodda tuzilmadir"]]}, {"name": "Elektronika va sxemalar", "q": [["Rezistorning elektr zanjiridagi asosiy vazifasi va uning sxematik belgisi qanday tushuntiriladi?", "Tok o‘tishiga qarshilik ko‘rsatib cheklash, uning belgisi to‘lqinsimon chiziqdir.", "Elektr zaryadini va energiyani vaqtinchalik saqlash, uning belgisi ikkita parallel chiziqdir.", "Tokning o‘tish yo‘nalishini faqat bir tomonga boshqarish, uning belgisi uchburchakdir.", "Yorug‘lik energiyasini chiqarish orqali signallarni ko‘rsatish, uning belgisi ok shaklidadir."], ["Diodning elektr zanjiridagi muhim vazifasi va uning sxematik belgisi qaysi javobda to‘g‘ri ko‘rsatilgan?", "Tokning o‘tish yo‘nalishini faqat bir tomonga boshqarish, uning belgisi uchburchakdir.", "Elektr zaryadini va energiyani vaqtinchalik saqlash, uning belgisi ikkita parallel chiziqdir.", "Tok o‘tishiga qarshilik ko‘rsatib cheklash, uning belgisi to‘lqinsimon chiziqdir.", "Zanjirdagi kuchlanishni barqarorlashtirish funksiyasini bajarish, uning belgisi romb shaklidadir."], ["Yorug‘lik chiqaruvchi diod (LED) ning asosiy vazifasi va uning sxematik belgisi qanday tavsiflanadi?", "Elektr energiyasini yorug‘lik energiyasiga aylantirish, uning belgisi o‘qlar bilan uchburchakdir.", "Tok yo‘nalishini nazorat qilish va bir tomonga o‘tkazish, uning belgisi o‘qlar bilan kvadratdir.", "Elektr zaryadini vaqtincha saqlash va keyin uni chiqarish, uning belgisi ikki chiziq bilan dumaloqdir.", "Zanjirda tok oqimini tartibga solish orqali uni cheklash, uning belgisi to‘lqinli chiziqdir."], ["Ohm qonunining matematik formulasi qanday ifodalanadi va undagi harflar qanday fizik kattaliklarni anglatadi?", "I = U / R, bu yerda I – elektr toki kuchi, U – kuchlanish, R – elektr qarshiligi.", "P = U · I, bu yerda P – elektr quvvati, U – kuchlanish, I – elektr toki kuchi.", "E = m · c^2, bu yerda E – energiya miqdori, m – massa, c – yorug‘lik tezligi.", "F = m · a, bu yerda F – ta’sir kuchi, m – massa, a – tezlanish qiymati."], ["Multimetrning COM (Common) porti nima uchun ishlatiladi va uning o‘rni qanday?", "Barcha o‘lchash turlari uchun manfiy probni ulashga mo‘ljallangan universal terminaldir.", "Faqat kuchlanishni o‘lchashda musbat probni ulash uchun ishlatiladigan maxsus portdir.", "Faqat yuqori tok kuchini o‘lchashda qo‘llaniladigan himoyalangan kirish joyidir.", "Qarshilikni o‘lchashda probni ulash uchun alohida mo‘ljallangan boshqa terminaldir."], ["Multimetrni noto‘g‘ri rejimda yoki noto‘g‘ri ulash natijasida qanday xavf yuzaga kelishi mumkin?", "Asbobning o‘ziga yoki o‘lchanayotgan sxemaga jiddiy shikast yetkazilishi ehtimoli mavjuddir.", "Faqat o‘lchov natijalarining noaniqligi yuzaga keladi, lekin asbobga zarar yetkazmaydi.", "Zanjirdagi barcha elektron komponentlarning haddan tashqari qizib ketishiga olib kelishi mumkin.", "Multimetrning batareyasini tez tugatishga olib keladi, ammo boshqa xavf tug‘dirmaydi."], ["Qarshilikni (Ohm) o‘lchashdan oldin qanday majburiy harakatni bajarish talab etiladi?", "Qarshilikni o‘lchashdan oldin zanjirni quvvat manbaidan ajratish shart.", "Qarshilikni o‘lchashdan oldin multimetrni tok o‘lchash rejimiga o‘tkazish.", "Qarshilikni o‘lchashdan oldin multimetrni doimiy kuchlanish rejimiga sozlash.", "Qarshilikni o‘lchashdan oldin zanjirdagi barcha boshqa komponentlarni olib tashlash."], ["LED zanjirida rezistorning asosiy ahamiyati nima va u LEDni qanday himoya qiladi?", "LEDdan o‘tuvchi tokni cheklash va uni shikastlanishdan, kuyishdan saqlash.", "LEDning rangini o‘zgartirish yoki uning yorqinligini oshirish vazifasini bajarish.", "LEDga yetkaziladigan kuchlanishni oshirish, uning ishlash samaradorligini yaxshilash.", "LEDning teskari yo‘nalishda ham tok o‘tkazishini ta’minlash uchun muhim komponent."], ["Breadboardning (maket taxtasi) asosiy vazifasi nima va u qanday foydalaniladi?", "Elektron komponentlarni lehimlamasdan vaqtincha sxemalar yig‘ish va sinovdan o‘tkazish.", "Elektron komponentlarni doimiy ravishda lehimlab, yakuniy mahsulot yaratish.", "Faqat yuqori chastotali signallarni uzatish uchun maxsus sxemalarni yig‘ish.", "Elektr zanjiridagi tok va kuchlanishni avtomatik ravishda o‘lchash."], ["Elektronika zanjirlarida rezistorning asosiy vazifasi qaysi funksiyani bajarishdan iborat?", "Elektr tokining intensivligini cheklash orqali uning oqimini tartibga soladi.", "Elektr energiyasini vaqtinchalik saqlash imkoniyatini ta'minlaydi doimiy.", "Elektr tokini faqat bir yo'nalishda o'tkazishni ta'minlovchi xususiyatga ega.", "Elektr signallarini kuchaytirish yoki kommutatsiya qilish vazifasini bajaradi."], ["Elektr zanjirlarida kondensatorning asosiy funksiyasi nimadan iborat va u qanday vazifani bajaradi?", "Elektr zaryadini o'zida to'plash va zarur bo'lganda uni zanjirga qaytarish.", "Zanjirdagi o'zgaruvchan tokni to'g'irlash orqali doimiy tokka aylantirish.", "Elektr tokining yo'nalishini nazorat qilish va bir tomonlama o'tishini ta'minlash.", "Elektr zanjirining umumiy qarshiligini pasaytirishga xizmat qiladi doimiy."], ["Elektr toki kuchini (A) multimetr bilan o‘lchashda, ushbu asbob elektr zanjiriga qanday ulanishi to‘g‘ri hisoblanadi?", "Multimetr o'lchanayotgan zanjir qismiga ketma-ket, zanjirni uzib ulanishi kerak.", "Multimetr o'lchanayotgan zanjir qismiga parallel ulanishi zarur va mustaqil.", "Multimetrni o'lchanadigan qismga faqat bir uchidan ulab, ikkinchisini bo'sh qoldirish.", "Multimetrni zanjirga to'g'ridan-to'g'ri, hech qanday ajratishlarsiz ulab qo'yish."], ["Multimetrning davomiylik (continuity) rejimida qanday turdagi natija aniqlanadi va u nimani bildiradi?", "U kontakt uchlari orasida qisqa tutashuv bor-yo'qligini signal orqali aniqlaydi.", "U zanjirdagi kuchlanishning maksimal qiymatini aniq raqamlar bilan ko'rsatadi.", "U elementning umumiy sig'imini o'lchashga yordam beruvchi aniq qiymatni beradi.", "U o'lchanayotgan komponentning induktivlik darajasini aniqlaydi doimiy."], ["Multimetr qanday universal asbob hisoblanadi va uning asosiy vazifalari qaysilardan iborat?", "Kuchlanish, tok, qarshilik, diod va davomiylikni
