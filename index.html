o'lchashga mo'ljallangan.", "Faqatgina kuchlanish va tokni o'lchash uchun ishlatiladigan ixtisoslashtirilgan asbob.", "Faqat qarshilik va induktivlikni o'lchash uchun mo'ljallangan yuqori aniqlikdagi qurilma.", "Elektron signallarning chastotasini va amplitudasini tekshiruvchi uskuna."], ["Agar multimetr tok o‘lchashda xato ko‘rsatsa va sababi sifatida \"Parallel ulangan\" ko'rsatilsa, qanday yechim qo'llanilishi kerak?", "Zanjirni uzib, multimetrni o'lchanadigan qismga ketma-ket ulash zarur.", "Multimetrning diapazonini (range) eng yuqori qiymatga sozlash kifoya qiladi.", "Tok o'lchash portini VOhm portiga o'zgartirish va o'lchovni takrorlash kerak.", "Elektr manbaining kuchlanishini oshirish orqali muammoni bartaraf etish."], ["Qisqa tutashuv (short circuit) nima va elektron zanjirlarda undan saqlanishning asosiy yo'li qaysi?", "Elektr tokining to'g'ridan-to'g'ri, juda past qarshilikli yo'l orqali oqishi; rezistorlar bilan tokni cheklash.", "Elektr zanjirida kuchlanishning birdaniga oshishi; haddan tashqari yuklamalarni nazorat qilish.", "Elektr tokining to'liq uzilishi va zanjirning ochiq qolishi; kalitlar yordamida zanjirni yopish.", "Elektr signallarining shovqinlar tufayli buzilishi; ekranlangan kabellardan foydalanish."], ["Elektron zanjirlarda rezistor komponentining asosiy vazifasi nima hisoblanadi?", "Elektr zanjiridan o‘tayotgan tok miqdorini belgilangan darajada cheklaydi.", "Elektr zanjirida elektr zaryadini to‘plab, kerakli paytda qayta uzatadi.", "Elektr tokining faqat bitta yo‘nalish bo‘ylab harakatlanishini ta’minlaydi.", "Elektr signallarining quvvatini sezilarli darajada kuchaytirib beradi."], ["Yarimo‘tkazgichli diodning elektr zanjiridagi eng asosiy xususiyati nimadan iborat?", "Elektr tokini faqat bitta yo‘nalishda to‘siqsiz o‘tkazish imkonini beradi.", "Elektr tokini ikkala yo‘nalishda ham bir xil qarshilik bilan o‘tkazadi.", "Elektr signallarini kuchaytirib, kirishdagi kuchlanishni barqarorlaydi.", "Elektr zaryadini uzoq vaqt saqlab, zanjirni uzluksiz quvvat bilan ta’minlaydi."], ["Integral mikrosxemalar (IC) elektron apparaturalarda qanday maqsadlarda qo‘llaniladi?", "Bitta korpus ichida murakkab elektron funksiyalarni to‘liq amalga oshiradi.", "Zanjirdagi umumiy qarshilikni teng taqsimlab, ortiqcha tokni cheklaydi.", "Faqatgina o‘zgaruvchan tokni doimiy tokka o‘zgartirib berish uchun xizmat qiladi.", "Barcha turdagi elektr signallarini faqat optik nurlanishga aylantirib beradi."], ["Multimetr yordamida elektr zanjiridagi kuchlanishni o‘lchashda asbob qanday ulanadi?", "O‘lchanayotgan zanjir qismiga yoki komponentga parallel ravishda ulanadi.", "O‘lchanayotgan zanjir tarmog‘ini uzib, unga ketma-ket ravishda ulanadi.", "Zanjirning faqat manfiy qutbiga bir vaqtning o‘zida ikkala prob bilan ulanadi.", "Zanjirning quvvat manbaiga mutlaqo ulanmasdan, faqat korpusga ulanadi."], ["Multimetr yordamida elektr tokini o‘lchash qaysi qoidaga binoan amalga oshiriladi?", "Elektr zanjiri uziladi va multimetr problari zanjirga ketma-ket ulanadi.", "Elektr zanjirini uzmasdan, multimetr problari komponentga parallel ulanadi.", "Multimetr problari to‘g‘ridan-to‘g‘ri quvvat manbaining ikki qutbiga ulanadi.", "Zanjirning umumiy quvvati o‘chirilib, manba zanjirdan butunlay ajratiladi."], ["Rezistorning elektr qarshiligini multimetrda o‘lchashdan oldin qanday amal bajariladi?", "Zanjir quvvat manbaidan ajratiladi va komponent zanjirdan uzib olinadi.", "Zanjirga maksimal ishchi kuchlanish beriladi va tok kuchi tekshirib ko‘riladi.", "Multimetr probi yuqori tok portiga o‘tkaziladi va signal rejimi yoqiladi.", "Komponentning musbat qutbi aniqlanib, doimiy o‘zgarmas tok manbaiga ulanadi."], ["Multimetrning davomiylik (signal) rejimi laboratoriyada asosan nima uchun ishlatiladi?", "Zanjirning butunligini tekshirish va qisqa tutashuvni tezda aniqlash uchun.", "Kondensatorning umumiy elektr sig‘imi qiymatini aniq hisoblab chiqish uchun.", "Manbadan kelayotgan o‘zgaruvchan kuchlanish amplitudasini o‘lchash uchun.", "Yorug‘lik tarqatuvchi diodlarning yorug‘lik to‘lqin uzunligini topish uchun."], ["Laboratoriya ishida LED zanjiriga rezistorni ketma-ket ulashdan asosiy maqsad nima?", "LEDdan o‘tuvchi tokni cheklash va uning kuyib ketishining oldini olish.", "LEDning optik samaradorligini va yorug‘lik tarqatish burchagini oshirish.", "Zanjirga berilayotgan umumiy elektr kuchlanishini ikki baravarga ko‘paytirish.", "Doimiy elektr tokini o‘zgaruvchan impulsli elektr tokiga aylantirib berish."], ["Agar U = 5 V, U_LED = 2 V va R = 330 Ohm bo‘lsa, zanjirdagi tok kuchi qanchaga teng bo‘ladi?", "I = (5 - 2) / 330 ~ 0.009 A (ya’ni taxminan 9 mA ga teng bo‘ladi).", "I = (5 + 2) / 330 ~ 0.021 A (ya’ni taxminan 21 mA ga teng bo‘ladi).", "I = 5 / (330 · 2) ~ 0.007 A (ya’ni taxminan 7 mA ga teng bo‘ladi).", "I = (5 - 2) · 330 ~ 990 A (ya’ni taxminan 990 mA ga teng bo‘ladi)."], ["Amaliy o‘lchash natijalarining nazariy hisob-kitoblardan farq qilishiga nima sabab bo‘ladi?", "Komponent tolerantligi, manba noaniqligi va multimetrning o‘lchash xatoligi.", "Breadboard yo‘llarining o‘ta yuqori induktivligi hamda tashqi magnit maydoni.", "Multimetr ichki batareyasining faqat o‘zgaruvchan tok rejimida ishlashi.", "Elektr zanjirida Ohm qonunining yarimo‘tkazgichlarga umuman qo‘llanmasligi."], ["Multimetrda doimiy kuchlanishni (DC) o‘lchash rejimi qaysi belgi bilan ifodalanadi?", "V= belgisi bilan ko‘rsatiladi va batareyalarda qo‘llaniladi.", "V~ belgisi bilan ko‘rsatiladi va o‘zgaruvchan tarmoqda o‘lchanadi.", "A/mA belgisi bilan ko‘rsatiladi va ketma-ket ulangan zanjirda o‘lchanadi.", "Ohm belgisi bilan ko‘rsatiladi va faqat uzilgan zanjirda tekshiriladi."], ["Multimetrda o‘zgaruvchan kuchlanishni (AC) o‘lchash rejimi qaysi belgi orqali ko‘rsatilgan?", "V~ belgisi bilan ko‘rsatiladi va tarmoqda ehtiyotkorlik talab etiladi.", "V= belgisi bilan ko‘rsatiladi va faqat doimiy manbalar tekshiriladi.", "Ohm belgisi bilan ko‘rsatiladi va qarshilik qiymatini ifodalaydi.", "Signal belgisi bilan ko‘rsatiladi va tutashuvlarni tekshirishda ishlatiladi."], ["O‘lchash jarayonida multimetr ekrani 0 qiymatini ko‘rsatsa, nosozlikning sababi nima bo‘lishi mumkin?", "Kontakt uzilgan bo‘lishi mumkin, jumper va yo‘llarni tekshirish kerak.", "Manba kuchlanishi belgilangan me’yordan haddan tashqari oshib ketgan.", "Rezistorning ichki qarshiligi nominal qiymatidan keskin kamayib ketgan.", "Multimetrning faqat ichki dasturiy ta’minoti noto‘g‘ri sozlangan bo‘ladi."], ["Yig‘ilgan zanjirda LED yonmasa, texnik yo‘riqnomaga muvofiq qanday chora ko‘riladi?", "LEDning qutblari to‘g‘riligi va rezistor ulanishi qayta tekshiriladi.", "Manba kuchlanishi zudlik bilan ikki barobar qiymatga ko‘tariladi.", "LED o‘rniga to‘g‘ridan-to‘g‘ri yuqori sig‘imli kondensator o‘rnatiladi.", "Zanjirga qo‘shimcha o‘zgaruvchan tok transformatori ulab yuboriladi."], ["Multimetrda tokni o‘lchashda xatolik yuzaga kelishining eng asosiy sababi nima hisoblanadi?", "Multimetr zanjirga ketma-ket ulanish o‘rniga parallel ulab qo‘yilgan.", "Multimetr zanjirga parallel ulanish o‘rniga ketma-ket ulab qo‘yilgan.", "Zanjirda cheklovchi rezistor sifatida faqat 330 Ohm qarshilik tanlangan.", "Manbaning musbat qutbi to‘g‘ridan-to‘g‘ri LEDning anodiga ulangan."], ["Bipolyar tranzistorlarning p-n o‘tishlarini laboratoriyada qaysi usulda tekshirish mumkin?", "Multimetrning maxsus diod test rejimi (diode mode) orqali tekshiriladi.", "Faqat multimetrning yuqori o‘zgaruvchan kuchlanish rejimida tekshiriladi.", "Faqat kondensatorning umumiy sig‘imini o‘lchash rejimida tekshiriladi.", "Multimetrning o‘n amperli yuqori tok portiga ulab bevosita tekshiriladi."], ["Elektron sxemalarda rezistor qanday asosiy vazifani bajarish uchun qo‘llaniladi?", "Zanjirdagi elektr tokini cheklash va kuchlanishni taqsimlash", "O‘zgaruvchan tok chastotasini oshirish va energiyani to‘plash", "Kirish signallarini to‘liq to‘g‘rilash va magnit maydon yaratish", "Zanjirda elektr quvvatini generatsiya qilish va kuchaytirish"], ["Om qonuniga ko‘ra rezistor qarshiligi (R) qaysi formula orqali aniqlanadi?", "R = U / I", "R = U · I", "R = I / U", "R = I · U"], ["Qarshiligini mexanik ravishda o‘zgartirish imkonini beruvchi rezistorlar turiga qaysilar kiradi?", "Potensiometr va reostat asbobi", "Termistor va fotorezistor vositasi", "Varistor va stabilitron moslamasi", "Tranzistor va tiristor elementi"], ["Atrof-muhit haroratining o‘zgarishiga sezgir bo‘lgan maxsus rezistor qanday nomlanadi?", "Termistor elementi", "Varistor elementi", "Dinistor elementi", "Reostat elementi"], ["Yorug‘lik oqimi ta’sirida o‘z elektr qarshiligini o‘zgartiradigan maxsus komponent qaysi?", "Fotorezistor", "Termorezistor", "Tenzoqarshilik", "Kvars rezonator"], ["To‘rt halqali rang kodi bilan belgilangan rezistorda uchinchi halqa nimani anglatadi?", "Dastlabki sonlarning ko‘paytirgichini", "Nominal qiymatning og‘ish darajasini", "Korpusning maksimal quvvat qiymatini", "Zanjirning ruxsat etilgan tok kuchini"], ["Rezistor parametrlaridagi tolerantlik tushunchasi nimani ifodalaydi?", "Haqiqiy qiymatning nominaldan og‘ishini", "Rezistorning eng yuqori ishchi haroratini", "Element orqali o‘tuvchi maksimal tok kuchini", "Zanjirga beriladigan maksimal kuchlanishni"], ["Jigarrang–qora–qizil–oltin rang halqalariga ega bo‘lgan rezistorning nominal qiymati qancha?", "1.0 kOhm ±5%", "10 kOhm ±5%", "100 Ohm ±5%", "2.2 kOhm ±5%"], ["Rezistor korpusidagi oltin rangli to‘rtinchi halqa qanday tolerantlik darajasini bildiradi?", "±5% xatolik", "±10% xatolik", "±1% xatolik", "±2% xatolik"], ["Rezistorning tolerantlik halqasi kumush rangda bo‘lsa, uning og‘ish foizi necha bo‘ladi?", "±10% xatolik", "±5% xatolik", "±20% xatolik", "±2% xatolik"], ["Ta’minot kuchlanishi 9 V, LED tushuvi 2 V va oqim 15 mA bo‘lganda qanday rezistor tanlanadi?", "470 Ohm nominal", "220 Ohm nominal", "100 Ohm nominal", "680 Ohm nominal"], ["Ta’minot 5 V, LED tushuvi 2 V va tok 10 mA bo‘lganda, standart qatordan qaysi rezistor olinadi?", "330 Ohm nominal", "220 Ohm nominal", "470 Ohm nominal", "150 Ohm nominal"], ["Kuchlanish bo‘luvchi sxemada R1 = 1 kOhm, R2 = 1 kOhm va kirish kuchlanishi 10 V bo‘lsa, chiqish qancha bo‘ladi?", "5 V ga teng", "2 V ga teng", "8 V ga teng", "0 V ga teng"], ["Mikrokontroller kirishlarida pull-up va pull-down rezistorlarining asosiy vazifasi nima?", "Kirishlarning suzuvchi holatini bartaraf etish", "Kirish portining ishlash chastotasini oshirish", "Tashqi xalaqit signallarining kuchini ko‘tarish", "Zanjirda quvvat sarfini ikki baravarga oshirish"], ["Rezistor qarshiligini multimetr yordamida o‘lchashda qaysi talabga qat’iy rioya qilinishi shart?", "Rezistor umumiy elektron sxemadan to‘liq ajratilishi shart", "Rezistor zanjiriga quvvat manbai yoqilgan holda qolishi shart", "O‘lchash multimetrning o‘zgaruvchan tok rejimida bo‘lishi shart", "Rezistor problariga parallel ravishda kondensator ulanishi shart"], ["Rezistor rang kodida qizil rang asosiy raqam sifatida qanday qiymatni bildiradi?", "2 raqamini", "3 raqamini", "1 raqamini", "4 raqamini"], ["Qizil–qizil–jigarrang–oltin rang halqalariga ega bo‘lgan rezistorning nominal qarshiligi qancha?", "220 Ohm ±5%", "120 Ohm ±5%", "330 Ohm ±5%", "470 Ohm ±5%"], ["Analog signal va raqamli signal o‘rtasidagi asosiy farqlardan biri qaysi xususiyatga asoslanadi?", "Analog signal uzluksiz qiymatlarni qabul qilsa, raqamli signal cheklangan butun sonlardan iborat bo‘ladi.", "Analog signal faqat raqamli signallardan farqli o‘laroq, doimo kuchlanish bilan o‘lchanadi.", "Raqamli signal uzluksiz bo‘ladi, lekin analog signal ma’lum bir oraliqda diskret qiymatlarga ega.", "Analog signal doimo kodlangan bo‘lib, raqamli signal hech qachon kodli qiymatlarni qabul qilmaydi."], ["Potensiometrning 1, 2 va 3-chi chiqishlari odatda qanday vazifalarni bajaradi va ular nimani ifodalaydi?", "1 va 3-chi chiqishlar rezistiv yo‘lning chetlariga ulangan, 2-chi esa harakatlanuvchi sirpangichga tegishli.", "1-chi chiqish doimo Vout, 2-chi chiqish Vs, 3-chi chiqish esa GND vazifasini bajaradigan holatlar.", "Faqat 1-chi chiqish +Vs ga, 2-chi chiqish GND ga, 3-chi chiqish esa doimo Voutga ulanishi shart.", "2-chi chiqish manba kuchlanishini bildiradi, qolgan ikkisi esa faqat raqamli kodlash uchun ishlatiladi."], ["Potensiometr kuchlanish bo‘luvchi sifatida ishlatilganda Vout qiymati qaysi formula orqali hisoblanadi?", "Vout = Vs · R12 / (R12 + R23) formulasi qo‘llanilib, Vout qiymati pastki qism qarshiligiga bog‘liq.", "Vout = Vs + (R12 · R23) formulasi qo‘llanilib, chiqish kuchlanishi umumiy qarshilikning yig‘indisiga teng.", "Vout = Vs / (R12 · R23) formulasi qo‘llanilib, u faqatgina yuqori qism qarshiligining nisbati bilan aniqlanadi.", "Vout = Vs - Rpot / (R12 + R23) formulasi qo‘llanilib, kuchlanish manba kuchlanishidan ayirmaga teng."], ["Chiziqli potensiometrda dasta holati k=0.75 va manba kuchlanishi Vs=5 V bo‘lsa, Vout qiymati qancha bo‘ladi?", "Vout = k · Vs formulasi bo‘yicha hisoblaganda Vout = 0.75 · 5 V = 3.75 V ga teng bo‘ladi.", "Vout = 5 V / 0.75 formulasi bo‘yicha hisoblaganda Vout taxminan 6.67 V ga teng bo‘ladi.", "Vout = 5 V + 0.75 V formulasi bo‘yicha hisoblaganda Vout taxminan 5.75 V ga teng bo‘ladi.", "Vout = 0.75 V – 5 V formulasi bo‘yicha hisoblaganda Vout manfiy qiymatga ega bo‘lishi kerak."], ["Arduino kodidagi `Serial.println(voltage, 3)` qatori qanday vazifani bajaradi?", "Bu qator serial monitorga hisoblangan kuchlanishni uchta kasr belgisi bilan chiqaradi.", "Bu qator faqatgina `voltage` o‘zgaruvchisining butun son qismini serial monitorga chiqaradi.", "Bu qator `voltage` o‘zgaruvchisini uch marta ketma-ket serial monitorga bosib chiqarishni ta’minlaydi.", "Bu qator `voltage` nomli yangi o‘zgaruvchi yaratadi va uning qiymatini 3 ga ko‘paytiradi."], ["Laboratoriya hisobotida xatolik manbalarini tahlil qilishda nimaga e’tibor berish muhim?", "Faqat xatoning mavjudligini qayd etish bilan cheklanmasdan, uning yo‘nalishi, taxminiy miqdori va ehtimoliy sababini ko‘rsatish.", "Xatolik manbalarini faqat umumiy tarzda sanab o‘tish, ularning tajribaga ta’sirini izohlashdan qochish kerak.", "Har qanday xatoning sababini aniqlash imkonsiz bo‘lgani uchun ularni hisobotga kiritmaslik tavsiya etiladi.", "Xatolik manbalarini tahlil qilishda faqatgina noto‘g‘ri ulanishlar bilan cheklanish va boshqa sabablarni e’tibordan chetda qoldirish."], ["Xavfsizlik qoidalariga ko‘ra, sxemani yig‘ish yoki o‘zgartirishdan oldin qanday muhim qadam bajarilishi kerak?", "Sxemani yig‘ish yoki o‘zgartirishdan oldin manba o‘chirilganligini ta’minlash shart.", "Manba yoqilgan holda, faqat kichik kuchlanishli qismlarni o‘zgartirishga ruxsat beriladi.", "Har doim manba yoqilgan bo‘lishi kerak, chunki bu komponentlarning to‘g‘ri ishlashini ta’minlaydi.", "Faqat manbani o‘chirishga ehtiyoj yo‘q, chunki kuchlanish yuqori bo‘lmasa xavfsizlik ta’minlanadi."], ["Qaysi turdagi potensiometr audio sezgirligiga mos qarshilik o‘zgarishini ta’minlaydi va qayerda qo‘llaniladi?", "Logarifmik (A) potensiometr audio sezgirligiga mos o‘zgaradi va ovoz balandligini rostlashda qo‘llaniladi.", "Chiziqli (B) potensiometr audio ilovalarida eng yaxshi natijani beradi va asboblar kalibrlash uchun ishlatiladi.", "Trimmer turi doimo audio sezgirligini nazorat qilish uchun ishlatiladi, u asosan kichik sozlamalarga mos.", "Ko‘p aylanishli potensiometr faqat ovoz balandligini rostlash uchun ishlatiladi, chunki u aniq sozlamalarni beradi."], ["Laboratoriya ishi uchun tavsiya etilgan potensiometrning xususiyatlari nimadan iborat?", "B10K, ya’ni 10 kOhm qarshilikka ega va chiziqli tavsifli potensiometr tavsiya etiladi.", "Logarifmik, 5 kOhm qarshilikka ega potensiometr tavsiya etiladi, chunki u audio dasturlar uchun qulaydir.", "Har qanday turdagi, lekin kamida 1 kOhm qarshilikka ega bo‘lgan potensiometrning ishlatilishi mumkin.", "Faqat ko‘p aylanishli va 100 kOhm dan yuqori qarshilikka ega potensiometrlar ayniqsa tavsiya qilingan."], ["Chiziqli potensiometrda k=0.75 va Vs=5 V bo‘lsa, Vout qancha bo‘ladi?", "Chiziqli potensiometr uchun Vout ~ k · Vs formulasi bo‘yicha hisoblanganda Vout ~ 0.75 · 5 V = 3.75 V.", "Berilgan qiymatlarga ko‘ra, Vout ~ 0.75 + 5 V = 5.75 V bo‘ladi, bu esa kuchlanish qiymatini oshiradi.", "Ushbu parametrlar bilan Vout ~ 5 V / 0.75 = 6.67 V ni tashkil qiladi, chunki bu kuchlanish bo‘luvchidir.", "Agar k=0.75 va Vs=5 V bo‘lsa, Vout taxminan 0.75 · 0.5 = 0.375 V ga teng bo‘ladi."], ["Potensiometrga tashqi kuchlanish berish haqidagi qaysi xavfsizlik qoidasiga amal qilish kerak?", "Ommetr rejimida potensiometrga tashqi kuchlanish bermaslik kerak, bu jihozga zarar yetkazishi mumkin.", "Potensiometrga tashqi kuchlanishni faqat voltmetr rejimida berish mumkin, bu uning qarshiligini o‘lchaydi.", "Har doim potensiometrga 5 V dan ortiq bo‘lmagan tashqi kuchlanish berish tavsiya etiladi, aks holda u yonishi mumkin.", "Tashqi kuchlanishni potensiometrga faqat 1 va 3-chi chiqishlar orqali berish kerak, bu uning ish rejimini saqlaydi."], ["Qaysi xatolik manbai uchun '5V pinini multimetr bilan o‘lchash' kamaytirish usuli tavsiya etiladi?", "Vref xatoligi (barcha ADC kuchlanishlarining siljishi) uchun 5V pinini multimetr bilan o‘lchash usuli tavsiya etiladi.", "Potensiometr toleransi (umumiy R nominaldan farq qiladi) uchun Rpot ni avval ommetr bilan o‘lchash kerak.", "Kontakt shovqini (Vout yoki ADC sakraydi) uchun dastani sekin aylantirish va kontaktni tekshirish muhim.", "Kvantlash xatosi (ADC eng yaqin kodga yaxlitlanadi) ±0.5 LSB ni hisobga olish orqali kamaytirilishi mumkin."], ["Vref=5.00 V bo‘lganda Arduino ADC ning bitta kodi taxminan qancha kuchlanishga teng bo‘ladi?", "q = Vref / 1023 formulasiga ko‘ra, bitta kod taxminan 5.00 V / 1023 ~ 4.89 mV ga teng bo‘ladi.", "Bitta kod har doim 5.00 V ni tashkil etadi, chunki bu Arduino kirishining maksimal kuchlanishidir.", "Bitta kod taxminan 1023 / 5.00 V ~ 204.6 mV ga teng, bu raqamli qiymatning o‘zgarishini bildiradi.", "Vref qiymatidan qat’iy nazar, bitta kod har doim 1 mV ga teng bo‘ladi, bu ADC ning standart qiymati."], ["Potensiometrning uchta chiqishi qanday vazifalarni bajaradi, ularning sxemadagi o'rnini inobatga olgan holda?", "1 va 3 chiqishlar rezistiv yo'lning chetlariga ulanadi, 2-chi chiqish esa harakatlanuvchi sirpangichga tegishli bo'lib, kuchlanishni taqsimlaydi.", "1 va 2 chiqishlar doimiy 5 V manbaga ulanadi, 3-chi chiqish esa raqamli signalni chiqarish uchun xizmat qiladi, bu uning asosiy funktsiyasi.", "Barcha uchta chiqish ham bir vaqtning o'zida GND ga ulanishi kerak, aks holda qurilma ishlamaydi va qisqa tutashuvga olib kelishi mumkin.", "Uchta chiqish ham faqat osiloskopga ulanadi, chunki ular faqat yuqori chastotali signallarni kuzatish uchun mo'ljallangan vazifani bajaradi."], ["Agar Vref=5 V va Arduino ADC dan olingan qiymat ADC=614 bo'lsa, Vout chiqish kuchlanishini qanday hisoblasa bo'ladi?", "Vout = 614 · 5.00 / 1023 ~ 3.001 V, bu ADC kodini voltga aylantirish formulasiga ko'ra hisoblanadi.", "Vout = 614 + 5.00 + 1023 ~ 1642.00 V, bu noto'g'ri yig'indi hisoblanib, real qiymatga mos kelmaydi.", "Vout = 1023 / (614 · 5.00) ~ 0.333 V, bu formula noto'g'ri teskari proporsional bog'liqlikka asoslangan hisoblashni ko'rsatadi.", "Vout = 5.00 - 614 / 1023 ~ 4.400 V, bu formula noto'g'ri farqni hisoblaydi va kuchlanishni to'g'ri aniqlamaydi."], ["Ushbu laboratoriya ishi uchun qaysi turdagi potensiometr tavsiya etiladi va uning xususiyati qanday?", "10 kOhm chiziqli (B turi) potensiometr tavsiya etiladi, uning qarshiligi dasta holatiga deyarli proporsionaldir.", "Logarifmik (A turi) potensiometr tavsiya etiladi, chunki u audio sezgirligiga mos ravishda o'zgaradi va ovoz boshqaruvida yaxshi ishlaydi.", "Trimmer potensiometr tavsiya etiladi, chunki u kichik sozlashlar va asboblarni kalibrlash uchun mo'ljallangan vazifani bajaradi.", "Ko'p aylanishli potensiometr tavsiya etiladi, chunki u aniq va sekin sozlash imkoniyatini beradi va o'lchov qurilmalarida qo'llaniladi."], ["Potensiometrlar qanday amaliy qo‘llanish misollariga ega, ularning kundalik hayotdagi va elektronika sohasidagi vazifalarini aks ettiradi?", "Ovoz balandligini rostlash, motor tezligi uchun buyruq berish, displey yorqinligini sozlash, sensor chegarasini belgilash uchun ishlatiladi.", "Faqat mikrokontroller ichki haroratini o'lchash va uni belgilangan qiymatlardan oshirmaslik uchun mo'ljallangan vazifani bajaradi.", "Faqat raqamli signallarni uzatish uchun ishlatiladi, analog signallarni boshqarish uchun umuman yaroqsiz bo'lib, ular uchun boshqa qurilmalar kerak.", "Faqat kuchlanish manbasining quvvatini oshirish uchun qo'llaniladi, bu esa sxemadagi boshqa komponentlarning ishlashini yaxshilashga xizmat qiladi."], ["Q = C·U formulasida Q, C va U kattaliklari nimani ifodalaydi va qanday birliklarga ega?", "Q – zaryad (Kulon), C – elektr sig'imi (Farad), U – plastinalar orasidagi kuchlanish (Volt).", "Q – quvvat (Vatt), C – o'tkazuvchanlik (Siemens), U – energiya (Joule) qiymatini bildiradi.", "Q – chastota (Gers), C – oqim kuchi (Amper), U – qarshilik (Om) kattaliklarini aks ettiradi.", "Q – vaqt (Sekund), C – issiqlik sig'imi (J/K), U – tezlik (m/s) tushunchalarini anglatadi."], ["Nima uchun t=tau vaqtida RC zanjirda zaryadlanayotgan kondensatorning kuchlanishi E qiymatining 0.632 qismiga teng bo'ladi?", "Bu Uc(t) = E[1 - e^(-t/RC)] formulasidan kelib chiqadigan tabiiy eksponensial o'sish holatidir.", "Bu vaqtda kondensatorning ichki qarshiligi maksimal darajaga yetganligi sababli yuzaga keladi.", "Faqat shu nuqtada zanjirdagi rezistor va kondensatorning kuchlanishlari tenglashadi.", "Bu kondensatorning maksimal zaryad hajmining 50% ga yetganini anglatadi."], ["Zaryadlangan kondensatorni xavfsiz razryadlashning eng to'g'ri va tavsiya etilgan usuli qaysi?", "Kondensatorni doim rezistor orqali razryadlash tavsiya etiladi, bu katta tok impulsining oldini oladi.", "Kondensatorni to'g'ridan-to'g'ri metall sim bilan qisqa tutashtirish eng tezkor va xavfsiz usuldir.", "Kondensatorni shunchaki tarmoqdan uzib qo'yish uning o'z-o'zidan to'liq razryadlanishini ta'minlaydi.", "Kondensatorni suvga solib, elektr zaryadini bevosita yo'q qilish eng samarali uslublardan biridir."], ["Kondensator sig'imining nisbiy xatoligini (deltaC) hisoblash formulasi qanday ifodalanadi?", "deltaC = DeltaC/Cnom · 100%, bu yerda DeltaC = |Co`lch – Cnom| (absolyut xatolik) dir.", "deltaC = Cnom/DeltaC · 100%, bu yerda DeltaC = Co`lch + Cnom (absolyut qiymat) dir.", "deltaC = DeltaC · Cnom / 100%, bu yerda DeltaC = Co`lch · Cnom (ko'paytma) dir.", "deltaC = (Co`lch – Cnom) / 100%, bu yerda Cnom nominal qiymatni bildiradi."], ["Kondensator razryadlanishining kuchlanish tenglamasini yozing va t=tau dagi qiymatini ko'rsating.", "Uc(t) = U0e^(-t/RC), t=tau da esa Uc(tau) = U0e^-1 = 0.368U0 bo'ladi.", "Uc(t) = E[1 - e^(-t/RC)], t=tau da esa Uc(tau) = E(1 - e^-1) = 0.632E bo'ladi.", "Uc(t) = U0/e^(-t/RC), t=tau da esa Uc(tau) = U0e = 2.718U0 bo'ladi.", "Uc(t) = U0·(t/RC), t=tau da esa Uc(tau) = U0 qiymatini oladi."], ["Elektrolit kondensatorni teskari ulash yoki uning nominal kuchlanishidan yuqori kuchlanish berish qanday xavf tug'diradi?", "Qizish, sizish va hatto portlash xavfini sezilarli darajada oshirib yuboradi.", "Faqat kondensatorning xizmat muddatini qisqartiradi, ammo jiddiy xavf yo'q.", "Zanjirdagi boshqa elementlarning ishdan chiqishiga olib keladi, ammo kondensatorga ta'sir qilmaydi.", "Elektr sarfini kamaytiradi va zanjirning samaradorligini oshirishga xizmat qiladi."], ["Paralel plastinkali kondensatorning sig'imini uning konstruktiv bog'lanishiga ko'ra qaysi omillar oshiradi?", "Plastina yuzi A ni oshirish va plastinalar orasidagi dielektrikning nisbiy singdiruvchanligi epsilonr ni oshirish.", "Plastinalar orasidagi masofa d ni oshirish va dielektrik materialini olib tashlash.", "Plastina yuzi A ni kamaytirish va dielektrikning nisbiy singdiruvchanligi epsilonr ni kamaytirish.", "Plastinalar sonini oshirish va ularning umumiy hajmini kamaytirish orqali."], ["Keramik kondensatorning asosiy xususiyatini va uning tipik qo'llanish sohasini ko'rsating.", "Kichik o'lchamli, tezkor, qutbsiz va yuqori chastotali sxemalarda, shovqinni kamaytirishda qo'llaniladi.", "Katta sig'imga ega, qutblangan va asosan filtrlash hamda sekin RC jarayonlarida qo'llaniladi.", "Barqaror xususiyatlarga ega, kam yo'qotishli va aniq vaqt zanjirlarida qo'llaniladi.", "Juda katta sig'imga ega, qutbsiz va qisqa muddatli energiya saqlash uchun mo'ljallangan."], ["Keramik kondensatorning uch xonali kodi '104' qaysi sig'im qiymatini bildiradi?", "'104' kodi 10 x 10^4 pF ga teng bo'lib, bu 100 nF sig'imni bildiradi.", "'104' kodi 10 x 10^3 pF ga teng bo'lib, bu 10 nF sig'imni bildiradi.", "'104' kodi 10 x 10^5 pF ga teng bo'lib, bu 1 µF sig'imni bildiradi.", "'104' kodi 104 pF ga teng bo'lib, bu 0.104 nF sig'imni bildiradi."], ["Kondensatorning razryadlanish jarayonida bir vaqt doimiysi (tau) o'tgandan so'ng, uning kuchlanishi boshlang'ich U0 qiymatining qanday foiziga tushadi?", "Boshlang'ich kuchlanish U0 ning 36.8% (Uc(tau) = 0.368U0) gacha pasayadi.", "Boshlang'ich kuchlanish U0 ning 63.2% (Uc(tau) = 0.632U0) gacha pasayadi.", "Boshlang'ich kuchlanish U0 ning 100% (Uc(tau) = U0) ni saqlab qoladi.", "Boshlang'ich kuchlanish U0 ning 0% (Uc(tau) = 0) gacha to'liq tushadi."], ["RC zanjirida kondensatorning zaryadlanish jarayonidagi kuchlanish o'zgarishi qaysi formula bilan ifodalanadi?", "U_c(t) = E[1 - e^(-t/RC)] formulasi bilan ifodalanadi, bu yerda E — manba kuchlanishi.", "U_c(t) = U0e^(-t/RC) formulasi bilan ifodalanadi, bu yerda U0 — boshlang'ich kuchlanish qiymati.", "U_c(t) = I0R·e^(-t/RC) formulasi bilan ifodalanadi, bu yerda I0 — boshlang'ich tok qiymati.", "U_c(t) = E·t/(RC) formulasi bilan ifodalanadi, bu yerda E — manbaning doimiy kuchlanishi."], ["Kondensatorning razryadlanish jarayonida vaqt doimiysi tau ga teng bo'lganda (t=tau) kondensator kuchlanishi boshlang'ich qiymatining qancha qismiga tushadi?", "Boshlang'ich U0 qiymatining 36,8% iga tushadi, ya'ni U_c = 0.368U0 bo'ladi.", "Boshlang'ich U0 qiymatining 63,2% iga tushadi, ya'ni U_c = 0.632U0 bo'ladi.", "Boshlang'ich U0 qiymatining 50,0% iga tushadi, ya'ni U_c = 0.500U0 bo'ladi.", "Boshlang'ich U0 qiymatining 100% iga tushadi, ya'ni U_c = U0 bo'ladi."], ["Turli kondensator turlarining asosiy xususiyatlari va ularning odatdagi qo'llanish sohalari qanday farqlanadi?", "Elektrolitlar katta sig'imli va qutblangan bo'lib, asosan filtrlash va sekin RC jarayonlarida ishlatiladi.", "Keramiklar yuqori chastotali signallarni kuchaytirishda va antennalarni sozlashda qo'llaniladi.", "Plyonkali kondensatorlar asosan yuqori quvvatli elektr motorlarida ishga tushirish uchun mo'ljallangan.", "Superkondensatorlar barqarorlikni ta'minlash maqsadida yuqori aniqlikdagi sensorlarda ishlatiladi."], ["Q = C·U formulasida harflar qanday fizik kattaliklarni anglatadi va ularning birliklari qanday?", "Q – zaryad (kulon), C – elektr sig'imi (farad), U – plastinalar orasidagi kuchlanish (volt).", "Q – quvvat (vatt), C – chastota (Gers), U – energiya (Joule) kabi kattaliklarni ifodalaydi.", "Q – tezlik (m/s), C – yorug'lik tezligi (m/s), U – bosim (Paskal) kabi kattaliklarni ifodalaydi.", "Q – tok kuchi (amper), C – quvvat koeffitsienti, U – umumiy qarshilik (ohm) kabi kattaliklarni ifodalaydi."], ["Elektrolit kondensatorlarning sig'im toleransi haqida qaysi ma'lumot to'g'ri hisoblanadi?", "Ular ko'pincha katta toleransga ega bo'lib, nominal qiymatdan sezilarli farq qilishi mumkin.", "Ular har doim nominal qiymatiga juda yaqin aniqlikda ishlab chiqariladi va toleranslari kichikdir.", "Ularning toleransi faqat yuqori haroratlarda ahamiyatli bo'ladi, normal sharoitda ahamiyatsizdir.", "Tolerans kondensatorning xizmat muddatini belgilaydi, sig'im qiymatiga ta'sir qilmaydi."], ["Osiloskop yordamida RC zanjiridagi kvadrat impulsli signalni kuzatishda, kondensator har yarim davrda deyarli to'liq zaryadlanishi yoki razryadlanishi uchun davr (T) qanday shartni qanoatlantirishi kerak?", "Signal davri T/2 >= 5tau shartini qanoatlantirishi kerak, bu to'liq jarayonni ta'minlaydi.", "Signal davri T/2 <= tau shartini qanoatlantirishi kerak, bu esa tez jarayonni ta'minlaydi.", "Signal davri T = RC shartini qanoatlantirishi kerak, bu jarayonni o'rtacha tezlikda bajaradi.", "Signal davri T = 1/f shartini qanoatlantirishi kerak, bu esa signalning chastotasini ifodalaydi."], ["Nima sababdan LEDni to‘g‘ridan-to‘g‘ri kuchlanish manbaiga tok cheklovchi rezistorsiz ulash mumkin emas?", "VAXning tik qismida kichik kuchlanish o‘zgarishi katta tok o‘zgarishiga olib kelishi sababli.", "LEDning faqat teskari rejimda ishlash uchun mo‘ljallanganligi va uning chidamliligi kamligi boisdan.", "Yorug‘lik chiqarish jarayoni uchun yuqori kuchlanish, ammo past tok talab qilingani uchun muhimdir.", "Manba kuchlanishi LEDning zona oralig‘iga doim mos kelmasligi sababli yuzaga keladigan holat."], ["Diodning ma’lumotlar varag‘ida (datasheet) ko‘rsatilgan V_RRM parametri nimani anglatadi?", "Takrorlanuvchi teskari cho‘qqi kuchlanishi, AC va impulsli sxemada xavfsizlik zaxirasini bildiradi.", "Berilgan to‘g‘ri tokdagi to‘g‘ri tushuv, yo‘qotish va issiqlik hisobi uchun muhim ko‘rsatkichdir.", "O‘rtacha to‘g‘ri tok, uzluksiz yuk toki hisoboti uchun ishlatiladigan asosiy parametr hisoblanadi.", "Teskari sizish toki, aniq va yuqori haroratli sxemalarda komponentning barqarorligini ko‘rsatadi."], ["Multimetrning diod-test rejimida sog‘lom LEDni ulaganimizda qanday ko‘rsatkichlarni kutishimiz kerak?", "1.6-3.3 V oralig‘idagi kuchlanish qiymatini ko‘rsatadi va xira yonishni kuzatish mumkin bo‘ladi.", "0.55-0.75 V oralig‘idagi kuchlanishni bir yo‘nalishda, OLni teskari yo‘nalishda ko‘rsatadi har doim.", "Ikkala yo‘nalishda ham 'OL' (Overload) ko‘rsatkichini beradi, chunki bu LEDning standart holatidir.", "0 V ga yaqin qiymatni ikki yo‘nalishda ko‘rsatadi, bu LEDning qisqa tutashganini bildiruvchi natijadir."], ["LEDni ulash uchun tok cheklovchi rezistor qiymatini hisoblashda qaysi formula qo‘llaniladi?", "R_S = (U_S – U_F) / I_F, bu yerda U_S manba, U_F LED tushuvi va I_F tanlangan tokdir.", "R_S = U_S / I_F, bu yerda LEDning ichki qarshiligi e’tiborga olinmaydi, bu esa noto‘g‘ri hisobga olib keladi.", "R_S = (U_F – U_S) / I_F, bu formula teskari yo‘nalishda hisoblash uchun ishlatiladi, ammo tok musbat.", "R_S = U_F · I_F, bu formula LEDdagi quvvatni hisoblash uchun mo‘ljallangan, qarshilik uchun emas."], ["Diod va LEDlar bilan ishlashda laboratoriya jarayonining to‘g‘ri ketma-ketligi qaysi javobda keltirilgan?", "Manba o‘chiq holatda komponentni tanlash, sxemani yig‘ish, tok limitini sozlash va manbani yoqish.", "Manbani yoqish, tok limitini sozlash, sxemani yig‘ish, so‘ngra komponentni tanlash va tekshirish.", "Komponentni tekshirgandan so‘ng manbani yoqish, sxemani yig‘ish, tokni hisoblash, limitni sozlash.", "Tok limitini sozlash, sxemani yig‘ish, komponentni tanlash, kuchlanishni o‘lchash, manbani yoqish."], ["LEDda foton energiyasi (E_ph) va yarimo‘tkazgich zona oralig‘i (E_g) orasidagi bog‘liqlik qaysi formulalar bilan ifodalanadi?", "E_ph = h·c/lambda va E_g(eV) ~ 1240 / lambda(nm), bu yerda lambda to‘lqin uzunligi va h Plank doimiysi.", "I_D = I_S [ exp(U_D / nV_T) – 1 ], bu diodning volt-amper xarakteristikasini tavsiflovchi Shockley tenglamasidir.", "U_b = (kT/q) • In(N_A N_D / n_i^2), bu PN-o‘tishdagi kontakt potensialining ideal ifodasi hisoblanadi.", "R_S = (U_S – U_F) / I_F, bu LEDni tok cheklovchi rezistor bilan ulash uchun qarshilikni hisoblash formulasidir."], ["Nima uchun bir nechta LEDni bitta umumiy tok cheklovchi rezistor orqali parallel ulash xavfli hisoblanadi?", "LEDlarning U_F qiymatlari har xil bo‘lganligi sababli, bir tarmoq ko‘proq tok olib, haddan tashqari qizishi mumkin.", "Parallel ulangan LEDlar sxemani haddan tashqari tez tezlikda o‘chirib qo‘yadi va hech qanday tok o‘tkazmaydi.", "Bitta rezistor harorat o‘zgarishlariga sezgir bo‘lib, LEDlarning yorqinligini barqaror saqlab turmaydi.", "Bunday sxemada har bir LEDga teng kuchlanish taqsimlanadi, bu esa ularning umrini sezilarli darajada uzaytiradi."], ["Diod VAXini olish tajribasida diod orqali o‘tadigan tok I_D ni qanday hisoblash tavsiya etiladi?", "Tok I_D ni rezistor kuchlanishi U_R va rezistorning haqiqiy qiymati R_o‘lch orqali I_D=U_R/R_o‘lch formulasi bilan hisoblanadi.", "Tok I_D ni to‘g‘ridan-to‘g‘ri manba kuchlanishi U_S va diod kuchlanishi U_D ni ayirish orqali hisoblash tavsiya etiladi.", "Tok I_D ni faqat ampermetrni diodga parallel ulash orqali to‘g‘ridan-to‘g‘ri o‘lchash zarur, bu eng aniq usuldir.", "Tok I_D ni diodning teskari to‘yinish toki I_S va harorat V_T asosida Shockley tenglamasidan foydalanib hisoblash."], ["LED yorqinligini baholash subyektiv bo‘lmasligi uchun qanday asboblar yordamida aniq taqqoslash mumkin?", "Yorqinlikni aniq optik taqqoslash uchun fotodiod, lyuksmetr yoki bir xil kamera sozlamasi ishlatilishi mumkin.", "Faqat oddiy multimetr yordamida LEDdagi tushuv kuchlanish U_F ni o‘lchash, bu ob'yektiv baho beradi.", "Har bir LED orqali o‘tadigan tok I_F ni ampermetr bilan o‘lchash, bu yorqinlikni to‘g‘ridan-to‘g‘ri aniqlaydi.", "Inson ko‘zining sezgirligiga tayanib, yorqinlikni 1 dan 5 gacha nisbiy shkalada baholash eng ob'yektiv usuldir."], ["PN-o‘tishdagi qashshoqlanish sohasi qanday hosil bo‘ladi?", "N-elektronlar P-sohaga, P-kovaklar N-sohaga diffuziyalanib, rekombinatsiya natijasida ionlar hosil qiladi.", "Elektr maydoni kuchayib, tashuvchilarni bir tomonga majburlashi sababli tezda shakllanadi.", "Tashuvchilarning tasodifiy harakati tufayli faqat elektronlar to'planishi orqali yuzaga keladi.", "Termal energiya ta'sirida erkin tashuvchilarning butunlay yo'q bo'lishi natijasida paydo bo'ladi."], ["Diodning anod va katodini sxematik belgi hamda korpus bo‘yicha qanday aniqlash mumkin?", "Sxematik belgida chiziq katodni, korpusdagi tasma esa katod tomonini bildiradi; anod qarama-qarshi tomon.", "Sxematik belgida uchburchak katodni, korpusdagi rangli halqa esa anod tomonini ko'rsatadi.", "Sxematik belgida to‘g‘ri chiziq anodni, korpusdagi qora nuqta esa katod tarafini ifodalaydi.", "Sxematik belgida uchburchak anodni, korpusdagi uzun pin esa katod tomonini aniqlaydi."], ["To'g'ri va teskari ulanishda qashshoqlanish sohasi hamda tok qanday o‘zgaradi?", "To‘g‘ri ulanishda qashshoqlanish sohasi torayadi va diffuziya toki tez ortadi; teskarisida kengayib, sizish toki oqadi.", "To‘g‘ri ulanishda qashshoqlanish sohasi kengayib, sizish toki kamayadi; teskarisida torayib, diffuziya toki pasayadi.", "To‘g‘ri ulanishda qashshoqlanish sohasi o'zgarmaydi, faqat tok yo'nalishi teskari bo'ladi; teskarisida kattalashadi.", "To‘g‘ri ulanishda qashshoqlanish sohasi kengayadi va tok ko'payadi; teskarisida torayadi va tok kamayadi."], ["5 V manba, U_F=2.0 V va I_F=10 mA uchun rezistorni hisoblang va standart qiymat tanlang.", "R_S = 300 Ohm, va eng yaqin standart qiymat 330 Ohm deb tanlanadi, bu xavfsizroq ishlashni ta'minlaydi.", "R_S = 200 Ohm, va eng yaqin standart qiymat 220 Ohm bo‘ladi, bu esa tokni yanada samarali cheklaydi.", "R_S = 500 Ohm, va eng yaqin standart qiymat 470 Ohm bo‘ladi, bu diodning maksimal quvvatini oshiradi.", "R_S = 250 Ohm, va eng yaqin standart qiymat 270 Ohm bo‘ladi, bu LED yorqinligini eng yuqori darajada saqlaydi."], ["Harorat oshishi diodning U_F va teskari sizish tokiga qanday ta'sir qiladi?", "Harorat oshishi bilan diodning to‘g‘ri tushuv kuchlanishi U_F kamayadi, teskari sizish toki esa sezilarli darajada ortadi.", "Harorat oshishi diodning to‘g‘ri tushuv kuchlanishi U_F ni oshiradi, teskari sizish toki esa teskarisiga kamayadi.", "Haroratning o‘zgarishi diodning to‘g‘ri tushuv kuchlanishi U_F va teskari sizish tokiga hech qanday ta'sir ko'rsatmaydi.", "Harorat oshishi diodning to‘g‘ri tushuv kuchlanishi U_F ni o‘zgarmas qoldiradi, teskari sizish toki esa dastlab kamayib, keyin ortadi."], ["Yarimo'tkazgich fizikasi bo'yicha taqiqlangan zona (E_g) nima uchun muhim?", "Taqiqlangan zona (E_g) materialning elektr va optik xossalarini belgilaydi, o‘tkazuvchanlikni aniqlaydi.", "Taqiqlangan zona (E_g) faqat materialning mexanik mustahkamligini ifodalaydi, elektr xossalariga ta'sir qilmaydi.", "Taqiqlangan zona (E_g) atom massasini belgilovchi asosiy parametr bo‘lib, optik xossalarga befarq.", "Taqiqlangan zona (E_g) materialning faqat termal kengayish koeffitsiyentini ko'rsatadi, boshqa xossalarga aloqasiz."], ["Oq LEDlar qanday texnologiya asosida yorug'lik chiqaradi?", "Oq LEDlar ko‘k GaN/InGaN kristalli chipi va sariq nurlanish chiqaruvchi fosfor qatlami kombinatsiyasi orqali oq yorug'lik hosil qiladi.", "Oq LEDlar maxsus kremniy diodlardan foydalanib, to'g'ridan-to'g'ri oq rangdagi fotonlarni chiqaradi, hech qanday fosfor qatlami ishlatilmaydi.", "Oq LEDlar qizil, yashil va ko'k rangli mikro-LEDlarning parallel massividan iborat bo'lib, har bir rang alohida boshqariladi.", "Oq LEDlar faqat infraqizil nurlanishni ultrabinafsha nurga aylantiruvchi qoplama yordamida oq yorug'lik chiqaradi, fosforlarsiz."], ["O'lchash noaniqligi uchun \"u_I/I\" nisbiy noaniqlik qanday formula bilan baholanadi?", "u_I/I ~ sqrt[(u_U/U_R)^2 + (u_R/R)^2], bu yerda u_U/U_R va u_R/R mos ravishda kuchlanish va qarshilikning nisbiy noaniqliklaridir.", "u_I/I = (u_U/U_R) + (u_R/R), bu yerda noaniqliklar oddiygina yig'indisi olinadi, ildiz osti belgisi ishlatilmaydi.", "u_I/I = sqrt[(u_U/U_R) * (u_R/R)], bu yerda kuchlanish va qarshilikning nisbiy noaniqliklari ko'paytiriladi.", "u_I/I = |(u_U/U_R) - (u_R/R)|, bu yerda kuchlanish va qarshilikning nisbiy noaniqliklari o'rtasidagi farq hisoblanadi."], ["Additiv ranglar modeliga ko‘ra, qizil (R) va yashil (G) nurlanishlar aralashmasi qanday rangni hosil qiladi?", "Sariq rangni hosil qiladi, bu ikkita asosiy rangning yorug'lik qo'shilishidir.", "Magenta rangini yaratadi, chunki yorug'lik spektrlari o'zaro to'qnashadi.", "Cyan rangiga olib keladi, bu yorug'likning to'lqin uzunliklari farqi tufayli.", "Oq rangni hosil qiladi, agar uchta asosiy rangning intensivligi teng bo'lsa."], ["RGB LED kanalidagi tokni cheklovchi rezistorni hisoblash uchun qaysi formuladan foydalaniladi?", "R_k = (U_S - U_F,k) / I_F,k formulasidan foydalanib, rezistor qiymati aniqlanadi.", "R_k = U_S / I_F,k formulasi yordamida, tizim kuchlanishi bilan hisoblanadi.", "R_k = U_F,k · I_F,k formulasini qo'llab, kuchlanishning to'g'ri qiymati aniqlanadi.", "R_k = U_S + U_F,k formulasi bo'yicha, bu kuchlanishlarni to'g'ri o'zgartiradi."], ["Arduino platformasida analogWrite(128) buyrug'i taxminan necha foiz duty cyclega ega bo'ladi?", "8-bit PWM uchun 128/255 ~ 50% duty cycle beradi, bu maksimal yorqinlikning yarmiga teng.", "8-bit PWM uchun 128/1023 ~ 12.5% duty cycle beradi, chunki analogRead qiymatlari 1023 gacha.", "analogWrite(128) common anode tizimida 255-128=127 qiymatiga teng, shuning uchun 50% dan kamroq bo'ladi.", "analogWrite(128) to'g'ridan-to'g'ri kuchlanish qiymatini anglatadi, shuning uchun duty cycle tushunchasi qo'llanilmaydi."], ["Common anode ulanishga ega RGB LEDni boshqarishda PWM qiymati nima sababdan 255-x ko‘rinishida olinadi?", "Common anode ulanishda pin LOW holatga tushirilganda tok yoqiladi, bu esa yorqinlikni inversiya qilishni talab qiladi.", "Common anode ulanishda pin HIGH holatga tushirilganda tok yoqiladi, bu dasturiy ta'minotni soddalashtirishga yordam beradi.", "Bu inversiya common anode tizimlarida kuchlanishning chiziqli bo'lmagan javobini tuzatish uchun kerak bo'ladi.", "255-x mantiqiy inversiya Arduino Uno mikrokontrollerining ichki arxitekturasi bilan bog'liq xususiyatdir."], ["Gamma tuzatish RGB LED yorqinligini boshqarishda nima sababdan muhim hisoblanadi?", "Inson ko‘zining yorqinlik sezgisi chiziqli emasligi va LEDning optik javobi chiziqli emasligi sababli.", "PWM signallarining chastotasini optimallashtirish va miltillash effektini kamaytirish maqsadida.", "Turli xil ranglar aralashmasida tokning oqimini bir xil darajada saqlash uchun qulay usul.", "RGB LEDning ichki qarshiligini muvozanatlash va energiyani tejash uchun zaruriy hisoblanadi."], ["Common cathode ulanish sxemasida R, G, B anodlari Arduino Uno ning qaysi pinlariga ulanadi?", "R anod 9~, G anod 10~, B anod 11~ pinlariga ulanadi.", "R anod 3~, G anod 5~, B anod 6~ pinlariga ulanadi.", "R anod A0, G anod A1, B anod A2 analog pinlariga ulanadi.", "R anod 0, G anod 1, B anod 2 raqamli pinlariga ulanadi."], ["Ushbu laboratoriya ishining asosiy maqsadi nima?", "Additiv ranglar modelini, RGB LED elektr sxemasini va dasturiy boshqaruvni tajribada o‘rganishdan iborat.", "Mikrokontrollerlar orqali murakkab signal protokollarini tahlil qilish va ularning samaradorligini optimallashtirish.", "Turli yarimo'tkazgich materiallarining fizik xususiyatlarini o‘rganish va ularning elektron qurilmalardagi rolini tushunish.", "PWM signallarini generatsiya qilishning nazariy asoslarini chuqur o'zlashtirish va analog konvertatsiyani amalga oshirish."], ["PWM (Impuls Kengligi Modulyatsiyasi) RGB LED sxemalarida asosan nimani boshqarish uchun ishlatiladi?", "LEDning o‘rtacha yorqinligini boshqaradi, signalning yoqilgan vaqtini (duty cycle) o‘zgartirish orqali amalga oshiriladi.", "LEDning rang spektrini bevosita o‘zgartirish va nurlanish to‘lqin uzunligini nazorat qilish uchun mo'ljallangan.", "LEDning ichki qarshiligini dinamik ravishda moslashtirish va umumiy quvvat sarfini minimal darajaga tushirish uchun xizmat qiladi.", "LEDning to‘g‘ri kuchlanish tushumini (U_F) avtomatik ravishda aniqlash va uning ish rejimini optimal holatga keltirish."], ["RGB LED yorug‘ligini boshqarishda gamma tuzatish (gamma correction) qo‘llashning asosiy sababi nimada?", "Inson ko‘zining yorqinlikni chiziqli emasligini va LEDning optik javobini kompensatsiya qilib, silliq o‘tishlar yaratish uchun.", "LEDning maksimal quvvat sarfini kamaytirish va uning ishlash muddatini sezilarli darajada uzaytirish maqsadida qo‘llaniladi.", "Ranglarning additiv aralashmasini to‘liq spektrda aniqroq aks ettirish va haroratga bog‘liq bo‘lmagan barqarorlikni ta'minlash.", "PWM signalining chastotasini sozlash va shu orqali LEDning miltillash effektini inson ko‘zi uchun mutlaqo sezilmaydigan qilish."], ["Arduino platformasida analogWrite() buyrug‘i RGB LEDlarni boshqarishda qanday funksiyani bajaradi?", "PWM signalini hosil qilib, LED kanalining o‘rtacha yorqinligini boshqaradi, chunki Arduino analog chiqish bermaydi.", "LED kanaliga to‘g‘ridan-to‘g‘ri analog kuchlanish chiqishini ta'minlaydi, bu esa yorug'lik intensivligini uzluksiz o‘zgartiradi.", "LED kanaliga raqamli yuqori (HIGH) yoki past (LOW) signal jo'natib, LEDni faqat yoqish yoki o‘chirish funksiyasini bajaradi.", "LED kanalining joriy haroratini o‘lchaydi va ortiqcha qizib ketish holatida avtomatik ravishda himoya mexanizmini ishga tushiradi."], ["Multimetrning diod test rejimidan foydalanib common cathode va common anode RGB LED turlarini qanday farqlash mumkin?", "Qora prob umumiy pinda bo‘lsa ranglar yonib chiqsa common cathode, qizil prob umumiy pinda bo‘lsa ranglar yonib chiqsa common anode bo‘lishi mumkin.", "Umumiy pinning kuchlanishini o‘lchash orqali; common cathode uchun 0 V, common anode uchun 5 V bo‘lsa farqlanadi.", "LEDni to‘g‘ridan-to‘g‘ri 5V quvvat manbaiga ulash orqali; common cathode qora rangda, common anode esa qizil rangda porlaydi.", "Har bir pinning qarshiligini o‘lchash orqali; common cathode da yuqori qarshilik, common anode da past qarshilik ko‘rsatadi."], ["RGB LEDning fundamental fizik tuzilishi qanday?", "Bitta optik korpus ichida uchta yarimo‘tkazgich kristalini birlashtiradi, ularning har biri o‘z PN-o‘tishiga ega.", "Uchta alohida rangli LEDni parallel ulangan rezistorlar bilan umumiy pinda joylashtirilgan holda ifodalaydi, shu bilan birga kompakt dizaynni ta'minlaydi.", "Bir nechta fotodiodlar va rang filtrlarini o‘z ichiga olgan murakkab optik tizim bo‘lib, tashqi yorug'likni sezish va uni ranglarga ajratish uchun mo'ljallangan.", "Asosiy ranglarni hosil qilish uchun lazer diodlaridan foydalanadigan va ularni maxsus optik tolalar orqali bitta chiqish nuqtasiga yo‘naltiradigan integratsiyalashgan qurilmadir."], ["PWM signalining duty cycle (D) qiymatini aniqlash uchun qaysi formula to‘g‘ri hisoblanadi?", "D = t_ON/T · 100%, bu yerda t_ON – signal yoqilgan vaqt, T – signal davri.", "D = U_avg / U_S · 255, bu yerda U_avg – o‘rtacha kuchlanish, U_S – manba kuchlanishi.", "D = I_avg / I_ON · 1000, bu yerda I_avg – o‘rtacha tok, I_ON – maksimal tok.", "D = (t_ON - T) / t_ON · 100%, bu yerda t_ON – yoqilgan vaqt, T – davr."], ["Katta quvvatli RGB LEDlar yoki LED lentalarini mikrokontroller orqali boshqarishning eng tavsiya etilgan usuli qanday?", "N-kanalli MOSFETlar yordamida, umumiy tuproq (GND) va alohida quvvat manbai orqali boshqarish zarur.", "Arduino pinlaridan to‘g‘ridan-to‘g‘ri ulab, ularning maksimal tok chegaralarida ishlashiga ruxsat berish, oddiy sxema uchun.", "Har bir kanalga juda past qiymatli rezistorlarni ulash orqali, bu tokni sezilarli darajada oshiradi va yorqinlikni oshiradi.", "Mikrokontrollerning o‘zida integratsiyalashgan ichki tok kuchaytirgichlardan foydalanish, bu qo‘shimcha komponentlarga ehtiyojni yo‘qotadi."], ["Additiv ranglar modelida qaysi asosiy ranglar aralashmasi magenta (binafsha) rangini hosil qiladi?", "Qizil (R) va ko‘k (B) rangli nurlarning aralashmasi natijasida magenta rangi hosil bo‘ladi.", "Yashil (G) va ko‘k (B) rangli nurlarning aralashmasi natijasida cyan (moviy-yashil) rangi hosil bo‘ladi.", "Qizil (R) va yashil (G) rangli nurlarning aralashmasi natijasida sariq rang hosil bo‘ladi.", "Uchta asosiy rang – qizil, yashil va ko‘k – teng miqdorda aralashganda oq rang hosil bo‘ladi."], ["RGB ranglari odatda o‘n oltilik (HEX) formatda qanday ko‘rinishda ifodalanadi?", "#RRGGBB ko‘rinishida, bu yerda RR, GG va BB har biri 00 dan FF gacha bo‘lgan o‘n oltilik qiymatlardir.", "(R, G, B) ko‘rinishida, bu yerda R, G va B har biri 0 dan 255 gacha bo‘lgan o‘nlik qiymatlardir.", "CMYK (Cyan, Magenta, Yellow, Key) ko‘rinishida, bu yerda har bir harf rangning foizli ulushini bildiradi.", "HSV (Hue, Saturation, Value) ko‘rinishida, bu yerda rang tus, to‘yinganlik va qiymatni alohida belgilaydi."], ["NPN tranzistorining cut-off rejimida kollektor toki (I_C) va baza-emitter kuchlanishi (V_BE) qanday holatda bo‘ladi?", "Cut-off rejimida kollektor toki deyarli nolga teng (I_C~0) va baza-emitter o‘tishi ochilmagan.", "Cut-off rejimida kollektor toki maksimal qiymatga ega (I_C max) va baza-emitter o‘tishi to‘g‘ri qutblangan.", "Cut-off rejimida kollektor toki beta·I_B ga teng va baza-emitter o‘tishi teskari qutblangan holda ishlaydi.", "Cut-off rejimida baza toki kuchli, lekin kollektor toki yuklama orqali chegaralangan holatda bo‘ladi."], ["Impuls kengligi modulyatsiyasi (PWM) yordamida yukning o‘rtacha quvvati qanday boshqariladi?", "Tranzistorni tez ON va OFF holatlarga o‘tkazish orqali duty cycle oshirilsa, yukning o'rtacha quvvati ortadi.", "PWM faqat yukning faollik vaqtini kamaytirish uchun ishlatiladi, quvvat o‘zgarmas qoladi mutlaqo.", "PWM impulsining chastotasini o‘zgartirish orqali yuklamadagi kuchlanish darajasi nazorat qilinadi doim.", "PWM sxemada doimiy tokni o‘zgaruvchan tokka aylantiradi va yukning qarshiligini pasaytiradi."], ["Tranzistorda issiqlikka aylanuvchi elektr quvvati (P_Q) qanday formula bilan ifodalanadi va uning ta’siri nima?", "P_Q = V_CE · I_C; yuk toki oshganda P_Q ortadi va kristall harorati ko‘tariladi.", "P_Q = I_B · V_BE; bu formula tranzistorning kuchaytirish koeffitsientini belgilaydi.", "P_Q = R_B · I_B^2; bu baza rezistoridagi quvvat yo‘qotilishini ifodalaydi asosan.", "P_Q = V_CC · I_C; bu yuklamaga uzatiladigan umumiy quvvatni ko‘rsatadi butunlay."], ["Laboratoriya ishining tahlil qismida V_CE qiymatining saturatsiyaga mos kelishi nimani anglatadi?", "Tranzistor to‘liq ON holatiga o‘tganligini va kollektor-emitter o‘tishida minimal kuchlanish tushuvi borligini.", "Tranzistor cut-off holatida qolganligini va kollektor toki yetarli emasligini bildiradi aniq.", "Tranzistor aktiv rejimda kuchaytirgich sifatida ishlayotganligini va V_CE o‘rtacha qiymatga ega ekanligini.", "V_CE qiymatining saturatsiyaga mos kelishi tranzistordan o‘tayotgan tokning juda kichikligini anglatadi."], ["LED yonmayotgan bo‘lsa, ehtimoliy sabablar va tekshiruv usullaridan biri nima?", "E/C almashgan yoki baza toki yo‘q; pinoutni va V_BE kuchlanishini tekshirish lozim bo‘ladi.", "I_B kam yoki R_LED katta; I_B, V_CE va R_LED qiymatlarini qayta hisoblash kerak.", "Yuk manbani cho‘ktiradi; alohida manbadan foydalanish tavsiya etiladi har doim tezkorlik bilan.", "Diod yo‘q yoki teskari ulangan; flyback diodni to‘g‘ri ulanganligini ko‘rib chiqish muhimdir."], ["Tranzistor toklariga Kirxgof qonunini ifodalovchi formula qaysi?", "I_E = I_C + I_B (Emitter toki kollektor va baza toklarining yig‘indisiga tengdir).", "I_C = I_E + I_B (Kollektor toki emitter va baza toklarining yig‘indisiga tengdir).", "I_B = I_E + I_C (Baza toki emitter va kollektor toklarining yig‘indisiga tengdir).", "I_E = I_C - I_B (Emitter toki kollektor va baza toklarining ayirmasiga tengdir)."], ["Agar V_PIN = 5 V, V_BE = 0.7 V va talab qilinadigan I_B = 10 mA bo‘lsa, baza rezistori R_B qanday hisoblanadi?", "R_B = (5 V – 0.7 V) / 0.010 A = 430 Ohm (Formula: R_B = (V_PIN – V_BE) / I_B).", "R_B = (5 V + 0.7 V) / 0.010 A = 570 Ohm (Bu yerda kuchlanishlar yig‘indisi tokka bo‘lingan).", "R_B = (5 V – 0.7 V) · 0.010 A = 0.043 Ohm (Bu yerda kuchlanishlar ayirmasi tokka ko‘paytirilgan).", "R_B = 0.010 A / (5 V – 0.7 V) = 0.0023 Ohm (Bu yerda tok kuchlanishlar ayirmasiga bo‘lingan)."], ["Quyidagilardan qaysi biri tranzistorning haddan tashqari qizishiga olib kelishi mumkin bo‘lgan sabab hisoblanadi?", "Baza toki yetarli darajada kam bo‘lishi va saturatsiya rejimiga o‘ta olmasligi (V_CE katta bo‘ladi).", "Kollektor toki nominal qiymatdan ancha past bo‘lishi va quvvat yo‘qotishining kamayishi.", "Tranzistorning cut-off rejimida uzoq vaqt ishlashi va yuklamaning o‘chiq holatda turishi.", "Baza rezistorining qiymati juda katta bo‘lib, baza tokini minimal darajada ushlab turishi."], ["Arduino pinining maksimal xavfsiz tok chegarasi (ATmega328P uchun) odatda qancha milliampere (mA) deb tavsiya etiladi?", "20 mA yoki undan past (Amaliy sxemalar uchun tavsiya etilgan xavfsiz chegarasi hisoblanadi).", "40 mA (Bu mutlaq maksimal chegaradir, lekin doimiy ish uchun tavsiya etilmaydi).", "10 mA dan past (Katta yuklamalarni boshqarish uchun odatda umuman yetarli emas).", "100 mA (Arduino pini bunday katta tokni xavfsiz yetkazib bera olmaydi, shikastlanadi)."], ["Flyback diodi induktiv yuklamaga nisbatan qanday qutbda ulanadi?", "Yuklamaga teskari parallel qutbda (tranzistor yopilganda tok uchun aylanma yo‘l yaratadi).", "Yuklamaga to‘g‘ri parallel qutbda (bu holatda diod doimiy tokni cheklab turadi).", "Yuklama bilan ketma-ket qutbda (induktiv oqimni butunlay bloklaydi va sxemani o‘chiradi).", "Tranzistorning bazasi va GND o‘rtasida (baza tokini himoya qilish uchun ishlatiladi)."], ["Har qanday elektron sxemani yig‘ishda xavfsizlik qoidalariga ko‘ra birinchi navbatda qanday ish bajarilishi kerak?", "Sxemani quvvat manbai o‘chiq holda yig'ish kerak (tasodifiy shikastlanishlarning oldini olish).", "Barcha komponentlarning texnik xususiyatlarini batafsil tekshirish va hujjatlashtirish.", "Har bir komponentning ulanish joylarini aniq belgilash va sxematik diagrammani chizish.", "Multimetr yordamida har bir rezistorning qarshiligini o‘lchash va qiymatlarini qayd etish."], ["Qanday hollarda BJT (bipolyar ulanishli tranzistor) o‘rniga logic-level MOSFET tanlash afzalroq hisoblanadi?", "Katta kollektor toki va yuqori samaradorlik talab qilinganda logic-level MOSFET afzal ko‘riladi.", "Kichik signal kuchaytirish va past chastotali kommutatsiya qilish kerak bo‘lganda MOSFET afzaldir.", "Elektronika sxemasida minimal joy egallash va arzon narxga ega bo‘lish asosiy talab bo‘lganda.", "Yuqori kuchlanishli o‘ta sezgir sensorlar bilan ishlashda va minimal quvvat iste’moli muhim bo‘lganda."], ["Nima uchun DC motorni Arduino ning 5 V pinidan to‘g‘ridan-to‘g‘ri quvvatlash tavsiya etilmaydi?", "DC motorning ishga tushish yoki tiqilib qolish toki odatiy ish tokidan bir necha marta katta bo‘lishi mumkin, bu Arduino piniga yuklama beradi.", "Arduino ning 5 V pini faqat raqamli signallarni uzatish uchun mo‘ljallangan, quvvatlash uchun mutlaqo yaroqsizdir.", "DC motorni Arduino dan quvvatlash uni haddan tashqari qizib ketishiga va tezda ishdan chiqishiga olib keladi.", "Arduino ning 5 V pini faqat past quvvatli LEDlar uchun yetarli bo‘lgan tokni yetkazib berishi mumkin, boshqa yuklar uchun emas."], ["Impuls Kengligi Modulyatsiyasi (PWM) NPN tranzistor orqali qanday funksiyani bajaradi?", "PWM tranzistorni tez ON va OFF holatlarga o‘tkazish orqali yukning o‘rtacha toki va quvvatini boshqaradi.", "PWM tranzistorni doimiy ravishda ON holatida saqlaydi, uning ish samaradorligini sezilarli darajada oshiradi.", "PWM tranzistordan oqib o‘tadigan tokning yo‘nalishini teskari tomonga o‘zgartirish uchun mexanizmdir.", "PWM tranzistorning ichki haroratini o‘lchash va unga qarab tashqi sovutish tizimini faollashtirish usulidir."], ["NPN tranzistorining kollektor chiqishi sxemada odatda qanday vazifani bajaradi va qayerga ulanadi?", "Kollektor yuk toki kiradigan elektrod bo‘lib, yuklamaning manfiy tomoniga ulanadi va tokni boshqaradi.", "Kollektor tranzistorning asosiy boshqaruv elektrodi bo‘lib, baza tokini qabul qiladi va kuchlanishni sozlaydi.", "Kollektor doimiy ravishda yerga (GND) ulanib, tranzistorning barqaror ishlashini ta’minlaydigan tayanch nuqtasidir.", "Kollektor mikrokontrollerning raqamli piniga to‘g‘ridan-to‘g‘ri ulanadi, bu esa tranzistorni ON/OFF holatiga keltiradi."], ["Agar I_C=100 mA va beta_forced=10 bo‘lsa, baza toki I_B ni hisoblang.", "I_B = I_C/beta_forced = 100 mA / 10 = 10 mA", "I_B = I_C · beta_forced = 100 mA · 10 = 1000 mA", "I_B = beta_forced / I_C = 10 / 100 mA = 0.1 mA", "I_B = 100 mA + 10 = 110 mA"], ["Tashqi quvvat manbai ishlatilganda, masalan, DC motorni boshqarishda, Arduino GND va tashqi manba GND sini umumiy qilish nimaga xizmat qiladi?", "U barcha zanjirlar uchun umumiy tayanch nuqtasini ta’minlaydi, bu esa boshqaruv signallari va yuk toki uchun to‘g‘ri ishlashni kafolatlaydi.", "U Arduino ni tashqi manba tomonidan keladigan haddan tashqari kuchlanishdan himoya qilish uchun qo‘llaniladigan himoya chorasidir.", "U har ikkala manba o‘rtasidagi potentsial farqni oshirishga yordam beradi, bu esa yuklamaga ko‘proq quvvat yetkazib berish imkonini beradi.", "U Arduino ning ichki soatini tashqi quvvat manbaining chastotasi bilan sinxronlashtirish uchun zarur bo‘lgan muhim ulanishdir."], ["Elektr zanjirida rezistorning asosiy vazifasi qaysi javobda to'g'ri ko'rsatilgan?", "Zanjirdan oqib o'tayotgan elektr toki miqdorini cheklash", "Elektr energiyasini elektrostatik maydonda zaryadlash", "O'zgaruvchan tok signallarini to'g'rilab bir tomonga yo'naltirish", "Past kuchlanishli signallarni yuqori darajaga kuchaytirish"], ["Elektron sxemalarda kondensator qanday vazifani bajarishga mo'ljallangan?", "Elektr zaryadini vaqtinchalik to'plash hamda saqlash", "Zanjirdagi umumiy elektr qarshiligini sun'iy oshirish", "Tok oqimini faqat bitta yo'nalish bo'ylab erkin o'tkazish", "Kirish signallarining chastotasini avtomatik barqarorlash"], ["Yarimo'tkazgichli diodning asosiy ishlash prinsipi nimadan iborat?", "Elektr tokini faqat bitta yo'nalishda to'siqsiz o'tkazish", "Zanjirdagi tok kuchini keskin kamaytirib quvvat tejash", "O'zgarmas tokni o'zgaruvchan yuqori chastotaga aylantirish", "Elektr energiyasini butunlay yorug'lik energiyasiga burish"], ["Elektron zanjirlarda tranzistor qanday funksional vazifalarda qo'llaniladi?", "Elektron kalit yoki signallarni kuchaytirgich sifatida", "Elektr zaryadlarini uzoq vaqt zaxira qilib saqlovchi element", "Zanjirni ortiqcha yuqori tokdan uzib himoyalovchi saqlagich", "Faqat bir tomonlama elektr o'tkazuvchanlikni hosil qilish"], ["Multimetr yordamida kuchlanish o'lchanganda asbob sxemaga qanday ulanadi?", "O'lchanayotgan zanjir qismiga yoki elementiga parallel ravishda", "O'lchanayotgan butun zanjir tarmog'iga ketma-ket uzilish hosil qilib", "Faqatgina manbaning manfiy qutbiga ketma-ket ulanish usuli orqali", "Elementni asosiy platadan to'liq sug'urib olib alohida holda ulab"], ["Rezistorning qarshiligini multimetrda o'lchashdan oldin qanday talab bajarilishi shart?", "Zanjirdan quvvat manbai to'liq uzilishi va element ajratilishi kerak", "Manba kuchlanishi maksimal qiymatgacha ko'tarilishi ta'minlanishi shart", "Multimetr probi faqat yuqori tok o'lchash portiga kiritilishi talab etiladi", "Rezistor avval yuqori haroratgacha qizdirilib keyin tez sovutilishi zarur"], ["O'zgarmas tok kuchlanishini o'lchash uchun multimetr qaysi rejimga o'rnatiladi?", "V= (DC kuchlanish) belgisiga ega bo'lgan rejimga", "V~ (AC kuchlanish) belgisiga ega bo'lgan rejimga", "A/mA (tok kuchini o'lchash) diapazoniga tegishli qismga", "Ohm (qarshilikni o'lchash) belgisiga ega bo'lgan sohaga"], ["Multimetrning 'Davomiylik' (bip signali) rejimidan qaysi maqsadda foydalaniladi?", "Zanjir butunligini va qisqa tutashuv mavjudligini aniqlashda", "Kondensatorning maksimal elektr sig'imini aniq hisoblashda", "Zanjirdan oqib o'tayotgan faol quvvat miqdorini aniqlashda", "Tranzistorning kuchaytirish koeffitsiyentini to'g'ridan baholash"], ["LED diodli oddiy zanjirda rezistor nima sababdan majburiy element hisoblanadi?", "LED orqali o'tuvchi tokni cheklash va uni kuyishdan saqlash uchun", "Manba kuchlanishini sun'iy ravishda ikki barobarga oshirish uchun", "LED tarqatayotgan yorug'lik to'lqin uzunligini qisqartirish uchun", "Zanjirda tokning faqat o'zgaruvchan rejimda oqishini ta'minlashga"], ["Tajribada LED qutblari zanjirga qanday tartibda to'g'ri ulanishi lozim?", "Anod manbaning musbatiga, katod rezistor orqali manfiy qutbga", "Katod manbaning musbatiga, anod rezistor orqali manfiy qutbga", "Anod va katod o'zaro tutashtirilib faqat manba musbat qutbiga", "Ikkala chiqish ham rezistorsiz to'g'ridan to'g'ri manfiy qutbga"], ["Agar U = 5 V, U_LED = 2 V va R = 330 Ohm bo'lsa, zanjirdagi tok kuchi qancha bo'ladi?", "Taxminan 9 mA (0.009 A) ga teng bo'ladi", "Taxminan 15 mA (0.015 A) ga teng bo'ladi", "Taxminan 21 mA (0.021 A) ga teng bo'ladi", "Taxminan 33 mA (0.033 A) ga teng bo'ladi"], ["U = 5 V va U_LED = 2 V bo'lgan ketma-ket zanjirda rezistordagi kuchlanish tushishi qanchaga teng?", "3.0 V ga teng bo'ladi", "2.0 V ga teng bo'ladi", "5.0 V ga teng bo'ladi", "1.5 V ga teng bo'ladi"], ["Multimetrda tok o'lchash rejimidan so'ng qanday xavfsizlik chorasi ko'rilishi lozim?", "Qizil probni zudlik bilan VOhm portiga qaytarib ulash zarur", "Qora probni COM portidan chiqarib ochiq holatda qoldirish kerak", "Multimetrni tezda AC yuqori kuchlanish rejimiga o'tkazish lozim", "Asbob batareyasini har bir o'lchashdan so'ng darhol ajratish lozim"], ["Yig'ilgan zanjirda LED yonmasa, texnik xatolikni bartaraf etish uchun nima qilinadi?", "LED qutblari to'g'riligini va rezistor qiymatini qayta tekshirish", "Multimetr qizil probini faqat tok o'lchaydigan portga qayta ulash", "Manba kuchlanishini ruxsat etilgan maksimal qiymatgacha ko'tarish", "Sxemadagi rezistorni olib tashlab uning o'rniga to'g'ri sim ulash"], ["O'lchash vaqtida multimetr ekrani nol ko'rsatsa, nosozlikning sababi nima bo'lishi mumkin?", "Zanjirda kontakt uzilgan bo'lishi mumkin, ulanishlarni tekshirish kerak", "Manba kuchlanishi belgilangan nominal qiymatdan ancha baland bo'lgan", "Rezistor qarshiligi o'z-o'zidan keskin pasayib nol holatiga kelib qolgan", "Zanjirga diod o'rniga yuqori quvvatli induktiv g'altak ulab qo'yilgan"], ["Multimetrning umumiy 'COM' (Common) portiga qaysi prob ulanadi?", "Har doim qora rangli manfiy prob ulanadi", "Har doim qizil rangli musbat prob ulanadi", "Faqat tok kuchi o'lchanayotganda qizil prob", "Faqat yuqori kuchlanish o'lchanganda sariq prob"], ["Tok o'lchashda multimetr xato qilib parallel ulansa, muammoni qanday hal etish zarur?", "Zanjirni uzib, multimetrni zanjirga ketma-ket ulash kerak", "Multimetr rejimini V~ holatiga zudlik bilan almashtirish zarur", "Problarning joyini teskari o'zgartirib parallel qoldirish lozim", "Manba kuchlanishini nolgacha pasaytirib o'lchashni davom etish kerak"], ["Rezistorning elektron zanjirdagi asosiy vazifasi nimadan iborat?", "Elektr tokini cheklash, kuchlanishni taqsimlash va signal darajasini moslashtirish.", "O'zgaruvchan tokni to'g'irlash, chastotani o'zgartirish va impuls hosil qilish.", "Zaryadni saqlash, induktivlikni yaratish va signalni kuchaytirish funksiyalarini bajarish.", "Mexanik harakatni elektr signallariga aylantirish hamda yorug'likni filtrlash."], ["Yorug‘lik intensivligiga qarab o‘zining elektr qarshiligini o‘zgartiradigan maxsus rezistor turi qanday?", "Fotorezistor deb ataladi, u yorug‘likni aniqlash va o‘lchash qurilmalarida ishlatiladi.", "Termistor deb ataladi, u harorat o'zgarishlariga sezgir bo'lgan komponent hisoblanadi.", "Reostat deb ataladi, u zanjirdagi tokni mexanik tarzda sozlash uchun mo'ljallangan.", "Doimiy rezistor deb ataladi, u o'zgarmas qarshilik qiymatiga ega bo'lgan passiv element."], ["LED bilan ishlaganda eng ko‘p uchraydigan xatoliklardan biri nimadan iborat?", "Anod va katodning polaritetini chalkashtirib yuborish, bu LEDning noto'g'ri ishlashiga olib keladi.", "LEDni yuqori chastotali tok manbaiga to'g'ridan-to'g'ri ulash va uning ishlashini sinash.", "Kerakli quvvatdagi himoya rezistorini ishlatmasdan LEDni zanjirga ulash.", "LEDning yorug'lik intensivligini noto'g'ri aniqlash va rangini tanlashda xatoga yo'l qo'yish."], ["5 halqali rezistorning rang kodida asosiy raqamlar qanday joylashadi?", "Dastlabki uchta halqa asosiy raqamlarni, keyingisi ko‘paytirgich va oxirgisi tolerantlikni bildiradi.", "Birinchi ikkita halqa asosiy raqamlarni, uchinchi va to'rtinchi halqalar ko'paytirgichni ko'rsatadi.", "Faqa ikkita halqa asosiy raqam sifatida ishlatiladi, qolganlari tolerantlik va harorat koeffitsiyentini anglatadi.", "Dastlabki to'rtta halqa asosiy raqamlarni ifodalaydi, oxirgi halqa esa faqat tolerantlikni beradi."], ["O‘zgaruvchan rezistorlarga misol sifatida qaysi qurilmalarni keltirish mumkin?", "Potensiometr va reostat, ular qarshilikni mexanik tarzda o'zgartiradi.", "Termistor va fotorezistor, ular atrof-muhit sharoitlariga sezgir.", "Tranzistor va diod, ular yarimo'tkazgichli elementlar sanaladi.", "Kondensator va induktiv g'altak, ular energiyani saqlash vazifasini bajaradi."], ["Fotorezistorning qarshiligi qaysi tashqi omilga qarab sezilarli darajada o‘zgarish xususiyatiga ega?", "Yorug'lik intensivligi, uning miqdoriga qarab elektr qarshiligi o'zgaradi.", "Atrof-muhit harorati, uning ta'sirida qarshilik qiymatini o'zgartiradi.", "Mexanik bosim, uning bosimi ostida qarshilik qiymati sezilarli farqlanadi.", "Namlik darajasi, uning foiziga qarab elektr qarshiligi o'zgarib turadi."], ["4 halqali rezistorda birinchi va ikkinchi rang halqalari qanday vazifani bajaradi?", "Rezistorning nominal qiymatining asosiy raqamlarini ifodalaydi.", "Rezistorning ko'paytirgich qiymatini yoki o'nlik darajasini ko'rsatadi.", "Rezistorning umumiy qarshilikka nisbatan tolerantligini belgilaydi.", "Rezistorning harorat koeffitsiyentini va uning ishlash quvvatini ko'rsatadi."], ["Rezistorning rang kodini o‘qishda birinchi qadam nima hisoblanadi, ayniqsa tolerantlik halqasi orqali?", "Tolerantlik halqasini topish, u ko‘pincha oltin yoki kumush rangda bo‘ladi.", "Eng chapdagi rang halqasidan boshlab asosiy raqamlarni aniqlash.", "Ko'paytirgich halqasining qiymatini ranglar jadvalidan tekshirish.", "Rezistorning hajmini aniqlash va uning quvvatini baholash."], ["Rang kodlash jadvalida oltin rang qaysi tolerantlik (aniqlik darajasi) qiymatini ifodalaydi?", "±5%, bu rezistorning haqiqiy qiymat oralig'ini belgilaydi.", "±1%, bu yuqori aniqlikdagi rezistorlar uchun xos tolerantlikdir.", "±10%, bu biroz kengroq qiymat oralig'ini ko'rsatadi.", "±2%, bu o'rtacha aniqlikdagi rezistorlar uchun tolerantlik qiymati."], ["Om qonuniga ko‘ra, agar zanjirdagi qarshilik qiymati oshsa, undan o‘tadigan tok qanday o‘zgaradi?", "Zanjirdan o‘tadigan tok kamayadi, chunki qarshilik tokka to‘siqlik qiladi.", "Zanjirdan o‘tadigan tok oshadi, chunki qarshilik tok oqimini tezlashtiradi.", "Zanjirdan o‘tadigan tok o‘zgarmaydi, chunki u faqat kuchlanishga bog‘liq.", "Tokning yo‘nalishi teskari bo‘ladi, chunki qarshilik qutbni o‘zgartiradi."], ["Harorat o‘zgarishlariga sezgir bo‘lgan maxsus rezistor turi qaysi?", "Termistor (haroratga sezgir), u haroratga qarab qarshilik qiymatini o‘zgartiradi.", "Fotorezistor (yorug‘likka sezgir), u yorug‘lik intensivligiga qarab qarshiligini o‘zgartiradi.", "Varistor (kuchlanishga sezgir), u kuchlanishning o‘zgarishiga javoban qarshilikni o‘zgartiradi.", "Potensiometr (mexanik sozlanuvchi), u qo‘lda aylantirish orqali qarshilikni sozlash imkonini beradi."], ["4 halqali rezistorda 4-halqaning asosiy vazifasi nimadan iborat?", "Tolerantlikni bildiradi, bu rezistorning nominal qiymatdan og‘ish foizini ko‘rsatadi.", "Ko‘paytirgichni ifodalaydi, bu asosiy raqamlarni qaysi omilga ko‘paytirishni aniqlaydi.", "Dastlabki raqamni aniqlaydi, bu rezistor qiymatining birinchi muhim raqami hisoblanadi.", "Harorat koeffitsiyentini belgilaydi, bu rezistorning harorat o‘zgarishiga javobini ko‘rsatadi."], ["\"Jigarrang-Qora-Qizil-Oltin\" rang kodiga ega rezistorning nominal qarshilik qiymatini hisoblang.", "10 x 100 Ohm = 1 kOhm ±5%, bu uning haqiqiy qiymatini ifodalaydi.", "1 x 0 x 2 Ohm = 0 Ohm ±5%, bu juda past qarshilikni ko‘rsatadi.", "10 + 100 Ohm = 110 Ohm ±5%, bu ranglar raqamlari yig‘indisidir.", "10 x 1000 Ohm = 10 kOhm ±5%, bu noto‘g‘ri ko‘paytirgich natijasidir."], ["Agar rezistor \"Sariq-Binafsha-Qizil-Oltin\" rang kodiga ega bo‘lsa, uning nominal qarshiligi va tolerantligi qanday?", "R = 47 x 100 = 4700 Ohm = 4.7 kOhm ±5%, bu to‘g‘ri hisoblangan qiymatdir.", "R = 47 x 1000 = 47 kOhm ±5%, bu noto‘g‘ri ko‘paytirgich qiymati bilan hisoblangan.", "R = 47 + 100 = 147 Ohm ±5%, bu rang raqamlarining noto‘g‘ri yig‘indisi bilan topilgan.", "R = 4.7 x 10 = 47 Ohm ±5%, bu ko‘paytirgichning noto‘g‘ri qo‘llanilishi natijasidir."], ["Multimetr yordamida rezistor qiymatini o‘lchashda, multimetr qaysi rejimga o‘rnatilishi kerak?", "Ohm (ohmmetr) rejimiga, bu qarshilikni aniq o‘lchash imkonini beradi.", "V (voltmetr) rejimiga, bu faqat kuchlanishni o‘lchash uchun mo‘ljallangan.", "A (ampermetr) rejimiga, bu faqat tok kuchini o‘lchash uchun ishlatiladi.", "F (faradmetr) rejimiga, bu sig‘imni o‘lchash uchun maxsus rejim hisoblanadi."], ["Mikrokontroller kirishlarida pull-up va pull-down rezistorlarining asosiy vazifasi nimadan iborat?", "Kirishlarning suzuvchi holatga tushib qolishini oldini olish va logik darajalarni barqaror shakllantirish.", "Kirish tokini kuchaytirish va chiqish signalini sezilarli darajada oshirish orqali funksiyani yaxshilash.", "Kirish kuchlanishini oshirish va mikrokontrollerning ish tezligini oshirishga yordam berish.", "Raqamli signallarni analog signallarga o‘zgartirish va ma’lumotlarni saqlash uchun xizmat qilish."], ["Matnda keltirilgan, multimetr bilan sxemadagi rezistorni o‘lchashda tez-tez uchraydigan xato qaysi?", "Multimetr bilan o‘lchash paytida rezistor sxemadan ajratilmaganligi, bu xato natijaga olib keladi.", "Multimetrning batareyasining quvvati past bo‘lishi, bu o‘lchov aniqligiga doimo ta’sir qilmaydi.", "Rezistorning rangi aniq ko‘rinmasligi, bu multimetr o‘lchoviga to‘g‘ridan-to‘g‘ri ta’sir qilmaydi.", "Multimetrning Ohm rejimiga o‘rnatilmaganligi, bu xato emas, balki boshqa o‘lchov turidir."], ["Elektr zanjirida ampermetr va voltmetr asboblari qanday tarzda ulanishi kerak?", "Ampermetr zanjirga ketma-ket, voltmetr esa yuklamaga parallel ulanadi.", "Ampermetr yuklamaga parallel, voltmetr esa zanjirga ketma-ket ulanadi.", "Ikkala asbob ham har doim yuklamaga parallel ulanishi talab etiladi.", "Ikkala asbob ham zanjirga bir vaqtning o'zida ketma-ket ulanishi shartdir."], ["Ketma-ket ulangan rezistorlar zanjirida umumiy kuchlanish qanday hisoblanadi?", "Umumiy kuchlanish har bir rezistordagi kuchlanish tushuvlarining yig'indisiga teng: U = U1 + U2 + U3.", "Umumiy kuchlanish har bir rezistordagi kuchlanish tushuviga teng bo'ladi, U = U1 = U2 = U3.", "Umumiy kuchlanish eng katta qarshilikka ega rezistordagi kuchlanishga tengdir.", "Kuchlanish tushuvlari tok kuchiga teskari proporsional bo'lib, o'zgarishsiz qoladi."], ["Ketma-ket ulangan uchta R1, R2, R3 rezistorning ekvivalent qarshiligi qanday hisoblanadi?", "Ekvivalent qarshilik alohida qarshiliklar yig'indisiga teng: R_ekv_ = R1 + R2 + R3.", "Ekvivalent qarshilikning teskari qiymati alohida qarshiliklarning teskari yig'indisiga teng.", "Ekvivalent qarshilik har doim eng kichik rezistor qarshiligidan kichik bo'ladi.", "Ekvivalent qarshilik alohida qarshiliklarning ko'paytmasining yig'indisiga tengdir."], ["Agar 0.25 W quvvatga ega rezistor orqali 0.36 W quvvat ajralishi hisoblansa, nima qilish kerak?", "Kuchlanishni kamaytirish yoki quvvati kamida 0.5 W bo'lgan rezistordan foydalanish zarur.", "Tok cheklovini oshirish orqali rezistorning ishlash muddatini uzaytirish lozim.", "Bunday holatda rezistorning nominal quvvatini o'zgartirish talab etiladi.", "Rezistorning qizishini e'tiborsiz qoldirib, o'lchashlarni davom ettirish tavsiya etiladi."], ["Multimetrning aniqligi o'lchov natijalariga qanday ta'sir qiladi va uni qanday kamaytirish mumkin?", "U va I qiymatlarida instrumental xatolik yuzaga keladi; mos diapazonni tanlash muhim.", "Faqat rezistor qarshiligi o'lchamlariga ta'sir qiladi; kontakt qarshiligi asosiy omil.", "Asosan kuchlanish beqarorligiga olib keladi; multimetr rejimi ahamiyatsizdir.", "Quvvatni noto'g'ri hisoblashga olib keladi; rezistor toleransini oldindan o'lchash shart."], ["Agar manba kuchlanishi U = 12 V va rezistor qarshiligi R = 240 Ohm bo'lsa, tok kuchini hisoblang.", "Tok kuchi I = U/R = 12 V / 240 Ohm = 0.05 A = 50 mA ga teng bo'ladi.", "Tok kuchi I = U · R = 12 V · 240 Ohm = 2880 A ga teng bo'ladi.", "Tok kuchi I = R/U = 240 Ohm / 12 V = 20 A ga teng bo'ladi.", "Tok kuchi I = U^2 / R = (12 V)^2 / 240 Ohm = 0.6 A ga teng bo'ladi."], ["Om qonunini ifodalovchi asosiy formulalar qaysilar va ulardagi kattaliklarning belgilari qanday?", "U = I · R, I = U/R, R = U/I; bu yerda U kuchlanish, I tok kuchi, R esa qarshilikdir.", "P = U · I, P = I^2R, P = U^2/R; bu yerda P quvvat, U kuchlanish, I tok kuchi, R qarshilikdir.", "Q = I · t, Q = U · t / R, Q = P · t; bu yerda Q zaryad, I tok kuchi, t vaqt, U kuchlanishdir.", "W = U · Q, W = P · t, W = I^2R · t; bu yerda W ish, U kuchlanish, Q zaryad, P quvvatdir."], ["Elektr rezistorida ajraladigan quvvatni hisoblash uchun qaysi formulalar to‘g‘ri keladi?", "P = U · I, P = I^2R, P = U^2/R kabi formulalar elektr quvvatini aniqlashda qo‘llaniladi.", "R_ekv = R1 + R2 + R3 va 1/R_ekv = 1/R1 + 1/R2 + 1/R3 kabi formulalar asosan qarshilikni ifodalaydi.", "I = U/R va U = I · R kabi munosabatlar asosan Om qonunini tok va kuchlanish orqali tushuntiradi.", "Q = C · U va E = 1/2 C U^2 kabi formulalar asosan sig‘im va energiyani kondensatorlarda tavsiflaydi."], ["Ketma-ket ulangan R1, R2, R3 rezistorlar uchun ekvivalent qarshilik (R_ekv) qanday hisoblanadi?", "R_ekv = R1 + R2 + R3 formulasi bilan, bu alohida qarshiliklarning oddiy yig‘indisidir.", "1/R_ekv = 1/R1 + 1/R2 + 1/R3 formulasi bilan, bu o‘zaro qarshiliklar yig‘indisidir.", "R_ekv = (R1 · R2) / (R1 + R2) formulasi bilan, bu asosan ikki rezistor uchun qo‘llaniladi.", "R_ekv = nR formulasi bilan, bu faqat bir xil nominal qiymatli n ta rezistor uchun ishlatiladi."], ["Elektr sxemasini yig‘ish yoki o‘zgartirishda xavfsizlik qoidalari bo‘yicha eng muhim talab qaysi?", "Sxemani faqat quvvat manbai o‘chirilgan holatda yig‘ish yoki o‘zgartirish kerak, bu xavfsizlikni ta’minlaydi.", "Sxemani yig‘ishda har doim maksimal kuchlanishni ishlatish tavsiya etiladi, bu tezroq natija beradi.", "Kondensatorlarni har doim zaryadlangan holatda qoldirish muhim, chunki bu ularning xizmat muddatini uzaytiradi.", "Har bir komponentni ulashdan oldin uning haroratini tekshirish lozim, agar u haddan tashqari qizigan bo‘lsa."], ["Agar elektr manbaining kuchlanishi U = 12 V va zanjirdagi umumiy qarshilik R = 240 Ohm bo‘lsa, Om qonuniga ko‘ra tok kuchini (I) hisoblang.", "I = U/R = 12 V / 240 Ohm = 0.05 A yoki 50 mA ga teng bo‘ladi.", "I = U · R = 12 V · 240 Ohm = 2880 A yoki 2.88 kA ga teng bo‘ladi.", "I = R/U = 240 Ohm / 12 V = 20 A ga teng bo‘ladi.", "I = (U + R) = (12 + 240) = 252 A ga teng bo‘ladi."], ["Om qonuniga ko'ra, kuchlanish, tok kuchi va qarshilik orasidagi bog'lanishni ifodalovchi asosiy formula qaysi?", "Kuchlanish tok kuchi va qarshilik ko'paytmasiga tengdir, ya'ni U = I · R.", "Kuchlanish tok kuchi va quvvat yig'indisiga tengdir, ya'ni U = I + P.", "Qarshilik tok kuchi va kuchlanish nisbatiga tengdir, ya'ni R = I / U.", "Tok kuchi kuchlanish va qarshilik ayirmasiga tengdir, ya'ni I = U - R."], ["Parallel ulangan rezistorlar zanjirida kuchlanishlar orasidagi munosabat qanday bo'ladi?", "Har bir tarmoqdagi kuchlanish manba kuchlanishiga teng bo'ladi, ya'ni U = U1 = U2 = U3.", "Parallel ulangan zanjirda umumiy kuchlanish har bir rezistordagi kuchlanishlar yig'indisiga teng bo'ladi.", "Har bir rezistordagi kuchlanish qiymati uning qarshilik kattaligiga teskari proporsional bo'ladi.", "Manba kuchlanishi har bir rezistordagi tok kuchi bilan proporsional ravishda o'zgaradi."], ["Parallel rezistor ulanishining asosiy amaliy qo'llanish sohasi qaysi hisoblanadi?", "Uy elektr tarmog'ida va bir nechta mustaqil yuklamalarni ulashda qo'llaniladi.", "Yuqori kuchlanishli impulsli generatorlarda va elektr yoylarini o'chirishda qo'llaniladi.", "Tokni barqarorlashtirish tizimlarida va o'zgaruvchan tok konvertorlarida ishlatiladi.", "Raqamli signallarni qayta ishlash sxemalarida va mikroprotsessorlar dizaynida."], ["Tajriba natijalarida yuzaga keladigan xatoliklarning asosiy manbalaridan biri sifatida rezistor toleransi qanday ta'sir ko'rsatadi?", "Haqiqiy rezistor qarshiligi nominal qiymatdan farq qiladi va bu o'lchovlarga ta'sir etadi.", "Rezistor toleransi har doim hisoblangan quvvatni oshirib yuboradi va tizimni ortiqcha yuklaydi.", "U faqat juda past haroratlarda o'lchov natijalariga sezilarli darajada ta'sir etadi.", "Rezistor toleransi faqat yuqori chastotali signallarda sezilarli darajada namoyon bo'ladi."], ["Rezistor elektr zanjirida qanday passiv komponent hisoblanadi va uning asosiy vazifasi nimadan iborat?", "Tokni cheklaydigan va elektr energiyasini issiqlikka aylantiradigan passiv komponentdir.", "Kuchlanishni oshiradigan va elektr energiyasini mexanik energiyaga aylantiradigan aktiv komponentdir.", "Chastotani o'zgartiradigan va magnit maydonni hosil qiladigan yarimo'tkazgichli qurilmadir.", "Elektr zaryadini saqlaydigan va signalni kuchaytiradigan faol elektron komponentdir."], ["Nazariy va tajriba qarshiliklari orasidagi nisbiy xatolik qanday formula bilan hisoblanadi?", "Nisbiy xatolik delta = |Rt - Rn| / Rn · 100% formulasi orqali aniqlanadi.", "Nisbiy xatolik delta = (Rt + Rn) / Rn · 100% formulasi orqali hisoblanadi.", "Nisbiy xatolik delta = |Rt + Rn| / Rt · 100% formulasi orqali hisoblanadi.", "Nisbiy xatolik delta = (Rt - Rn) · Rn / 100% formulasi orqali hisoblanadi."], ["Analog signal raqamli signaldan qaysi asosiy xususiyati bilan farq qiladi, bu uning tabiatini belgilaydi?", "Analog signal uzluksiz qiymatlarni qabul qilsa, raqamli signal cheklangan butun sonlar oraliqlarida aks etadi.", "Analog signal faqat 0 va 1 qiymatlarga ega bo'lsa, raqamli signal doimiy o'lchov birliklarini ishlatadi.", "Raqamli signal faqat shovqin va asbob aniqligiga bog'liq bo'lsa, analog signal faqat kvantlash xatosiga moyil.", "Raqamli signal doimiy o'lchov birliklariga ega bo'lsa, analog signal faqat vaqt o'qi bo'yicha diskret qiymatlarni oladi."], ["Potensiometrning umumiy qarshiligi Rpot uning ichki R12 va R23 qarshilik qismlari bilan qanday bog'langan?", "Dasta holati o'zgarishi bilan R12 va R23 qiymatlari o'zgarsa ham, ularning yig'indisi umumiy Rpot qiymatiga teng bo'ladi.", "Rpot faqatgina R12 ga bog'liq bo'lib, R23 qarshiligi esa tashqi yuklamani nazarda tutadi va uni o'zgartiradi.", "R12 va R23 qarshiliklari Rpot ga nisbatan har doim bir xil bo'lib qoladi, bu ularning chiziqli xususiyatini ko'rsatadi.", "Rpot = R12 – R23 formulasi bilan hisoblanadi, chunki bitta qismning qarshiligi ikkinchisidan ajratib tashlanadi."], ["Potensiometrga ulangan yuklanish qarshiligi (RL) kamayganda Vout chiqish kuchlanishi nima sababdan o'zgaradi?", "Yuklanish qarshiligi RL potensiometrning pastki qismi R12 bilan parallel ulanib, effektiv qarshilikni o'zgartiradi.", "Vout faqat manba kuchlanishi Vs ga bog'liq bo'lgani uchun yuklanish qarshiligi uning qiymatini o'zgartirmaydi.", "RL kamayganda, potensiometrning umumiy qarshiligi Rpot ham mutlaqo o'zgaradi va Vout ning qiymati ortadi.", "Yuklanishning o'zgarishi faqat sirpangichning mexanik holatiga ta'sir qiladi, elektr kuchlanishiga ta'siri yo'q."], ["Agar Vref = 5 V bo'lsa va Arduino analogRead() funksiyasi ADC = 614 qiymatini qaytarsa, Vout chiqish kuchlanishini hisoblang.", "Vout ~ 3.001 V, bu qiymat ADC o'qishini mos Vref bilan normallashtirish natijasida hosil bo'ladi.", "Vout ~ 6.14 V, chunki ADC qiymati Vref ga to'g'ridan-to'g'ri ko'paytiriladi va voltajga aylanadi.", "Vout ~ 0.614 V, bu qiymat ADC ning umumiy diapazonga nisbati bilan aniqlanganidek voltni ifodalaydi.", "Vout ~ 2.50 V, chunki bu Arduino kirishi uchun standart o'rta kuchlanish qiymati bo'lib, odatda unga yaqin bo'ladi."], ["Chiziqli potensiometrlar (B turi) o'zining qarshilik holatga deyarli proporsional ekanligi tufayli qaysi dasturlarda eng keng qo'llaniladi?", "Kuchlanishni o'lchash, boshqaruv tizimlari va analog-raqamli konvertor (ADC) dasturlarda faol ishlatiladi.", "Ovoz balandligini sozlash va audio sezgirligini tartibga solish kabi akustik ilovalarda asosiy rol o'ynaydi.", "Kichik asboblar bilan kalibrlash uchun mo'ljallangan trimmer potensiometrlarining o'rnini bosadi va universaldir.", "Aniq va sekin sozlanishi talab qilinadigan laboratoriya o'lchov qurilmalarida maxsus vazifalarni bajaradi."], ["Arduino analogRead() funksiyasidan olingan 10-bitli ADC qiymatini voltga aylantirish uchun qaysi formuladan foydalanish kerak?", "Vout = ADC · Vref / 1023, bu yerda Vref manba kuchlanishi va 1023 ADC ning maksimal o'qishidir.", "Vout = ADC / (Vref · 1023), bu formula Vref ning kvadratini hisobga olgan holda aniq natija beradi.", "Vout = ADC + Vref + 1023, bu qiymatlar shunchaki qo'shilib, umumiy voltajni ifodalaydi.", "Vout = (Vref – ADC) · 1023, bu formulada kuchlanish farqi hisoblanadi va raqamli qiymatga aylanadi."], ["Arduino UNO analog-raqamli o'zgartirgichining kvantlash qadami 'q' (Vref = 5.00 V bo'lganda) taxminan qanday qiymatga ega?", "q = Vref / 1023 ~ 4.89 mV, bu har bir raqamli qadamga to'g'ri keladigan eng kichik kuchlanish o'zgarishidir.", "q = 5.00 V, chunki kvantlash qadami Vref ning o'ziga teng bo'lib, uning butun qiymatini ifodalaydi.", "q = 1023 mV, bu qiymat ADC ning maksimal raqamli o'qishini millivoltga aylantirilgan holatidir.", "q = 0 mV, chunki ideal sharoitda kvantlash qadami nolga yaqin bo'lib, uzluksiz signalni beradi."], ["Laboratoriya hisobotini rasmiylashtirishda \"Muhim tahlil\" qismida xatoliklarni izohlashda nimani ko'rsatish talab etiladi?", "Xatoning yo'nalishi, taxminiy miqdori va ehtimoliy sababi aniq ko'rsatilishi zarur.", "Faqatgina tajribada xatoliklar mavjudligini qayd etish kifoya, ularning sabablarini izohlash muhim emas.", "Barcha xatoliklarni to'liq bartaraf etish usullarini sanab o'tish va ularning qanday qo'llanilganini tushuntirish.", "Xatolikning yuzaga kelishi sababini yashirish va faqatgina ideal natijalarga erishilganini ta'kidlash."], ["Yuklanish qarshiligi (RL) kamayganda, potensiometrning Vout chiqish kuchlanishi nazariy qiymatdan nima sababdan farq qiladi?", "RL kamayganda, u R12 bilan parallel ulanib, Rpast = R12 || RL umumiy qarshilikni pasaytiradi, bu Vout nazariydan kichik bo‘lishiga olib keladi.", "Yuklanish qarshiligi kamayganida, potensiometrning umumiy Rpot qarshiligi oshadi va bu Vout ning ortishiga sabab bo‘ladi.", "RL kamayishi faqat manba kuchlanishini o‘zgartiradi, bu esa Vout
