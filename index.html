 chiqishida doimiy farqni keltirib chiqaradi.", "Bu holatda Vout chiqishi faqat R23 qarshiligiga bog‘liq bo‘ladi, RL ning o‘zgarishi unga hech qanday ta’sir ko‘rsatmaydi."], ["Agar Vref=5 V va Arduino ADC dan olingan kod 614 ga teng bo‘lsa, Vout chiqish kuchlanishini qanday hisoblash mumkin?", "Vout = 614 · 5.00 / 1023 ~ 3.001 V, bu formula ADC qiymatini voltga aylantiradi.", "Vout = 5.00 / 614 · 1023 ~ 8.32 V, bu noto‘g‘ri hisob-kitob, chunki tartib teskari bajarilgan.", "Vout = 614 + 5.00 + 1023 = 1642 V, bu qiymat faqat kodning to‘g‘ri summalarini hisoblashda qo‘llaniladi.", "Vout = 5.00 - (614 / 1023) ~ 4.40 V, bu formula differensial kuchlanishni hisoblashda qo‘llaniladi."], ["Arduino kodidagi `adc * VREF / 1023.0` satrining asosiy vazifasi nima?", "Bu satr Arduino ADC dan olingan raqamli kodni voltga aylantirish uchun ishlatiladi, bunda VREF mos yozuv kuchlanishi hisoblanadi.", "Bu satr ADC kodini o‘rtacha qiymatini hisoblash uchun mo‘ljallangan, VREF esa aniqlash qadamini belgilaydi.", "Bu satr faqatgina ADC kodini 1023 ga bo‘lish orqali signalning umumiy kuchini aniqlashda qo‘llaniladi.", "Ushbu satr ADC kodini to‘g‘ridan-to‘g‘ri VREF bilan taqqoslash orqali signalning buzilish darajasini aniqlaydi."], ["Laboratoriya ishi hisobotida \"xato bor\" deb yozish o‘rniga, xatoliklarni tahlil qilishda qanday ma’lumotlar ko‘rsatilishi kerak?", "Xatoning yo‘nalishi, taxminiy miqdori va ehtimoliy sababi ko‘rsatiladi, bu natijalarning yanada chuqur tahlilini taminlaydi.", "Faqatgina o‘lchov natijalari va nazariy qiymatlar o‘rtasidagi farqni ko‘rsatish kifoya qiladi, sabablarini izohlash shart emas.", "Har bir o‘lchovdagi mutlaq og‘ishning umumiy yig‘indisini ko‘rsatish va bu raqamni izohlash talab etiladi.", "Eng katta nisbiy xatolikka ega nuqtani belgilash va uning to‘g‘ri hisoblangan qiymatini ko‘rsatish zarur."], ["Xavfsizlik qoidalariga ko‘ra, sxemani yig‘ish yoki o‘zgartirishdan oldin nima qilish kerak?", "Sxemani manba o`chirilganida yig`ish yoki o`zgartirish kerak, bu qisqa tutashuv va jihoz shikastlanishining oldini oladi.", "Sxemani manba yoqilgan holda yig‘ish kerak, toki ulanishlarning to‘g‘riligini real vaqtda tekshirish mumkin bo‘lsin.", "Barcha simlarni ulashdan oldin multimetr bilan har bir simning qarshiligini o‘lchash zarur.", "Faol komponentlarni ulashdan oldin potensiometrning chiqish kuchlanishini sozlangan holatga keltirish muhim."], ["Arduino UNO uchun analog kirish piniga berilishi mumkin bo‘lgan kuchlanish diapazoni xavfsizlik qoidalariga ko‘ra qanday cheklangan?", "Arduino A0 piniga 0 V dan kichik yoki 5 V dan katta kuchlanish bermaslik kerak, chunki bu mikrokontrollerga zarar yetkazishi mumkin.", "A0 piniga faqat 1.5 V dan 3.3 V gacha bo‘lgan kuchlanish berish tavsiya etiladi, aks holda analog o‘lchov aniq bo‘lmaydi.", "A0 piniga istalgan kuchlanishni berish mumkin, chunki Arduino ichki himoya sxemalariga ega va zarar ko‘rmaydi.", "A0 piniga faqat manba kuchlanishining yarmidan oshmaydigan kuchlanish berilishi lozim, aks holda ADC haddan tashqari yuklanadi."], ["Potensiometrning Vout chiqishini breadboardda ko'pincha qaysi rangdagi sim bilan ulanish tavsiya etiladi?", "Sariq yoki yashil rangdagi sim, bu signal liniyasining standart belgilanishidir.", "Qora yoki ko'k rangdagi sim, bu doimiy ravishda nol potentsial (GND) uchun ishlatiladi.", "Qizil rangdagi sim, bu odatda musbat quvvat manbai (+5V) ulanishlarini ko'rsatadi.", "Oq rangdagi sim, bu faqat yuqori chastotali signallarni uzatish uchun maxsus mo'ljallangan."], ["Tajriba A da har bir o'lchash nuqtasi uchun mutlaq farq (DeltaV) va nisbiy xatolik (delta) qanday hisoblanadi?", "DeltaV = |Vo`lch – Vnaz| va delta = DeltaV / Vnaz · 100%, bunda Vnaz=0 bo`lsa, delta hisoblanmaydi.", "DeltaV = Vnaz + Vo`lch va delta = (Vnaz + Vo`lch) / Vnaz · 100%, har doim nolga teng.", "DeltaV = (Vo`lch · Vnaz) / 2 va delta = (DeltaV - Vnaz) · 100%, faqat ijobiy qiymatlarni oladi.", "DeltaV = |Vnaz / Vo`lch| va delta = DeltaV + Vnaz · 100%, har bir nuqta uchun majburiy hisoblanadi."], ["Potensiometr va Arduino bilan ishlashda qaysi xavfsizlik qoidasi eng muhim hisoblanadi?", "Sxemani manba o`chirilganida yig`ish yoki o`zgartirish, bu qisqa tutashuvlarning oldini oladi.", "Faqatgina yangi va to'liq zaryadlangan batareyalar ishlatish, bu qurilmalarning ishlash muddatini uzaytiradi.", "Har doim maksimal quvvatli rezistorlarni qo'llash, bu zanjirning ortiqcha yuklanishidan himoya qiladi.", "Kontaktlarni yalang'och qo'l bilan ushlamaslik, bu faqat yuqori kuchlanishli tizimlarda zarurdir."]]}];
const $=id=>document.getElementById(id);
let cur=0;
function drawSubs(){const b=$('subs');b.innerHTML='';SUBJ.forEach((s,k)=>{const x=document.createElement('button');x.className='opt sub'+(k===cur?' sel':'');
  const a=document.createElement('span');a.textContent=s.name;const c=document.createElement('small');c.textContent=s.q.length+' ta savol';x.append(a,c);
  x.onclick=()=>{cur=k;drawSubs()};b.appendChild(x)});
  $('avail').textContent='(mavjud: '+SUBJ[cur].q.length+')'}
drawSubs();
let list=[],i=0,score=0,wrong=[],locked=false;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){['start','quiz','end'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function begin(items){list=items.map(r=>({q:r[0],c:r[1],o:shuffle(r.slice(1))}));i=0;score=0;wrong=[];show('quiz');render()}
function render(){
  const it=list[i];locked=false;
  $('pos').textContent='Savol '+(i+1)+' / '+list.length;
  $('sc').textContent='To’g’ri: '+score;
  $('pb').style.width=(i/list.length*100)+'%';
  $('qt').textContent=it.q;
  const box=$('opts');box.innerHTML='';
  it.o.forEach(t=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,t);box.appendChild(b)});
  $('next').classList.add('hidden');
}
function pick(btn,t){
  if(locked)return;locked=true;const it=list[i];
  const ok=t===it.c;
  [...$('opts').children].forEach(b=>{b.disabled=true;if(b.textContent===it.c)b.classList.add('ok')});
  if(ok)score++;else{btn.classList.add('bad');wrong.push({q:it.q,mine:t,c:it.c,raw:[it.q,...it.o.filter(x=>x!==it.c).concat([])]})}
  $('sc').textContent='To’g’ri: '+score;
  $('next').textContent=i===list.length-1?'Natijani ko’rish':'Keyingi savol';
  $('next').classList.remove('hidden');$('next').focus();
}
function finish(){
  show('end');$('fin').textContent=score+' / '+list.length;
  $('pct').textContent=Math.round(score/list.length*100)+'% to’g’ri javob';
  $('retry').classList.toggle('hidden',!wrong.length);
  const r=$('rev');r.innerHTML=wrong.length?'<h3>Xato javoblar</h3>':'<p>Barcha javoblar to’g’ri. Ajoyib!</p>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rev';
    const q=document.createElement('b');q.textContent=w.q;
    const a=document.createElement('div');a.className='a';a.style.background='var(--bad-bg)';a.style.color='var(--bad-text)';a.textContent='Sizning javobingiz: '+w.mine;
    const c=document.createElement('div');c.className='a';c.style.background='var(--ok-bg)';c.style.color='var(--ok-text)';c.textContent='To’g’ri javob: '+w.c;
    d.append(q,a,c);r.appendChild(d)});
}
$('next').onclick=()=>{if(i<list.length-1){i++;render()}else{$('pb').style.width='100%';finish()}};
$('go').onclick=()=>{let n=parseInt($('cnt').value)||25;const D=SUBJ[cur].q;n=Math.max(1,Math.min(D.length,n));begin(shuffle(D).slice(0,n))};
$('again').onclick=()=>show('start');
$('retry').onclick=()=>{const ids=new Set(wrong.map(w=>w.q));begin(shuffle(SUBJ[cur].q.filter(r=>ids.has(r[0]))))};
</script></body></html>
